/* ================= 云文档现状快照（用于重复比对） ================= */
// 快照结构 { at, cols:[], cells:{ '2026-10-20|崔三': '单元格原文' }, rows, source:'file'|'paste'|'json' }
function snapTimeLabel(iso){
  var d = iso ? new Date(iso) : null;
  if(!d || isNaN(d.getTime())) return '';
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function snapshotStats(){
  var s = state.docSnapshot;
  if(!s || !s.cells) return null;
  var dates = {}, n = 0;
  Object.keys(s.cells).forEach(function(k){
    if(!String(s.cells[k]||'').trim()) return;
    n++; dates[k.split('|')[0]] = 1;
  });
  return { at: s.at, source: s.source, cells: n, days: Object.keys(dates).length };
}
function snapshotAgeDays(at){
  var ts = snapTs(at);
  if(!ts) return 9999;
  return Math.max(0, Math.floor((Date.now() - ts) / 864e5));
}
// 页面内联的 doc-snapshot.js 与本地快照取「较新」的一份
function snapTs(iso){
  var t = iso ? new Date(iso).getTime() : NaN;
  return isNaN(t) ? 0 : t;
}
function pickSnapshotSource(){
  var bundled = window.__DOC_SNAPSHOT__;
  if(!bundled || !bundled.cells || !Object.keys(bundled.cells).length) return;
  var cur = state.docSnapshot;
  if(!cur || !cur.at || snapTs(bundled.at) > snapTs(cur.at)){
    state.docSnapshot = {
      at: bundled.at || '', cols: bundled.cols || null,
      cells: bundled.cells, source: 'file'
    };
  }
}

// 归一化：去空白与标点，只留文字/数字，用于名称比对
function normCellText(s){
  return String(s==null?'':s)
    .replace(/[\s\u3000]/g,'')
    .replace(/[，,、;；:：。.！!？?（）()【】\[\]《》<>"'“”‘’\-—_/\\|~～]/g,'')
    .toLowerCase();
}
function cellSegments(raw){
  var out = [];
  String(raw||'').split(/\r\n|\r|\n/).forEach(function(line){
    var t = line.trim();
    if(!t) return;
    // 一格可能用分号塞了两场会，逐场拆开，别把两场并成一场、时间只取第一个
    splitMultiMeetings(t).forEach(function(seg){
      seg = String(seg||'').trim();
      if(seg) out.push(seg);
    });
  });
  return out;
}
function hasTimeMark(raw){
  return /(?:\d{1,2}\s*[:：]\s*\d{1,2})|(?:\d{1,2}\s*[点時时])/.test(String(raw||''));
}
// 云文档单元格里是否出现了该开始时间
var PM_MARK = /下午|晚上|傍晚|夜间|pm/i;
function timePresentIn(raw, start){
  var m = minutesOf(start);
  if(m === null) return true;
  var h = Math.floor(m/60), mi = m%60, s = String(raw||'');
  // 24 小时制要能对上 12 小时制写法：15:00 ↔ 下午3:00 / 下午3点 / 下午3时
  var variants = [h];
  if(h > 12) variants.push(h - 12);
  for(var i=0;i<variants.length;i++){
    var hh = variants[i];
    if(hh !== h && !PM_MARK.test(s)) continue;   // 缩成 12 小时制时，必须出现「下午/晚上」等标记，避免误配
    if(new RegExp('(^|[^0-9])'+hh+'\\s*[:：]\\s*0?'+mi+'($|[^0-9])').test(s)) return true;
    if(mi === 0 && new RegExp('(^|[^0-9])'+hh+'\\s*[点時时]').test(s)) return true;
    if(mi !== 0 && new RegExp('(^|[^0-9])'+hh+'\\s*[点時时]\\s*0?'+mi).test(s)) return true;
  }
  return false;
}
function bigramMap(s){
  var m = {}, n = s.length - 1;
  for(var i=0;i<n;i++){ var g = s.substr(i,2); m[g] = (m[g]||0)+1; }
  return m;
}
function diceCoef(a, b){
  if(!a || !b) return 0;
  if(a === b) return 1;
  var A = bigramMap(a), B = bigramMap(b), inter = 0, ca = 0, cb = 0;
  Object.keys(A).forEach(function(g){ ca += A[g]; });
  Object.keys(B).forEach(function(g){ cb += B[g]; if(A[g]) inter += Math.min(A[g], B[g]); });
  if(!ca || !cb) return 0;
  return 2 * inter / (ca + cb);
}
// 单元格里是否已登记这场会（同名 + 同时间；单元格没写时间时只看名称）
function cellHasEvent(cellRaw, e){
  var title = normCellText(e.title);
  if(!title || title.length < 2) return false;
  var segs = cellSegments(cellRaw);
  for(var i=0;i<segs.length;i++){
    var seg = segs[i];
    var parts = seg.split(/[，,、；;。]/).map(normCellText).filter(function(x){ return x.length >= 2; });
    var nameHit = false;
    for(var j=0;j<parts.length;j++){
      var p = parts[j];
      if(p.indexOf(title) >= 0){ nameHit = true; break; }
      if(p.length >= 4 && title.indexOf(p) >= 0){ nameHit = true; break; }
      if(p.length >= 3 && diceCoef(p, title) >= 0.68){ nameHit = true; break; }
    }
    if(!nameHit) continue;
    if(!hasTimeMark(seg) || timePresentIn(seg, e.start)) return true;
  }
  return false;
}
// 一段文字里是不是提到了这场会（名称命中：完全包含 / 反向包含 / 相似度）
function segNameHit(seg, title){
  if(!title) return false;
  var parts = String(seg || '').split(/[，,、；;。]/).map(normCellText).filter(function(x){ return x.length >= 2; });
  for(var j=0;j<parts.length;j++){
    var p = parts[j];
    if(p.indexOf(title) >= 0) return true;
    if(p.length >= 4 && title.indexOf(p) >= 0) return true;
    if(p.length >= 3 && diceCoef(p, title) >= 0.68) return true;
  }
  return false;
}
// 从格子里挑出「这场会」对应的那一段（名称命中 + 时间对得上）；找不到回 null
function segOfEvent(cellRaw, e){
  var title = normCellText(e && e.title);
  if(!title || title.length < 2) return null;
  var segs = cellSegments(cellRaw);
  for(var i=0;i<segs.length;i++){
    if(!segNameHit(segs[i], title)) continue;
    if(!hasTimeMark(segs[i]) || timePresentIn(segs[i], e.start)) return segs[i];
  }
  return null;
}
// 云文档这一段是不是「和本地一模一样的版本」：时间、地点都得对得上。
// cellHasEvent 只认「是不是同一场会」（改期改地点后仍算同一场），这里再严格一层，
// 专门用来判断「要不要把新版写回云文档」——改过时间/地点就必须写。
function cellEntrySame(cellRaw, e){
  var seg = segOfEvent(cellRaw, e);
  if(seg === null) return false;
  if(minutesOf(e.start) !== null && hasTimeMark(seg) && !timePresentIn(seg, e.start)) return false;
  if(e.place){
    var p = findPlace(seg);
    if(!p || !p.place) return false;                   // 云文档那段没写地点，本地有 → 要补上
    var a = normCellText(p.place), b = normCellText(e.place);
    if(!a || !b) return false;
    if(a.indexOf(b) < 0 && b.indexOf(a) < 0) return false;
  }
  return true;
}
// 这场会是不是「刚改过、还没同步出去」？（待清理队列里躺着它的旧版本）
// 是的话：云文档那格现在放的还是旧内容，既不能把旧版当新会再收一条，
// 也不能拿旧内容把本地改过的这场会纠正掉。
function hasEditedTrashOf(x){
  if(!x) return false;
  var ls = (x.leaders || []).map(function(l){ return typeof l === 'string' ? l : l.name; });
  if(!ls.length) return false;
  return (state.trash || []).some(function(t){
    if(t.reason !== 'edited') return false;
    if(!(t.leaders || []).some(function(n){ return ls.indexOf(n) >= 0; })) return false;
    return normCellText(t.title) === normCellText(x.title) || t.date === x.date;
  });
}
// 这场会「改之前」是什么时间/地点：从待清理队列里的「已修改」记录里找。
// 有它才能在一格多场会里精确挑出要替换的那一段（改时间后按新时间是找不到旧段的）。
function editedOldOf(e, leader){
  var hit = (state.trash || []).filter(function(t){
    return t.reason === 'edited' &&
           (t.leaders || []).indexOf(leader) >= 0 &&
           normCellText(t.title) === normCellText(e.title);
  });
  if(!hit.length) return null;
  var t = hit[hit.length - 1];
  return { start: t.start || '', place: t.place || '' };
}
// 格子里「这场会的旧版本」是哪一段？找不到回 null。
// 判断顺序：① 按改之前的开始时间精确命中 ② 整格只有一段同名 → 就是它
// （不满足就宁可当成「另一场会」，另起一条，避免把同格另一场同类会议顶掉）
function staleSegOf(cellRaw, e, leader){
  var title = normCellText(e && e.title);
  if(!title) return null;
  var segs = cellSegments(cellRaw);
  var hits = segs.filter(function(s){ return segNameHit(s, title); });
  if(!hits.length) return null;
  var old = leader ? editedOldOf(e, leader) : null;
  if(old && old.start){
    for(var i=0;i<hits.length;i++){ if(timePresentIn(hits[i], old.start)) return hits[i]; }
  }
  if(hits.length === 1) return hits[0];
  return null;
}
// 这场会在云文档里「已登记，但登记的是旧版本」（时间或地点改过）
function docEntryStale(e, snapObj){
  var s = snapObj || state.docSnapshot;
  if(!s || !s.cells) return false;
  var cols = (s.cols && s.cols.length) ? s.cols : docColumns();
  var ls = (e.leaders||[]).map(function(l){ return typeof l === 'string' ? l : l.name; })
                          .filter(function(n){ return cols.indexOf(n) >= 0; });
  for(var i=0;i<ls.length;i++){
    var t = cellTextIn(s, e.date, ls[i]);
    if(!t) continue;
    if(cellEntrySame(t, e)) continue;                 // 和云文档一致，不算旧版本
    if(staleSegOf(t, e, ls[i])) return true;          // 云端这段就是这场会的旧版本
  }
  return false;
}
function cellTextIn(snap, dateISO, leaderName){
  if(!snap || !snap.cells) return null;
  var k = dateISO + '|' + leaderName;
  return Object.prototype.hasOwnProperty.call(snap.cells, k) ? String(snap.cells[k] || '') : null;
}
function snapshotCellText(dateISO, leaderName){
  return cellTextIn(state.docSnapshot, dateISO, leaderName);
}
// 一场会在某份云文档快照里的登记情况：total 应写列数 / hit 已存在列数
// snapObj 省略时用当前快照；传旧快照可做「上次在、这次没了」的比对
function docEventState(e, snapObj){
  var s = snapObj || state.docSnapshot;
  var cols = (s && s.cols && s.cols.length) ? s.cols : docColumns();
  var ls = (e.leaders||[]).map(function(l){ return typeof l === 'string' ? l : l.name; })
                          .filter(function(n){ return cols.indexOf(n) >= 0; });
  if(!ls.length) return { total:0, hit:0, hitNames:[], state:'none' };
  var hit = 0, names = [];
  ls.forEach(function(n){
    var t = cellTextIn(s, e.date, n);
    if(t && cellHasEvent(t, e)){ hit++; names.push(n); }
  });
  return { total: ls.length, hit: hit, hitNames: names,
           state: hit === 0 ? 'none' : (hit === ls.length ? 'all' : 'partial') };
}
// 卡片角标状态：doc=云文档已确认登记 / pushed=已生成同步包待确认 / ''=未同步
function syncStatusOf(e){
  if(e.docGoneAt) return 'gone';        // 上次在、这次云文档里没了，等下一次检查确认后移除
  var st = state.docSnapshot ? docEventState(e) : null;
  if(st && st.state === 'all'){
    // 云文档里这场会还在，但时间/地点是旧的（本地改过）→ 还得再写一次
    return docEntryStale(e) ? 'stale' : 'doc';
  }
  if(st && st.state === 'partial') return 'partial';
  // 按「名称 + 新时间」在云文档里认不出来，但格子里确实有这场会的旧版本
  // （改了开始时间就是这样）→ 还得再写一次，别让卡片显示成「已同步」
  if(st && docEntryStale(e)) return 'stale';
  if(e.syncedAt) return 'pushed';
  return '';
}

/* ---------- 删除 / 修改记录（用于把「删除」也同步到云文档） ---------- */
var TRASH_MAX = 300;
// 取一场会里跟云文档登记有关的字段
function eventFingerprint(e){
  return {
    date: e.date || '', start: e.start || '', title: e.title || '', place: e.place || '',
    leaders: (e.leaders || []).map(function(l){ return typeof l === 'string' ? l : l.name; })
  };
}
function fpKey(f){
  return [f.date, f.start, f.title, (f.leaders||[]).join('、')].join('|');
}
// 记录一条待清理的登记（重复记录会合并）
function pushTrash(f, reason){
  if(!f || !f.date || !f.title) return null;
  var key = fpKey(f);
  if(state.trash.some(function(t){ return fpKey(t) === key; })) return null;
  var item = {
    id: uid('tr_'), reason: reason || 'deleted', at: new Date().toISOString(),
    date: f.date, start: f.start || '', title: f.title, place: f.place || '',
    leaders: (f.leaders || []).slice()
  };
  state.trash.push(item);
  if(state.trash.length > TRASH_MAX) state.trash = state.trash.slice(-TRASH_MAX);
  saveState();
  return item;
}
function dropTrash(ids){
  if(!ids || !ids.length) return;
  var m = {};
  ids.forEach(function(id){ m[id] = 1; });
  state.trash = state.trash.filter(function(t){ return !m[t.id]; });
  saveState();
}
// 比对「云文档现状」，列出确实还留在表里、应当删掉的登记
function buildRemovalPlan(){
  var cols = docColumns(), items = [], gone = [];
  (state.trash || []).forEach(function(t){
    var off = (t.leaders || []).filter(function(n){ return isInactiveOn(n, t.date); });
    var ls = (t.leaders || []).filter(function(n){ return cols.indexOf(n) >= 0 && off.indexOf(n) < 0; });
    if(!ls.length){
      gone.push({ trashId: t.id, reason: off.length ? '该领导已调出，不再改动他的列' : '参会领导不在云文档的列里，无需删除', item: t });
      return;
    }
    ls.forEach(function(name){
      var cell = snapshotCellText(t.date, name);
      if(!cell || !String(cell).trim()){
        gone.push({ trashId: t.id, leader: name, reason: '云文档该格本来就是空的', item: t });
        return;
      }
      if(!cellHasEvent(cell, { title: t.title, start: t.start })){
        gone.push({ trashId: t.id, leader: name, reason: '云文档里已找不到这条登记（可能被手工改过）', item: t });
        return;
      }
      items.push({
        trashId: t.id, reason: t.reason, date: t.date, leader: name,
        title: t.title, start: t.start, place: t.place, existing: String(cell)
      });
    });
  });
  return { items: items, gone: gone };
}
// 「确认已经从云文档删掉」的清理：removed 的条目出队，找不到的也出队（结果里另行提示）
function applyRemoveResult(rem, planned){
  var okIds = [], missed = [], okKeys = [];
  var planById = {};
  // 注意：键必须与下面查表用的键一致（date|leader），否则永远匹配不上、队列永远清不掉
  (planned || []).forEach(function(p){ planById[p.date + '|' + p.leader] = p; });
  (rem.removed || []).forEach(function(r){
    var p = planById[r.date + '|' + r.leader];
    if(p){ okIds.push(p.trashId); okKeys.push(r.date + '|' + r.leader); }
  });
  (rem.notFound || []).forEach(function(r){
    var p = planById[r.date + '|' + r.leader];
    if(p){ okIds.push(p.trashId); missed.push(r); }
  });
  (rem.emptied || []).forEach(function(r){
    var p = planById[r.date + '|' + r.leader];
    if(p){ okIds.push(p.trashId); okKeys.push(r.date + '|' + r.leader); }
  });
  dropTrash(okIds);
  // 我们主动撤下的登记，格位标记一并作废：否则「改过之后再写回新内容」会被
  // 「云文档里这条被人工删了，别写回」的保护逻辑挡在门外。
  if(state.marks) okKeys.forEach(function(k){ delete state.marks[k]; });
  if(rem.snapshot && rem.snapshot.cells){
    state.docSnapshot = { at: rem.snapshot.at, cols: rem.snapshot.cols, cells: rem.snapshot.cells, source: 'file' };
    state.docSig = snapSigOf(rem.snapshot);
  }
  saveState(true);   // 只落本地，别再触发一轮推送
  return { ok: okIds.length, missed: missed };
}

/* ---------- 粘贴/导入云文档内容 ---------- */
function splitQuoted(line, sep){
  var out = [], cur = '', inQ = false;
  for(var i=0;i<line.length;i++){
    var ch = line.charAt(i);
    if(ch === '"'){
      if(inQ && line.charAt(i+1) === '"'){ cur += '"'; i++; }
      else inQ = !inQ;
    }else if(ch === sep && !inQ){ out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
function normLeaderName(c){
  return String(c||'').replace(/[，,（(].*$/,'').replace(/[\s\u3000]/g,'').trim();
}
function parseSnapshotText(text, cols){
  var raw = String(text||'').replace(/\r\n?/g,'\n').trim();
  var snap = { at: new Date().toISOString(), cols: cols.slice(0), cells: {}, rows: 0, source: 'paste' };
  if(!raw) return snap;

  if(raw.charAt(0) === '{'){
    try{
      var j = JSON.parse(raw);
      if(j && j.cells){
        Object.keys(j.cells).forEach(function(k){
          var v = j.cells[k];
          if(v != null && String(v).trim()) snap.cells[k] = String(v);
        });
        if(j.at) snap.at = j.at;
        if(Array.isArray(j.cols) && j.cols.length) snap.cols = j.cols;
        snap.source = 'json';
        snap.rows = Object.keys(snap.cells).length;
        return snap;
      }
    }catch(e){}
  }

  // 合并被引号包裹的跨行单元格（Excel/金山表格复制含换行的单元格时会这样）
  var lines = raw.split('\n'), merged = [];
  for(var i=0;i<lines.length;i++){
    var cur = lines[i], q = (cur.match(/"/g)||[]).length;
    while(q % 2 === 1 && i+1 < lines.length){
      i++; cur += '\n' + lines[i];
      q += (lines[i].match(/"/g)||[]).length;
    }
    merged.push(cur);
  }

  var colMap = null, refDate = new Date(), rawRows = 0;

  merged.forEach(function(line){
    if(!line.trim()) return;
    var sep = line.indexOf('\t') >= 0 ? '\t' : (line.indexOf('|') >= 0 ? '|' : '');

    if(!sep){   // 纯文本兜底：一行里带日期 + 领导名
      var nl = normalizeText(line);
      var dm0 = findDate(nl, refDate);
      if(!dm0) return;
      var who = null;
      cols.forEach(function(n){ if(!who && nl.indexOf(n) >= 0) who = n; });
      if(!who) return;
      var body = nl.replace(dm0.raw, ' ').replace(who, ' ')
        .replace(/(?:星期|周)[一二三四五六日天]/g, ' ')
        .replace(/^[\s,;:。、|]+|[\s,;:。、|]+$/g, '');
      if(!body) return;
      var k0 = dm0.date + '|' + who;
      snap.cells[k0] = snap.cells[k0] ? (snap.cells[k0] + '\n' + body) : body;
      rawRows++;
      return;
    }

    var cells;
    if(sep === '\t') cells = splitQuoted(line, '\t');
    else cells = line.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(function(s){ return s.trim(); });

    if(cells.length && cells.every(function(c){ return !String(c).trim() || /^:?-{2,}:?$/.test(String(c).trim()); })) return;

    if(!colMap){
      var hits = 0, tmp = {};
      cells.forEach(function(c, idx){
        var k = cols.indexOf(normLeaderName(c));
        if(k >= 0){ tmp[idx] = cols[k]; hits++; }
      });
      if(hits >= 2){ colMap = tmp; return; }    // 表头行
      // 无表头：第 0 列日期，第 1 列若是星期则跳过，其余按领导列顺序
      var start = 1;
      if(cells.length > 1 && /^(?:星期|周|礼拜)[一二三四五六日天]?$/.test(String(cells[1]||'').trim())) start = 2;
      colMap = {};
      for(var ci=0; ci<cols.length; ci++) colMap[start+ci] = cols[ci];
    }

    var dm = findDate(normalizeText(String(cells[0]||'')), refDate);
    if(!dm) return;
    Object.keys(colMap).forEach(function(idx){
      var v = cells[+idx];
      if(v == null) return;
      v = String(v).replace(/^"|"$/g,'').trim();
      if(!v) return;
      snap.cells[dm.date + '|' + colMap[idx]] = v;
    });
    rawRows++;
  });

  snap.rows = rawRows;
  return snap;
}
function applySnapshot(snap){
  if(!snap) return;
  state.docSnapshot = snap;
  saveState();
}

/* ================= 本地同步服务（网页直连云文档） ================= */
// 浏览器不能持有云端凭证，所以由同机的一个小服务代跑；本机没启动服务时，仍可用「生成同步包」的老路子。
var BRIDGE = { online:false, authed:false, base:'', doc:null, tokenExpiresAt:'', loginState:'idle', checked:false,
               version:'', features:null };   // features 为服务端能力清单，缺 remove 说明跑的是旧版服务

function bridgeBase(){
  // 页面本身就是同步服务托管时（127.0.0.1:7788），同源调用
  if(location.port === '7788') return '';
  return 'http://127.0.0.1:7788';
}
function bridgeFetch(pathname, opts){
  if(typeof fetch !== 'function') return Promise.reject(new Error('当前环境不支持网络请求'));
  var o = Object.assign({ cache:'no-store' }, opts || {});
  if(o.body && typeof o.body !== 'string'){
    o.body = JSON.stringify(o.body);
    o.headers = Object.assign({'Content-Type':'application/json'}, o.headers || {});
  }
  return fetch((BRIDGE.base || '') + pathname, o).then(function(r){
    return r.text().then(function(txt){
      var data = null;
      try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
      if(!r.ok){
        // 口令失效（服务重启/口令变更）→ 跳回口令输入页
        if(data && data.error === 'NO_ACCESS' && data.needAuth){
          try{ if(location.pathname !== '/gate') location.href = '/gate'; }catch(e){}
        }
        var err = new Error((data && (data.message || data.error)) || ('HTTP ' + r.status));
        err.code = data && data.error; err.status = r.status;
        throw err;
      }
      return data;
    });
  });
}
// 服务端能力核对：老版本服务不返回 features，此时按「未知」放行（先试，失败再提示重启）
function bridgeSupports(name){
  if(!BRIDGE.features) return true;
  return BRIDGE.features.indexOf(name) >= 0;
}
// 服务在线但版本落后（例如没有删除能力）→ 需要重启黑窗口
function bridgeStale(){
  return !!(BRIDGE.online && BRIDGE.features && BRIDGE.features.indexOf('remove') < 0);
}
// 顶部「同步状态」按钮：外观与其它功能按钮一致，状态只用左侧小圆点 + 短文案表达
function renderRtChip(){
  var el = $('bridgeChip');
  if(!el) return;
  var cfg = rtCfg();
  var dot = el.querySelector('.rt-dot'), txt = el.querySelector('.rt-txt');
  if(!txt){
    el.innerHTML = '<i class="rt-dot"></i><span class="rt-txt"></span>';
    dot = el.querySelector('.rt-dot'); txt = el.querySelector('.rt-txt');
  }
  var cls = 'rt-chip', label = '', tip = '', detail = '';
  if(!BRIDGE.checked){
    cls += ' idle'; label = '检测同步服务…'; tip = '正在检测本机同步服务';
  }else if(!BRIDGE.online){
    cls += ' off'; label = '同步服务未启动';
    tip = '双击「启动同步服务.bat」后即可实时同步云文档';
  }else if(!BRIDGE.authed){
    cls += ' warn'; label = '登录金山文档';
    tip = '同步服务在线，点这里登录金山文档，之后自动实时同步';
  }else if(!cfg.enabled){
    cls += ' off'; label = '实时同步已关';
    tip = '已连上金山文档，但实时同步被关闭，点这里重新开启';
  }else if(RT.pushing){
    cls += ' busy'; label = '正在写入云文档…'; tip = '刚刚的改动正在写进云文档';
  }else if(RT.pulling){
    cls += ' busy'; label = '正在读取云文档…'; tip = '正在检查云文档有没有新变化';
  }else if(RT.lastErr){
    cls += ' err'; label = '同步异常';
    tip = '上次同步出错：' + RT.lastErr + '（会自动重试，点这里看详情）';
  }else{
    cls += ' on'; label = '实时同步中';
    tip = '本地改动 1.5 秒内写入云文档；云文档改动 ' + Math.round((cfg.interval || 0) / 1000) + ' 秒内读回';
  }
  if(BRIDGE.tokenExpiresAt && BRIDGE.authed) detail = '，登录有效期至 ' + BRIDGE.tokenExpiresAt;
  el.className = cls;
  if(txt) txt.textContent = label;
  el.title = tip + detail + '（点击查看同步设置）';
}
// 兼容旧调用名
function renderBridgeChip(){ renderRtChip(); }
/* ---------------- 重启本机同步服务 ---------------- */
// 服务进程里跑的是启动那一刻的代码：改了 bridge/server.mjs 不重启就不生效。
// 而服务由计划任务以高权限启动，普通窗口/网页都杀不掉它，只能让它自己退出，
// 再由守护进程用磁盘上的新代码重新拉起。
function restartBridge(){
  if(!BRIDGE.online){
    toast('同步服务没在运行，先双击「启动同步服务.bat」', 6000);
    return;
  }
  if(!confirm('重启本机同步服务？\n\n页面会自动刷新，会议数据都在，不会丢。')) return;
  toast('正在重启同步服务…', 4000);
  bridgeFetch('/api/restart', { method:'POST' }).then(function(){
    var tries = 0;
    var timer = setInterval(function(){
      tries++;
      bridgeFetch('/api/ping', { cache:'no-store' }).then(function(d){
        clearInterval(timer);
        if(d && d.ok){
          toast('同步服务已重启（版本 ' + (d.version || '?') + '），页面即将刷新', 3000);
          setTimeout(function(){ location.reload(); }, 900);
        }
      }).catch(function(){
        if(tries >= 40){ clearInterval(timer); toast('重启后没等到服务响应，请重新打开页面试试', 8000); }
      });
    }, 800);
  }).catch(function(e){
    if(e && (e.status === 404 || /未知接口/.test(e.message || ''))){
      toast('同步服务还是旧版本，认不出「重启」：这次请重启电脑，之后就能一键重启了', 9000);
    }else{
      toast('重启失败：' + ((e && e.message) || '未知原因'), 7000);
    }
  });
}

function probeBridge(){
  BRIDGE.base = bridgeBase();
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 2000);
  var opt = { method:'GET' };
  if(ctrl) opt.signal = ctrl.signal;
  return bridgeFetch('/api/ping', opt).then(function(d){
    clearTimeout(timer);
    BRIDGE.online = !!(d && d.ok);
    BRIDGE.authed = !!(d && d.authed);
    BRIDGE.doc = (d && d.doc) || null;
    BRIDGE.tokenExpiresAt = (d && d.tokenExpiresAt) || '';
    BRIDGE.loginState = (d && d.loginState) || 'idle';
    BRIDGE.version = (d && d.version) || '';
    BRIDGE.features = (d && Array.isArray(d.features)) ? d.features : null;
    BRIDGE.checked = true;
    renderRtChip();
    // 服务在线且支持文件夹监听 → 开始轮询待办队列
    try{ if(typeof watchSync === 'function') watchSync(); }catch(e){}
    return BRIDGE.online;
  }).catch(function(){
    clearTimeout(timer);
    BRIDGE.online = false; BRIDGE.authed = false; BRIDGE.checked = true;
    BRIDGE.features = null;
    renderRtChip();
    try{ if(typeof watchSync === 'function') watchSync(); }catch(e){}
    return false;
  });
}
// 打开金山文档授权页 → 轮询授权结果
function bridgeLogin(onDone){
  toast('正在打开金山文档授权页…', 3000);
  bridgeFetch('/api/login/start', { method:'POST' }).then(function(d){
    if(!d || !d.url) throw new Error('未取到授权链接');
    try{ window.open(d.url, '_blank', 'noopener'); }catch(e){}
    toast('请在打开的页面里登录并点「同意」，完成后本页会自动继续', 6000);
    var tries = 0;
    var timer = setInterval(function(){
      tries++;
      bridgeFetch('/api/login/status').then(function(st){
        BRIDGE.authed = !!(st && st.authed);
        BRIDGE.loginState = (st && st.state) || 'pending';
        BRIDGE.tokenExpiresAt = (st && st.tokenExpiresAt) || '';
        if(st && st.state === 'ok' && st.authed){
          clearInterval(timer); renderBridgeChip();
          toast('已登录金山文档，可以直连同步了');
          if(onDone) onDone(true);
          return;
        }
        if(st && ['denied','cancelled','timeout','error'].indexOf(st.state) >= 0){
          clearInterval(timer); renderBridgeChip();
          var msg = st.state === 'denied' ? '当前是 WPS 企业账号，暂不支持直连，请切换个人账号后重试'
                  : st.state === 'cancelled' ? '授权已取消'
                  : st.state === 'timeout' ? '授权超时，请重新点登录'
                  : '授权未完成，请重试';
          toast(msg, 7000);
          if(onDone) onDone(false);
        }
      }).catch(function(){ /* 服务可能已退出，继续等或超时 */ });
      if(tries > 300){ clearInterval(timer); if(onDone) onDone(false); }
    }, 1200);
  }).catch(function(e){
    toast('无法启动登录：' + e.message + '（请确认同步服务已启动）', 6000);
    if(onDone) onDone(false);
  });
}

/* ---------------- 云文档单元格 → 日历事件 ---------------- */
function parseDocCell(raw, dateISO){
  var cfg = cfgForParse(), out = [];
  cellSegments(raw).forEach(function(line){
    var s = String(line).replace(/^[\s·•\-–—]+/, '').trim();
    if(!s) return;
    // 「调出」「借调」等人事状态、「外出培训」等占位，都不是会议，直接跳过
    if(personnelStatusOf(s) || trainingMarkerOf(s)) return;
    var t = findTime(s);
    var p = findPlace(s);
    var w = s;
    if(t) w = w.replace(t.raw, ' ');
    if(p) w = w.replace(p.raw, ' ');
    var notes = [];
    w = w.replace(/[（(]([^）)]{1,40})[）)]/g, function(_, inner){ notes.push(String(inner).trim()); return ' '; });
    w = w.replace(/(?:会议名称|会议内容|议题|内容|主题)\s*[:：]\s*/g, ' ');
    w = w.replace(/[，,；;、]/g, ' ').replace(/^(?:在|于)+/, '').replace(/\s+/g, ' ').trim();
    var title = fallbackTitle(w);
    if(!title) title = cleanTitle(w).slice(0, 40);
    if(!title) title = '未命名会议';
    out.push({
      date: dateISO, start: t ? t.start : '', place: p ? p.place : '',
      title: title, type: classifyType(s, cfg), note: notes.join('；'), raw: s
    });
  });
  return out;
}
function sameMeetingTitle(a, b){
  var x = normCellText(a), y = normCellText(b);
  if(!x || !y) return false;
  if(x === y) return true;
  if(x.length >= 4 && y.length >= 4 && (x.indexOf(y) >= 0 || y.indexOf(x) >= 0)) return true;
  return diceCoef(a, b) >= 0.7;
}
function placeCompatible(a, b){
  if(!a || !b) return true;
  var x = normCellText(a), y = normCellText(b);
  if(!x || !y) return true;
  return x.indexOf(y) >= 0 || y.indexOf(x) >= 0;
}
// 同一场会在多个领导列里各登一条，按「日期 + 时间 + 名称」合并成一条事件、多个参会领导
function cellsToEvents(snap){
  var cols = (snap && snap.cols && snap.cols.length) ? snap.cols : docColumns();
  var out = [];
  Object.keys((snap && snap.cells) || {}).forEach(function(k){
    var i = k.indexOf('|');
    if(i < 0) return;
    var date = k.slice(0, i), leader = k.slice(i + 1);
    var raw = snap.cells[k];
    if(!String(raw || '').trim()) return;
    if(cols.indexOf(leader) < 0) return;
    // 状态格（如「调出」）不是会议，跳过
    if(cellStatusOf(raw)) return;
    // 已调出的领导：生效日期之后的登记不再当成他的参会记录
    if(isInactiveOn(leader, date)) return;
    parseDocCell(raw, date).forEach(function(it){
      var hit = null;
      for(var j = 0; j < out.length; j++){
        var x = out[j];
        if(x.date !== it.date) continue;
        if(x.start && it.start && x.start !== it.start) continue;
        if(!sameMeetingTitle(x.title, it.title)) continue;
        if(!placeCompatible(x.place, it.place)) continue;
        hit = x; break;
      }
      if(!hit){
        hit = { date:it.date, start:it.start, place:it.place, title:it.title, type:it.type, note:it.note || '', leaders:[], raw:it.raw };
        out.push(hit);
      }
      if(!hit.leaders.some(function(l){ return l.name === leader; })){
        var L = state.leaders.find(function(x){ return x.name === leader; });
        hit.leaders.push({ name: leader, role: L ? (L.title || '') : '' });
      }
      if(!hit.place && it.place) hit.place = it.place;
      if(!hit.start && it.start) hit.start = it.start;
      if(!hit.note && it.note) hit.note = it.note;
    });
  });
  return out;
}
// 把云文档里的事件并入本地：同一天同一场会就补全字段、合并参会领导；没有就新增
function mergeDocEvents(list, snap){
  var at = (snap && snap.at) || new Date().toISOString();
  var added = 0, merged = 0;
  list.forEach(function(d){
    var hit = null;
    for(var i = 0; i < state.events.length; i++){
      var e = state.events[i];
      if(e.date !== d.date) continue;
      if(!sameMeetingTitle(e.title, d.title)) continue;
      if(e.start && d.start && e.start !== d.start) continue;
      hit = e; break;
    }
    if(hit){
      merged++;
      var diff = false;                 // 云端那格放的是不是「改之前」的旧内容
      if(!hit.start && d.start) hit.start = d.start;
      else if(hit.start && d.start && hit.start !== d.start) diff = true;
      if(!hit.place && d.place) hit.place = d.place;
      else if(hit.place && d.place && normCellText(hit.place) !== normCellText(d.place)) diff = true;
      hit.leaders = hit.leaders || [];
      d.leaders.forEach(function(l){
        if(!hit.leaders.some(function(x){ return x.name === l.name; })) hit.leaders.push(l);
      });
      if(!hit.note && d.note) hit.note = d.note;
      // 云端还是旧地点的话，这场会得重新写一次，别顺手标成「已同步」把待同步队列清掉
      if(diff) hit.syncedAt = null;
      else hit.syncedAt = hit.syncedAt || at;
      hit.source = 'doc';
    }else if(hasEditedTrashOf(d)){
      // 云端这条是「改之前」的旧登记（本地已经改成新的、还没同步出去）：
      // 交给同步流程去替换，别把旧版本再收成一场新会，否则日历里会新旧各一条。
    }else{
      state.events.push({
        id: uid(), date: d.date, start: d.start, place: d.place, title: d.title, type: d.type,
        leaders: d.leaders.slice(), note: d.note || '', syncedAt: at, source: 'doc',
        createdAt: new Date().toISOString()
      });
      added++;
    }
  });
  return { added: added, merged: merged };
}
function uid(p){ return (p || 'ev_') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// 老版本把「一格两场会」并成一场时留下的错记录（时间取了第一个、名字取了最后一个），
// 读回时按云文档重新解析一遍，对不上的旧云端来源记录清掉。
// 只动 source==='doc'（从云端来的）记录，手动添加的一律不碰；
// 而且要「该领导在该日期这一格本次解析成功」才动，避免解析失败时误删。
function pruneStaleDocEvents(snap){
  var cells = (snap && snap.cells) || {};
  var cols = (snap && snap.cols && snap.cols.length) ? snap.cols : docColumns();
  var rebuilt = {};
  Object.keys(cells).forEach(function(k){
    var i = k.indexOf('|');
    if(i < 0) return;
    var d = k.slice(0, i), name = k.slice(i + 1);
    if(cols.indexOf(name) < 0) return;
    var raw = cells[k];
    if(!String(raw || '').trim()) return;
    if(cellStatusOf(raw)) return;
    if(isInactiveOn(name, d)) return;
    var parsed = parseDocCell(raw, d);
    if(parsed.length) rebuilt[d + '|' + name] = parsed;
  });
  var removed = 0;
  state.events = state.events.filter(function(e){
    if(e.source !== 'doc') return true;
    if(hasEditedTrashOf(e)) return true;    // 刚改过、还没同步出去，不能按云端旧内容纠正掉
    var ls = (e.leaders || []).map(function(l){ return l.name; });
    if(!ls.length) return true;
    // 这个事件的每个参会领导，对应格位本次都得解析成功，才算「有资格被纠正」
    var covered = ls.every(function(n){ return !!rebuilt[e.date + '|' + n]; });
    if(!covered) return true;
    var still = ls.some(function(n){
      return (rebuilt[e.date + '|' + n] || []).some(function(it){
        return sameMeetingTitle(it.title, e.title) && (!e.start || !it.start || it.start === e.start);
      });
    });
    if(still) return true;
    removed++;
    return false;
  });
  return removed;
}

// 云文档里被删掉的登记 → 日历同步删（保持两边一致）
// 判断依据：上一份快照里「确实登记过」（hit>0），这一份里它所有列都找不到了。
// 两段式确认：第一次只记账并把卡片标成「云文档已删除」，下一次仍不在才真删——
// 防止某一次读取异常把日历清空。用户手动点「立即读回」时（force）一次即删。
var GONE_BATCH_LIMIT = 8;   // 一次少这么多场就停手，交给用户确认（防「整篇被换掉」式误删）
function reconcileCloudGone(prevSnap, snap, force){
  var res = { marked:0, removed:0, held:0, titles:[] };
  var cells = (snap && snap.cells) || {};
  var cols = (snap && snap.cols && snap.cols.length) ? snap.cols : docColumns();
  // 整张表读成空的（接口异常 / 文档被清空）：绝不动日历
  if(!Object.keys(cells).length) return res;
  var prev = (prevSnap && prevSnap.cells && Object.keys(prevSnap.cells).length) ? prevSnap : null;
  state.cloudGone = state.cloudGone || [];
  var cur = { cols: cols, cells: cells };
  var now = new Date().toISOString();
  var confirmed = [];
  state.events.forEach(function(e){
    if(!e.date || !e.leaders || !e.leaders.length) return;
    if(e.heldLocal){ delete e.docGoneAt; return; }             // 用户要求留在本地，不再自动删
    var ls = e.leaders.map(function(l){ return typeof l === 'string' ? l : l.name; })
                       .filter(function(n){ return cols.indexOf(n) >= 0; });
    if(!ls.length){
      // 参会领导都不在表里（列被删/改名），判断不了「是不是被删了」，不动
      delete e.docGoneAt; return;
    }
    if(docEventState(e, cur).hit > 0){ delete e.docGoneAt; return; }   // 还在云文档里，正常
    // 证据：上一次快照里在 / 已确认过一次 / 我们确实写过或从云端读过
    var evidence = (prev && docEventState(e, prev).hit > 0) ||
                   !!e.docGoneAt || !!e.syncedAt || e.source === 'doc';
    if(!evidence) return;                                      // 本来就没登记过 → 属于「待同步」
    if(e.docGoneAt || force){ confirmed.push(e); return; }     // 够条件了，先收集，稍后统一处理
    e.docGoneAt = now; res.marked++;                           // 第一次发现，先记下，下次确认
  });
  if(!confirmed.length) return res;
  // 一次消失太多：只标记不删，留给用户在同步面板里确认
  if(!force && confirmed.length > GONE_BATCH_LIMIT){
    res.held = confirmed.length;
    return res;
  }
  var ids = {};
  confirmed.forEach(function(e){
    ids[e.id] = 1;
    state.cloudGone.push({ at: now, event: JSON.parse(JSON.stringify(e)) });
    res.titles.push(e.title);
  });
  if(state.cloudGone.length > 120) state.cloudGone = state.cloudGone.slice(-120);
  state.events = state.events.filter(function(e){ return !ids[e.id]; });
  res.removed = confirmed.length;
  return res;
}

// 同步面板里「确认删除」：把标记为待删除的会议一次性删掉
function purgeGonePending(){
  var list = state.events.filter(function(e){ return e.docGoneAt; });
  if(!list.length) return 0;
  var now = new Date().toISOString();
  state.cloudGone = state.cloudGone || [];
  list.forEach(function(e){
    state.cloudGone.push({ at: now, event: JSON.parse(JSON.stringify(e)) });
  });
  if(state.cloudGone.length > 120) state.cloudGone = state.cloudGone.slice(-120);
  var ids = {}; list.forEach(function(e){ ids[e.id] = 1; });
  state.events = state.events.filter(function(e){ return !ids[e.id]; });
  saveState(); renderWeek(); updateSyncBadge();
  toast('已从日历删除 ' + list.length + ' 场会', 4000);
  return list.length;
}
// 同步面板里「保留在本地」：别再自动删它们了
function holdGonePending(){
  var list = state.events.filter(function(e){ return e.docGoneAt; });
  list.forEach(function(e){ e.docGoneAt = null; e.heldLocal = true; });
  saveState(); renderWeek();
  toast('已保留 ' + list.length + ' 场会在本地，不再自动删除', 4500);
  return list.length;
}

// 把「因云文档删除而被移除」的会议恢复到日历：只留在本地，不自动写回云文档
function restoreCloudGone(){
  var list = state.cloudGone || [];
  if(!list.length){ toast('没有可恢复的记录'); return 0; }
  var n = 0, now = new Date().toISOString();
  list.forEach(function(g){
    var e = g && g.event;
    if(!e || !e.date || !e.title) return;
    var dup = state.events.some(function(x){
      return x.date === e.date && sameMeetingTitle(x.title, e.title) &&
             (!x.start || !e.start || x.start === e.start);
    });
    if(dup) return;
    var copy = JSON.parse(JSON.stringify(e));
    copy.id = uid('ev_');
    copy.heldLocal = true;                 // 不再被「云文档里没有这条」自动删掉
    delete copy.docGoneAt;
    copy.syncedAt = copy.syncedAt || now;  // 不重新排队写入，免得和云文档打架
    state.events.push(copy); n++;
  });
  state.cloudGone = [];
  saveState(); renderWeek(); updateSyncBadge();
  toast(n ? ('已恢复 ' + n + ' 场会到日历（仅本地，不会写回云文档）') : '这些会议已经在日历里了', 5000);
  return n;
}

var HISTORY_KEY = 'ytzj_doc_history_imported_v1';
// 首次打开时，把云文档里已有记录一次性导进日历（依据随包的 doc-snapshot.js，离线也能跑）
function importHistoryFromSnapshot(silent){
  try{ if(localStorage.getItem(HISTORY_KEY)) return null; }catch(e){}
  var snap = state.docSnapshot;
  if(!snap || !snap.cells || !Object.keys(snap.cells).length) return null;
  var list = cellsToEvents(snap);
  if(!list.length) return null;
  var r = mergeDocEvents(list, snap);
  try{ localStorage.setItem(HISTORY_KEY, new Date().toISOString()); }catch(e){}
  saveState();
  if(!silent) toast('已从云文档导入历史记录：新增 ' + r.added + ' 场会议', 5000);
  return r;
}
// 主动从云文档读回（走本地服务，取的是云上最新数据）
// 云文档内容指纹（页面侧兜底）：服务是旧版本、没返回 changed 时，靠它判断「真的没变」，
// 避免每 30 秒白合并一次、把日历重绘一遍。
function snapSigOf(snap){
  if(!snap) return '';
  var keys = Object.keys(snap.cells || {}).sort();
  var s = (snap.cols || []).join('\u0001');
  for(var i=0;i<keys.length;i++) s += '\u0002' + keys[i] + '\u0003' + snap.cells[keys[i]];
  var h = 5381;
  for(var j=0;j<s.length;j++) h = ((h << 5) + h + s.charCodeAt(j)) >>> 0;
  return h.toString(36) + '-' + s.length.toString(36);
}
// opts.auto=true：后台轮询调用。内容没变就什么都不做（不重绘、不写 localStorage、不弹提示）
function pullFromDoc(btn, silent, opts){
  var auto = !!(opts && opts.auto);
  var setBusy = function(on){
    if(!btn) return;
    if(on){ btn.classList.add('busy'); btn.setAttribute('data-txt', btn.textContent); btn.textContent = '正在读取云文档…'; }
    else{ btn.classList.remove('busy'); if(btn.getAttribute('data-txt')) btn.textContent = btn.getAttribute('data-txt'); }
  };
  setBusy(true);
  return bridgeFetch('/api/snapshot').then(function(d){
    setBusy(false);
    if(!d || !d.snapshot) throw new Error('未取到表格数据');
    var snap = d.snapshot;
    var sig = snapSigOf(snap);
    // 先处理「云文档里被删掉的」：这一步必须跑在「内容没变就收工」之前，
    // 否则上一轮已记为待确认的会议会一直卡着删不掉（内容没变 = 还是不在）。
    var goneR = reconcileCloudGone(state.docSnapshot, snap, !auto);
    // 服务端算的内容指纹说没变，或者页面自己算出来一样 → 云文档没动过，直接收工
    if(auto && !goneR.removed && !goneR.marked &&
       (d.changed === false || (state.docSig && sig === state.docSig))){
      state.docSig = sig;
      // 批量拦下时内容往往没变，这里补一次提示（每次会话只提醒一次）
      if(goneR.held && RT && RT.heldAlerted !== goneR.held){
        RT.heldAlerted = goneR.held;
        toast('云文档里一次少了 ' + goneR.held + ' 场会，为防误删先没动，请到「同步云文档」确认', 7000);
      }
      return { added:0, merged:0, pruned:0, trainings:0, gone:0, goneMarked:0, goneHeld:goneR.held, unchanged:true };
    }
    state.docSig = sig;
    state.docSnapshot = { at: snap.at, cols: snap.cols, cells: snap.cells, source: 'file' };
    var list = cellsToEvents(snap);
    var r = mergeDocEvents(list, snap);
    r.pruned = pruneStaleDocEvents(snap);
    r.gone = goneR.removed; r.goneMarked = goneR.marked; r.goneHeld = goneR.held;
    cleanupStatusEvents();
    r.trainings = importTrainingsFromSnapshot();
    try{ localStorage.setItem(HISTORY_KEY, new Date().toISOString()); }catch(e){}
    saveState(); renderWeek(); updateSyncBadge();
    var touched = r.added || r.merged || r.pruned || r.trainings || r.gone || r.goneMarked;
    // 顺带取一次共用状态（裁决 / 培训），最多 40 秒一次，别把云接口打太勤
    if(Date.now() - CSTATE.at > 40000) cloudStateFetch(false);
    if(!silent) toast('已读回云文档：识别 ' + list.length + ' 场会，新增 ' + r.added + '、更新 ' + r.merged +
      (r.pruned ? '、修正 ' + r.pruned + ' 条旧记录' : '') +
      (r.trainings ? '，整理外出培训 ' + r.trainings + ' 条' : '') +
      (r.gone ? '；云文档里已删除 ' + r.gone + ' 场，已从日历移出' : '') +
      (r.goneMarked ? '；' + r.goneMarked + ' 场在云文档里查不到了，下次检查确认后移除' : '') +
      (r.goneHeld ? '；另有 ' + r.goneHeld + ' 场一次查不到，数量偏多未自动删，请到同步面板确认' : ''), 7000);
    else if(auto && touched) toast(
      (r.gone ? ('云文档里删掉了 ' + r.gone + ' 场会，已从日历同步移除（同步面板可恢复）')
              : ('云文档已更新并读回：新增 ' + r.added + '、更新 ' + r.merged)) +
      (r.goneMarked ? '；' + r.goneMarked + ' 场待确认' : ''), 5000);
    return r;
  }).catch(function(e){
    setBusy(false);
    if(e.code === 'NO_AUTH'){
      BRIDGE.authed = false; renderRtChip();
      if(!silent){ toast('需要先登录金山文档', 4000); openSync(false); }
    }else if(!silent){
      toast('读回失败：' + e.message, 6000);
    }
    throw e;
  });
}

/* ---------------- 直连写入 ---------------- */
function planToPushItems(plan){
  return (plan.items || []).map(function(it){
    var e = state.events.find(function(x){ return x.id === it.eventId; });
    return {
      date: it.date, leader: it.leader, text: it.text,
      title: e ? e.title : '', start: e ? e.start : '',
      place: e ? (e.place || '') : '',
      updated: !!it.updated,        // 云文档里是旧版本 → 让服务端就地替换那一段，别追加
      oldStart: it.oldStart || '',  // 改之前的时间，服务端靠它在一格多场会里挑准旧段
      oldPlace: it.oldPlace || ''
    };
  });
}
function pushToDoc(items, ignoreExisting, btn){
  if(btn){ btn.classList.add('busy'); btn.setAttribute('data-txt', btn.textContent); btn.textContent = '正在写入云文档…'; }
  return bridgeFetch('/api/push', { method:'POST', body:{ items: items, ignoreExisting: !!ignoreExisting } })
    .finally(function(){
      if(btn){ btn.classList.remove('busy'); if(btn.getAttribute('data-txt')) btn.textContent = btn.getAttribute('data-txt'); }
    });
}
// 从云文档撤掉指定登记
function removeFromDoc(items, btn){
  if(btn){ btn.classList.add('busy'); btn.setAttribute('data-txt', btn.textContent); btn.textContent = '正在删除云文档登记…'; }
  return bridgeFetch('/api/remove', { method:'POST', body:{ items: items } })
    .finally(function(){
      if(btn){ btn.classList.remove('busy'); if(btn.getAttribute('data-txt')) btn.textContent = btn.getAttribute('data-txt'); }
    });
}
// 写入结果 → 更新本地快照与同步状态
function applyPushResult(out, plan){
  if(out && out.snapshot && out.snapshot.cells){
    state.docSnapshot = { at: out.snapshot.at, cols: out.snapshot.cols, cells: out.snapshot.cells, source: 'file' };
    state.docSig = snapSigOf(out.snapshot);   // 刚写完，云上就是我们写的内容，下次轮询不必再合并
  }
  // 记住「这个格位我们写过」，用于下次判断是不是被人手工删掉了。
  // 必须连「写进去的是哪一场会」（标题/时间/地点）一起记，下次才分得清
  // 「云文档里这条被人工删了」和「本地后来又改了时间地点」——后者得照常写回去。
  var snapAt = (out && out.snapshot && out.snapshot.at) || '';
  var meta = {};
  ((plan && plan.items) || []).forEach(function(it){
    var ev = state.events.find(function(x){ return x.id === it.eventId; });
    if(ev && it.date && it.leader) meta[it.date + '|' + it.leader] = ev;
  });
  state.marks = state.marks || {};
  if(snapAt){
    (out.written || []).concat(out.duplicates || []).forEach(function(w){
      if(!w.date || !w.leader) return;
      var ev = meta[w.date + '|' + w.leader];
      state.marks[w.date + '|' + w.leader] = {
        at: snapAt,
        title: (ev && ev.title) || w.title || '',
        start: (ev && ev.start) || w.start || '',
        place: ev ? (ev.place || '') : (w.place || '')
      };
    });
  }
  var mkKeys = Object.keys(state.marks);
  if(mkKeys.length > 1200){
    mkKeys.sort(function(a, b){ return String((state.marks[a]||{}).at||'') < String((state.marks[b]||{}).at||'') ? -1 : 1; });
    mkKeys.slice(0, mkKeys.length - 1200).forEach(function(k){ delete state.marks[k]; });
  }
  var ids = {};
  (plan && plan.items || []).forEach(function(it){ ids[it.date + '|' + it.leader] = it.eventId; });
  var markIds = [];
  (out.written || []).concat(out.duplicates || []).forEach(function(w){
    var id = ids[w.date + '|' + w.leader];
    if(id) markIds.push(id);
  });
  var now = new Date().toISOString();
  markIds.filter(function(v, i, a){ return a.indexOf(v) === i; }).forEach(function(id){
    var e = state.events.find(function(x){ return x.id === id; });
    if(e){ e.syncedAt = now; e.skippedAt = null; }
  });
  saveState(true);   // 刚写完，内容已经在云上，别再触发一轮推送
  renderWeek();
  updateSyncBadge();
  return markIds;
}
// 直连写入后的结果页
function renderSyncResult(out, plan, includeSynced, removed){
  var o = out || {};
  var written = o.written || [], dups = o.duplicates || [], skipped = o.skipped || [], created = o.rowsCreated || [];
  var replaced = o.replaced || [];
  var repBy = {};
  replaced.forEach(function(r){ repBy[r.date + '|' + r.leader] = 1; });
  var rem = removed || null;
  var rmCount = rem ? (rem.removed || []).length : 0;
  var rmMiss = rem ? (rem.notFound || []).length : 0;
  var cap = (written.length || rmCount) ? '✅ 同步完成 · ' : 'ℹ 无需变更 · ';
  var h = '<div class="sync-res"><div class="res-cap">' + cap + new Date().toLocaleTimeString() + '</div>';
  h += '<div class="res-row">写入 <b>' + written.length + '</b> 处' +
       (created.length ? '，新建日期行 <b>' + created.length + '</b> 个' : '') +
       (rem ? '；从云文档删除 <b>' + rmCount + '</b> 处' : '') +
       '；跳过已登记 <b>' + dups.length + '</b> 处；未写入 <b>' + skipped.length + '</b> 处</div>';
  if(created.length) h += '<div class="res-row">新建日期：' + created.map(esc).join('、') + '</div>';
  written.forEach(function(w){
    var tag = repBy[w.date + '|' + w.leader]
      ? ' <span style="color:#d29922">（替换了云文档里的旧版本）</span>'
      : (w.appended ? ' <span style="color:var(--dim-2)">（已有内容，追加在后）</span>' : '');
    h += '<div class="res-row">✓ ' + esc(w.date) + '　' + esc(w.leader) + '　' + esc(w.text) + tag + '</div>';
  });
  if(rem){
    (rem.removed || []).forEach(function(r){
      h += '<div class="res-row" style="color:#d29922">− 已删除 ' + esc(r.date) + '　' + esc(r.leader) +
           '　<span style="color:var(--dim-2)">' + esc(String(r.text || '').replace(/\n/g, ' ／ ')) + '</span></div>';
    });
    (rem.emptied || []).forEach(function(r){
      h += '<div class="res-row" style="color:var(--dim)">　该格已清空：' + esc(r.date) + '　' + esc(r.leader) + '</div>';
    });
    (rem.notFound || []).forEach(function(r){
      h += '<div class="res-row" style="color:#d29922">! 未删除 ' + esc(r.date) + '　' + esc(r.leader) +
           '　' + esc(r.reason) + '　<span style="color:var(--dim-2)">请到云文档手工核对</span></div>';
    });
  }
  dups.slice(0, 20).forEach(function(d){
    h += '<div class="res-row" style="color:var(--dim)">· 云文档已有：' + esc(d.date) + '　' + esc(d.leader) +
         '　<span style="color:var(--dim-2)">' + esc(String(d.existing || '').replace(/\n/g, ' ／ ')) + '</span></div>';
  });
  skipped.forEach(function(s){
    h += '<div class="res-row" style="color:#d29922">! ' + esc(s.date) + '　' + esc(s.leader) + '　' + esc(s.reason) + '</div>';
  });
  h += '</div>';
  h += '<p class="hint">云文档现状快照已自动刷新（doc-snapshot.js 同步更新）' +
       (rmCount ? '，被删掉的那些会议已从「待清理」队列移除' : '') + '。</p>';
  $('modalBody').innerHTML = h;
  $('modalFoot').innerHTML = '<button id="syncBack" class="ghost">返回同步面板</button>' +
    '<button id="syncOpenDoc2">打开云文档</button>' +
    '<button class="primary" id="syncDone">完成</button>';
  $('syncBack').onclick = function(){ openSync(includeSynced, false); };
  $('syncOpenDoc2').onclick = function(){ window.open(DOC_TARGET.url, '_blank', 'noopener'); };
  $('syncDone').onclick = closeModal;
}
/* ================= 跨设备共用状态（冲突裁决 / 外出培训） ================= */
// 冲突裁决、被忽视的冲突、外出培训记录，以前只存在本机 localStorage：
// 手机（或同事电脑）打开时全丢，做过的裁决白做，冲突提示照样弹；
// 培训区间也会被云文档里零散的两处「外出培训」标记重新读成孤立的两天。
// 现在统一写进云文档另开的「应用状态」表（不改《会议安排》主表），谁打开都读到同一份。
var CSTATE = { at: 0, sig: '', pushing: false, lastErr: '', count: 0, timer: null };

function cloudStateEntries(){
  var out = [];
  var cd = state.conflictDecisions || {}, ca = state.conflictDecidedAt || {};
  Object.keys(cd).forEach(function(k){
    if(cd[k] !== 'ok' && cd[k] !== 'conflict') return;
    out.push({ key: 'd|' + k, v: { v: cd[k], at: ca[k] || new Date(0).toISOString() } });
  });
  var ig = state.ignoredConflicts || {};
  Object.keys(ig).forEach(function(k){
    var r = ig[k] || {};
    out.push({ key: 'i|' + k, v: {
      latest: (r.latest === undefined ? null : r.latest),
      at: r.at ? new Date(r.at).toISOString() : new Date(0).toISOString()
    } });
  });
  (state.trainings || []).forEach(function(t){
    if(isAutoTraining(t)) return;             // 从云文档标记自动收的，不反向写回去
    out.push({ key: 't|' + trainingKey(t), v: {
      leader: t.leader, from: t.from, to: t.to || t.from, title: t.title || '外出培训',
      place: t.place || '', note: t.note || '',
      at: t.editedAt || t.createdAt || new Date(0).toISOString()
    } });
  });
  var gone = state.trainGone || {};
  Object.keys(gone).forEach(function(k){
    out.push({ key: 't|' + k, v: { leader: String(k).split('|')[0], del: 1, at: gone[k] } });
  });
  return out;
}
// 把云端条目并进本地（同 key 比 at，谁新谁算）
function applyCloudStateEntries(list){
  var n = 0;
  state.conflictDecisions = state.conflictDecisions || {};
  state.conflictDecidedAt = state.conflictDecidedAt || {};
  state.ignoredConflicts = state.ignoredConflicts || {};
  (list || []).forEach(function(e){
    if(!e || !e.key || !e.v) return;
    var k = String(e.key), v = e.v, at = String(v.at || '');
    if(k.slice(0, 2) === 'd|'){
      var dk = k.slice(2);
      if(v.v !== 'ok' && v.v !== 'conflict') return;
      var cur = state.conflictDecidedAt[dk] || '';
      if(cur && cur >= at) return;
      if(state.conflictDecisions[dk] === v.v && cur === at) return;
      state.conflictDecisions[dk] = v.v;
      state.conflictDecidedAt[dk] = at;
      n++;
    }else if(k.slice(0, 2) === 'i|'){
      var ik = k.slice(2);
      var rec = state.ignoredConflicts[ik];
      var curI = rec && rec.at ? new Date(rec.at).toISOString() : '';
      if(curI && curI >= at) return;
      state.ignoredConflicts[ik] = { at: Date.parse(at) || Date.now(), latest: (v.latest === undefined ? null : v.latest), shared: true };
      n++;
    }else if(k.slice(0, 2) === 't|'){
      var tk = k.slice(2);
      var hit = (state.trainings || []).find(function(x){ return trainingKey(x) === tk; });
      var localAt = hit ? (hit.editedAt || hit.createdAt || '') : '';
      if(localAt && localAt >= at) return;
      if(v.del){
        state.trainGone = state.trainGone || {};
        state.trainGone[tk] = at;
        if(hit){ state.trainings = state.trainings.filter(function(x){ return x.id !== hit.id; }); n++; }
        return;
      }
      if(hit){
        if(hit.from === v.from && (hit.to || hit.from) === v.to && hit.title === v.title &&
           (hit.place || '') === (v.place || '') && (hit.note || '') === (v.note || '')) return;
        hit.from = v.from; hit.to = v.to; hit.title = v.title || hit.title;
        hit.place = v.place || ''; hit.note = v.note || '';
        hit.auto = false; hit.editedAt = at; n++;
        dropAutoOverlaps(hit);
      }else{
        var rec2 = addTraining({
          leader: v.leader, from: v.from, to: v.to, title: v.title,
          place: v.place, note: v.note, source: 'cloud'
        });
        if(rec2){ rec2.createdAt = at; rec2.auto = false; dropAutoOverlaps(rec2); n++; }
      }
    }
  });
  return n;
}
// 用户的记录一到，把与之重叠的「自动收的」记录清掉，别让同一段培训挂两份
function dropAutoOverlaps(keep){
  if(!keep) return;
  state.trainings = (state.trainings || []).filter(function(x){
    if(!isAutoTraining(x) || x.id === keep.id) return true;
    return !(x.leader === keep.leader && overlaps(x, keep));
  });
}
// 从云文档读共用状态
function cloudStateFetch(force){
  if(!BRIDGE.online || !BRIDGE.authed || !bridgeSupports('state')) return Promise.resolve(0);
  return bridgeFetch('/api/state' + (force ? '?force=1' : '')).then(function(d){
    if(!d || !d.entries) return 0;
    CSTATE.at = Date.now();
    CSTATE.count = d.entries.length;
    var n = applyCloudStateEntries(d.entries);
    if(n){ saveState(true); renderWeek(); }
    return n;
  }).catch(function(e){
    CSTATE.lastErr = (e && e.message) || String(e);
    return 0;
  });
}
// 把本地状态写回云文档（内容没变就不发请求）
function cloudStatePush(){
  if(!BRIDGE.online || !BRIDGE.authed || !bridgeSupports('state')) return Promise.resolve(null);
  if(CSTATE.pushing) return Promise.resolve(null);
  var entries = cloudStateEntries();
  var sig = JSON.stringify(entries);
  if(sig === CSTATE.sig) return Promise.resolve(null);
  CSTATE.pushing = true;
  return bridgeFetch('/api/state/push', { method: 'POST', body: { entries: entries } }).then(function(d){
    CSTATE.pushing = false;
    if(d && d.entries){
      var n = applyCloudStateEntries(d.entries);
      if(n){ saveState(true); renderWeek(); }
      CSTATE.sig = JSON.stringify(cloudStateEntries());
      CSTATE.at = Date.now();
      CSTATE.count = d.entries.length;
    }
    return d;
  }).catch(function(e){
    CSTATE.pushing = false;
    CSTATE.lastErr = (e && e.message) || String(e);
    return null;
  });
}

// 本地状态一改就排队写回云端（2 秒内的连续改动合并成一次）。
// 注意：这里不受「自动写入」开关限制 —— 关掉自动写入只是不往日历主表写，
// 冲突裁决这种「我点过了就别再问」的状态仍然要同步过去，否则手机还得再点一遍。
function rtScheduleState(){
  if(!BRIDGE.online || !BRIDGE.authed) return;
  if(typeof rtCfg === 'function' && !rtCfg().enabled) return;
  if(CSTATE.timer) clearTimeout(CSTATE.timer);
  CSTATE.timer = setTimeout(function(){ CSTATE.timer = null; cloudStatePush(); }, 2000);
}

/* ================= 实时同步（本地改动自动写、云文档改动自动读） ================= */
var RT_DEFAULT = { enabled:true, write:true, read:true, drop:false, interval:30000 };
var RT = { pushTimer:null, pullTimer:null, watchTimer:null,
           pushing:false, pulling:false, dirty:false, fails:0,
           lastPullAt:0, lastPushAt:0, lastErr:'' };

function rtCfg(){
  if(!state.rt || typeof state.rt !== 'object') state.rt = {};
  Object.keys(RT_DEFAULT).forEach(function(k){
    if(typeof state.rt[k] !== typeof RT_DEFAULT[k]) state.rt[k] = RT_DEFAULT[k];
  });
  return state.rt;
}
function rtActive(){
  return !!(BRIDGE.online && BRIDGE.authed && rtCfg().enabled);
}
function rtStamp(ts){
  if(!ts) return '—';
  var d = new Date(ts);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}
function rtAgo(ts){
  if(!ts) return '还没同步过';
  var s = Math.round((Date.now() - ts) / 1000);
  if(s < 5) return '刚刚';
  if(s < 60) return s + ' 秒前';
  if(s < 3600) return Math.round(s / 60) + ' 分钟前';
  return Math.round(s / 3600) + ' 小时前';
}

// 本地一有改动就排队写入（1.5 秒内的连续改动合并成一次）
function rtSchedulePush(delay){
  if(!RT || !rtActive() || !rtCfg().write) return;
  RT.dirty = true;
  if(RT.pushTimer) clearTimeout(RT.pushTimer);
  RT.pushTimer = setTimeout(function(){
    RT.pushTimer = null;
    rtPushNow(false);
  }, typeof delay === 'number' ? delay : 1500);
}

// 把「本次无法写入」的会议标记为已处理（与手动同步的行为一致），返回标记条数
function markPlanSkipped(plan, quiet){
  var list = (plan && plan.skipped) || [];
  if(!list.length) return 0;
  var nowIso = new Date().toISOString(), n = 0;
  list.forEach(function(s){
    if(!s.event) return;
    var e = state.events.find(function(x){ return x.id === s.event.id; });
    if(e && !e.syncedAt && !e.skippedAt){ e.skippedAt = nowIso; n++; }
  });
  if(n && !quiet) updateSyncBadge();
  return n;
}
function rtPushNow(manual){
  if(!RT) return Promise.resolve(null);
  if(RT.pushing) return Promise.resolve(null);
  var cfg = rtCfg();
  if(!BRIDGE.online || !BRIDGE.authed){
    if(manual) toast('还没连上金山文档：先启动同步服务并登录', 6000);
    return Promise.resolve(null);
  }
  if(!manual && (!cfg.enabled || !cfg.write)) return Promise.resolve(null);
  if(RT.pulling){                 // 正在读云文档时先让路，免得拿旧快照比对
    if(manual) toast('正在读取云文档，请稍后再试', 3000);
    else rtSchedulePush(1200);
    return Promise.resolve(null);
  }

  var plan = buildSyncPlan(false, false);
  var items = planToPushItems(plan);
  // 冲突裁决 / 外出培训这类「应用状态」也一并写回云端（内容没变时内部直接返回，不发请求）
  cloudStatePush();
  // 删除策略：
  //   · 「改过」的旧登记必须跟着撤下，否则云文档同一场会出现新旧两条 → 自动执行
  //   · 「删掉」的整场会议默认不动，到同步面板确认后再删（删错不可撤销）
  var rmAll = buildRemovalPlan();
  var rmPlan = { items: rmAll.items.filter(function(x){ return cfg.drop || x.reason === 'edited'; }) };
  var rmItems = rmPlan.items.map(function(x){
    return { date:x.date, leader:x.leader, title:x.title, start:x.start, place:x.place };
  });
  if(!items.length && !rmItems.length){
    RT.dirty = false;
    // 「写不进去」的（领导不在云文档列里、参会领导均已调出）也记一笔，不然会一直挂在待同步角标上
    var skippedNow = markPlanSkipped(plan);
    if(skippedNow) saveState();
    if(manual) toast(skippedNow ? ('有 ' + skippedNow + ' 场会无法写入云文档，已记入待处理') : '没有需要写入云文档的改动', 5000);
    renderRtChip();
    return Promise.resolve(null);
  }

  RT.pushing = true; RT.dirty = false; renderRtChip();
  // 顺序很重要：先把「改过 / 删掉」的旧登记从云文档撤下来，再写新内容。
  // 反过来做会出现两种坏结果：新内容追加进同一格、旧的那段又被删错；
  // 或者旧段删了、新的这次没写进去，格子里就空了（改期改地点时最容易踩）。
  var removing = rmItems.length
    ? removeFromDoc(rmItems, null).then(function(rem){
        applyRemoveResult(rem, rmPlan.items);
        return rem;
      }).catch(function(e){
        RT.lastErr = (e && e.message) || String(e);
        return null;      // 旧登记撤不下来也照样写新的，别把整轮同步拖死
      })
    : Promise.resolve(null);

  return removing.then(function(rem){
    var writing = items.length
      ? pushToDoc(items, false, null)
      : Promise.resolve({ written:[], duplicates:[], skipped:[], rowsCreated:[], snapshot:null });
    return writing.then(function(out){
      applyPushResult(out, plan);
      if(markPlanSkipped(plan, true)) saveState(true);
      return { out: out, rem: rem };
    });
  }).then(function(r){
    RT.pushing = false; RT.fails = 0; RT.lastErr = ''; RT.lastPushAt = Date.now();
    renderWeek(); updateSyncBadge(); renderRtChip();
    var n = (r.out && r.out.written ? r.out.written.length : 0);
    var miss = (r.rem && r.rem.notFound ? r.rem.notFound.length : 0);
    if(manual) toast(n ? ('已写入云文档 ' + n + ' 处') : '云文档里已是最新，无需写入', 4000);
    else if(miss) toast('有 ' + miss + ' 处旧登记在云文档里已经找不到，未做处理（不影响新内容）', 6000);
    return r;
  }).catch(function(e){
    RT.pushing = false; RT.fails++;
    RT.lastErr = (e && e.message) || String(e);
    if(e && e.code === 'NO_AUTH') BRIDGE.authed = false;
    renderRtChip();
    if(manual) toast('写入失败：' + RT.lastErr, 8000);
    else if(RT.fails === 2) toast('实时写入出错：' + RT.lastErr + '（稍后自动重试）', 8000);
    if(rtActive()) rtSchedulePush(15000);   // 出错退避重试，别把服务打爆
    return null;
  });
}

function rtPullNow(manual){
  if(!RT || RT.pulling) return Promise.resolve(null);
  if(!BRIDGE.online || !BRIDGE.authed){
    if(manual) toast('还没连上金山文档：先启动同步服务并登录', 6000);
    return Promise.resolve(null);
  }
  RT.pulling = true; renderRtChip();
  return pullFromDoc(null, !manual, { auto:true }).then(function(r){
    RT.pulling = false; RT.lastPullAt = Date.now(); RT.fails = 0; RT.lastErr = '';
    renderRtChip();
    return r;
  }).catch(function(e){
    RT.pulling = false; RT.fails++;
    RT.lastErr = (e && e.message) || String(e);
    renderRtChip();
    if(manual) toast('读取失败：' + RT.lastErr, 7000);
    return null;
  });
}

function rtRestartTimers(){
  if(RT.pullTimer){ clearInterval(RT.pullTimer); RT.pullTimer = null; }
  var cfg = rtCfg();
  if(!rtActive() || !cfg.read || !cfg.interval) return;
  RT.pullTimer = setInterval(function(){
    if(document.hidden) return;         // 页面在后台就不打扰
    if(!BRIDGE.online || !BRIDGE.authed) return;
    rtPullNow(false);
  }, Math.max(10000, Number(cfg.interval) || 30000));
}
// 同步服务可能是后开的：低频探活，连上就自动接手
function rtStartWatch(){
  if(RT.watchTimer) return;
  RT.watchTimer = setInterval(function(){
    if(document.hidden || BRIDGE.online) return;
    probeBridge().then(function(on){ if(on) rtAfterProbe(); });
  }, 20000);
}
function rtAfterProbe(){
  renderRtChip();
  if(!BRIDGE.online || !BRIDGE.authed) return;
  if(rtCfg().enabled){
    // 先取共用状态（冲突裁决 / 培训记录），再读日历 —— 顺序不能反：
    // 先把手机/同事电脑上的裁决拿到手，随后重绘时就不会又弹一遍冲突提示。
    cloudStateFetch(true).then(function(){ return rtPullNow(false); }).then(function(){ rtSchedulePush(600); });
    rtRestartTimers();
  }
}
function rtBindEvents(){
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) return;
    if(!BRIDGE.online){ probeBridge().then(function(on){ if(on) rtAfterProbe(); }); return; }
    // 切回页面先补一次共用状态：手机上可能刚做过裁决
    if(rtActive()) cloudStateFetch(true).then(function(){ return rtPullNow(false); }).then(function(){ rtSchedulePush(600); });
  });
  window.addEventListener('online', function(){
    probeBridge().then(function(on){ if(on) rtAfterProbe(); });
  });
}
function rtBoot(){
  rtCfg();
  rtStartWatch();
  rtBindEvents();
  probeBridge().then(function(on){
    renderRtChip();
    if(!on || !BRIDGE.authed) return;
    if(rtCfg().enabled){
      // 开机顺序：共用状态（裁决/培训）→ 日历内容 → 把本地改动补写回去
      cloudStateFetch(true).then(function(){ return rtPullNow(false); }).then(function(){ rtSchedulePush(800); });
      rtRestartTimers();
    }
  });
}

function dateLabelCN(iso){
  var d = parseISO(iso);
  return d ? (d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日') : iso;
}
function slotWord(e){
  var m = minutesOf(e.start);
  if(m===null) return '';
  if(m < 12*60) return '上午';
  if(m < 18*60) return '下午';
  return '晚上';
}
// 云文档单元格文本：上午9:00，地点，会议名称
function hhmmText(s){
  var m = String(s||'').match(/^(\d{1,2}):(\d{2})$/);
  return m ? (parseInt(m[1],10) + ':' + m[2]) : (s||'');
}
function eventCellText(e){
  var parts = [];
  var t = slotWord(e) + hhmmText(e.start);
  if(t) parts.push(t);
  if(e.place) parts.push(e.place);
  parts.push(e.title || '未命名会议');
  return parts.join('，');
}
function byDateStart(a,b){
  if(a.date !== b.date) return a.date < b.date ? -1 : 1;
  var am = minutesOf(a.start)===null?1e9:minutesOf(a.start);
  var bm = minutesOf(b.start)===null?1e9:minutesOf(b.start);
  return am - bm;
}
function pendingEvents(){
  return state.events.filter(function(e){
    // 参会领导都是已调出人员的会议，无需再同步，也不占待同步角标
    if(!(e.leaders || []).some(function(l){ return !isInactiveOn(l.name, e.date); })) return false;
    return !e.syncedAt && !e.skippedAt && syncStatusOf(e) !== 'doc';
  }).sort(byDateStart);
}
// 同一场会但地点写法不同（例如 418 会议室 vs 110 会议室）时给出提示，避免静默沿用旧地点
function placeDiffOf(cellRaw, e){
  if(!e.place) return null;
  var old = null, segs = cellSegments(cellRaw);
  for(var i=0;i<segs.length && !old;i++){
    var p = findPlace(segs[i]);
    if(p && p.place) old = p.place;
  }
  if(!old) return null;
  var a = normCellText(old), b = normCellText(e.place);
  if(!a || !b) return null;
  if(a.indexOf(b) >= 0 || b.indexOf(a) >= 0) return null;
  return { doc: old, now: e.place };
}
// 「当初写进云文档的那一条」和「本地现在这一条」是不是同一版本。
// 只有完全一致时才认为「是人工删掉了、不自动写回」；时间/地点改过就放行，
// 否则一场会只要改过一次日期或地点，之后永远同步不上去。
function sameAsMarked(mk, e){
  if(!mk || !e) return false;
  // 这场会是在那次写入之后才新建的 → 显然不是同一条，别拦
  if(e.createdAt && mk.at && String(e.createdAt) > String(mk.at)) return false;
  if(!mk.title) return true;      // 老版本留下的标记没存标题，只能保守按「同一条」处理
  if(normCellText(mk.title) !== normCellText(e.title)) return false;
  if(String(mk.start || '') !== String(e.start || '')) return false;
  if(mk.place !== undefined && normCellText(mk.place) !== normCellText(e.place)) return false;
  return true;
}
// 展开成「日期行 × 领导列」的写入清单；ignoreExisting=true 时不做重复检查
function buildSyncPlan(includeSynced, ignoreExisting){
  var cols = syncColumns(), items = [], dups = [], skipped = [], revived = [];
  state.events.filter(function(e){ return includeSynced || (!e.syncedAt && !e.skippedAt); }).sort(byDateStart).forEach(function(e){
    var ls = (e.leaders || []).filter(function(l){ return !isInactiveOn(l.name, e.date); });   // 已调出的不计入
    if(!ls.length){ skipped.push({event:e, reason:'参会领导为空或均已调出（不再写入）'}); return; }
    var hit = ls.filter(function(l){ return cols.indexOf(l.name) >= 0; });
    if(!hit.length){
      skipped.push({event:e, reason:'「'+ls.map(function(l){return l.name;}).join('、')+'」在云文档表中没有对应列'});
      return;
    }
    hit.forEach(function(l){
      var text = eventCellText(e);
      var row = { eventId:e.id, date:e.date, dateLabel:dateLabelCN(e.date), leader:l.name, text:text };
      var exist = ignoreExisting ? null : snapshotCellText(e.date, l.name);
      if(exist && String(exist).trim()){
        if(cellEntrySame(exist, e)){
          row.existing = exist;
          row.placeDiff = placeDiffOf(exist, e);
          dups.push(row);
          return;
        }
        // 云文档里已经有这场会（按名称认得出来），但写的时间/地点是旧版本
        // （或者当初只写了会名）→ 把新版写回去，由服务端就地替换那一段。
        if(staleSegOf(exist, e, l.name)){
          row.existing = exist;
          row.updated = true;
          row.oldStart = (editedOldOf(e, l.name) || {}).start || '';
          row.oldPlace = (editedOldOf(e, l.name) || {}).place || '';
          items.push(row);
          return;
        }
      }
      // 这个格位我们以前写过，现在云文档里却是空的 → 多半是人工删掉了，
      // 不能偷偷写回去（这正是「删了又被同步回来」的根因）。
      // 但「当初写的那条」和「现在这条」不是同一场会（改过时间/地点、或换了别的会），
      // 就照常写回 —— 否则一场会改过一次日期，之后永远同步不上去。
      var mk = (state.marks || {})[e.date + '|' + l.name];
      var snapAt = state.docSnapshot && state.docSnapshot.at;
      if(!ignoreExisting && !String(exist || '').trim() && mk && sameAsMarked(mk, e) && snapAt && String(snapAt) >= String(mk.at)){
        row.reason = '云文档里这条登记已被删除，不自动写回';
        revived.push(row);
        return;
      }
      items.push(row);
    });
  });
  return { items:items, dups:dups, skipped:skipped, revived:revived };
}
function uniqueEventIds(rows){
  return rows.map(function(x){ return x.eventId; }).filter(function(v,i,a){ return a.indexOf(v) === i; });
}
function makeSyncPackage(plan){
  return {
    version: 2,
    type: 'kdocs-meeting-sync',
    generatedAt: new Date().toISOString(),
    target: {name: DOC_TARGET.name, url: DOC_TARGET.url, fileId: DOC_TARGET.fileId},
    sheet: {headerRow: 1, dateCol: 'A', weekdayCol: 'B', leaderColumns: syncColumns(), appendMode: 'join_with_newline'},
    inactive: (state.inactive || []).map(function(x){ return {name:x.name, since:x.since, reason:x.reason}; }),
    snapshot: state.docSnapshot ? {at: state.docSnapshot.at, source: state.docSnapshot.source} : null,
    items: plan.items,
    duplicates: plan.dups.map(function(d){
      return {date:d.date, leader:d.leader, text:d.text, existing:d.existing,
              placeDiff: d.placeDiff || null};
    }),
    skipped: plan.skipped.map(function(s){
      return {date:s.event.date, start:s.event.start||'', title:s.event.title, reason:s.reason};
    })
  };
}
function downloadJSON(obj, filename){
  var blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function markSynced(ids, skippedEvents, dupIds){
  var now = new Date().toISOString();
  ids.forEach(function(id){
    var e = state.events.find(function(x){ return x.id === id; });
    if(e){ e.syncedAt = now; e.skippedAt = null; }
  });
  (skippedEvents || []).forEach(function(e){
    if(e){ e.skippedAt = now; e.syncedAt = null; }
  });
  (dupIds || []).forEach(function(id){
    var e = state.events.find(function(x){ return x.id === id; });
    if(e){ e.syncedAt = e.syncedAt || now; e.skippedAt = null; }
  });
  saveState();
}
function updateSyncBadge(){
  var n = pendingEvents().length;
  var rm = (state.docSnapshot ? buildRemovalPlan().items.length : 0);
  var total = n + rm;
  var b = $('syncBadge');
  if(b){ b.textContent = total ? String(total) : ''; b.style.display = total ? '' : 'none'; }
  var btn = $('btnSync');
  if(btn){
    btn.title = total
      ? ('待同步 ' + n + ' 场' + (rm ? '、待从云文档删除 ' + rm + ' 处' : '') + '（「' + DOC_TARGET.name + '」）')
      : '暂无待同步会议';
  }
}

function openSync(includeSynced, ignoreExisting){
  var plan = buildSyncPlan(includeSynced, ignoreExisting);
  var rmPlan = buildRemovalPlan();
  var stats = snapshotStats();
  var writeIds = uniqueEventIds(plan.items);
  var dupIds = uniqueEventIds(plan.dups);
  var rmEventCount = (function(){
    var s = {};
    rmPlan.items.forEach(function(x){ s[x.trashId] = 1; });
    return Object.keys(s).length;
  })();
  var hasWork = !!(plan.items.length || rmPlan.items.length);
  var canDirect = !!(BRIDGE.online && BRIDGE.authed);
  var canRemove = !!(canDirect && bridgeSupports('remove'));

  $('modal').className = 'modal';
  $('modalTitle').textContent = '同步到云文档';

  var h = '';
  h += '<div class="sync-target"><b>'+esc(DOC_TARGET.name)+'</b>'+
       '<a href="'+DOC_TARGET.url+'" target="_blank" rel="noopener">在金山文档中打开 ›</a></div>';
  if(BRIDGE.online && BRIDGE.authed && rtCfg().enabled){
    h += '<div class="live-note"><b>⚡ 实时同步已开启</b>：日历上的改动会自动写入云文档，云文档的变化也会自动读回。'+
         '这个面板只在需要「立刻生效」或处理删除时用。</div>';
  }

  /* ---- 云文档里查不到的会议：待确认 ---- */
  var pendGone = state.events.filter(function(e){ return e.docGoneAt; });
  if(pendGone.length){
    h += '<div class="sync-gone pend"><div class="gone-head"><b>'+pendGone.length+' 场会在云文档里查不到了</b>'+
         '<span class="gone-sub">'+(pendGone.length > GONE_BATCH_LIMIT
            ? '一次少这么多，为防误删先没动，请你确认'
            : '下次检查确认后会自动从日历移除')+'</span></div>';
    h += '<div class="gone-list">';
    pendGone.slice(0, 8).forEach(function(e){
      h += '<div class="gone-line">· '+esc(dateLabelCN(e.date))+'　'+esc(e.start||'')+'　'+esc(e.title)+'</div>';
    });
    if(pendGone.length > 8) h += '<div class="gone-line" style="color:var(--dim-2)">…另有 '+(pendGone.length-8)+' 场</div>';

  }else if(BRIDGE.online && !BRIDGE.authed){

  if(plan.items.length){

    rmPlan.items.forEach(function(it){

  }

  }

                   : '<button id="syncAll" class="ghost">包含已同步</button>')+

    footBtn;

  /* ---- 事件绑定 ---- */
  $('syncCols').addEventListener('change', function(){

  });
  $('snapOpen').onclick = function(){ $('snapBox').hidden = !$('snapBox').hidden; };

        var snap = parseSnapshotText(String(rd.result||''), docColumns());

  if($('snapClear')) $('snapClear').onclick = function(){

  /* ---- 直连相关 ---- */
  var reOpen = function(){ openSync(includeSynced, ignoreExisting); };
  // 同一动作可能同时出现在顶部与底部（不能再用同一个 id，否则只有第一个能绑定）
  var bindActs = function(act, fn){

    for(var i=0;i<nodes.length;i++) nodes[i].onclick = fn;
    return nodes.length;
  };

  var doSync = function(forceRemove){
    var btn = this;
    var items = planToPushItems(plan);
    var rmOn = forceRemove ? true : ($('syncRmOn') ? $('syncRmOn').checked : false);
    var rmItems = rmOn ? rmPlan.items.map(function(x){
      return { date:x.date, leader:x.leader, title:x.title, start:x.start, place:x.place };
    }) : [];
    if(!items.length && !rmItems.length){ toast('没有可同步的内容'); return; }

    // 顺序：先写入新内容，再从云文档删掉旧的；这样即使删除失败，也不会丢数据
    var writing = items.length
      ? pushToDoc(items, ignoreExisting, btn)
      : Promise.resolve({ written:[], duplicates:[], skipped:[], rowsCreated:[], snapshot:null });

    writing.then(function(out){
      applyPushResult(out, plan);          // 先落写入结果（含云上快照）
      if(!rmItems.length) return { out: out, rem: null };

      renderSyncResult(r.out, plan, includeSynced, r.rem);
    }).catch(function(e){

        toast('同步服务是旧版本，重启一次即可（已弹出操作步骤）', 6000);

  bindActs('syncRemove', function(){ doSync.call(this, true); });

      var e = state.events.find(function(x){ return x.id === it.eventId; });

  if($('rmDiscard')) $('rmDiscard').onclick = function(){

      var f = inp.files[0]; if(!f) return;
      var r = new FileReader();
      r.onload = function(){

          var d = JSON.parse(r.result);

  });

}

/* ================= 弹窗 / 提示 ================= */
function openModal(){ $('backdrop').hidden = false; }
function closeModal(){ $('backdrop').hidden = true; $('modal').className = 'modal'; }
function toast(msg, ms){
  var t = $('toast');
  t.textContent = msg; t.className = 'toast on';
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.className = 'toast'; }, ms || 2400);
}

/* ================= 文件夹监听（会议通知自动提醒） =================
   服务端盯着指定文件夹，发现新的 Word/PDF/图片 通知就用本地 Python 提取文字，
   这里轮询拿「待确认队列」，在右下角弹卡片问要不要导入日历。
   解析仍在本地前端完成（与手动粘贴同一套 parseText），保证字段口径一致。 */
var WATCH = {
  on:false, enabled:false, folder:'', interval:3000,
  rev:0, items:[], hidden:{}, parsed:{},
  timer:null, pollMs:5000, lastErr:'', scanning:false
};

function watchReset(){ clearTimeout(WATCH.timer); WATCH.timer = null; WATCH.on = false; }

// 单次轮询：带 rev，服务端没变化就不传全文
function watchPollOnce(){
  if(!BRIDGE.online || !bridgeSupports('watch')) return Promise.resolve(false);
  return bridgeFetch('/api/watch/state?rev=' + WATCH.rev).then(function(d){
    if(!d || !d.ok) return false;
    WATCH.enabled = !!d.enabled;
    WATCH.folder = d.folder || '';
    WATCH.interval = d.interval || 3000;
    WATCH.lastErr = d.lastErr || '';
    if(d.changed){
      WATCH.rev = d.rev || 0;
      // 服务端已处理掉的条目，本地缓存也一并清掉
      var keep = {};
      (d.pending || []).forEach(function(it){
        keep[it.id] = true;
        if(!WATCH.parsed[it.id] && it.ok) WATCH.parsed[it.id] = watchParse(it);
      });
      Object.keys(WATCH.parsed).forEach(function(k){ if(!keep[k]) delete WATCH.parsed[k]; });
      WATCH.items = d.pending || [];
      renderWatchCards();
      updateWatchBadge();
    }
    return true;
  }).catch(function(){ return false; });
}

// 递归轮询：不管成功失败都排下一次，页面长期开着也能持续提醒
function watchSchedule(){
  clearTimeout(WATCH.timer);
  WATCH.timer = setTimeout(function(){
    watchPollOnce().then(watchSchedule, watchSchedule);
  }, WATCH.pollMs);
}

function watchStart(){
  if(WATCH.on) return;
  WATCH.on = true;
  // 首次进来先拉一次全量（rev=0 保证 changed=true）
  watchPollOnce().then(watchSchedule, watchSchedule);
}

// 桥接服务上下线时调用
function watchSync(){
  if(typeof WATCH !== 'object' || !WATCH) return;
  if(BRIDGE.online && bridgeSupports('watch')) watchStart(); else watchReset();
}

// 用统一解析器把文本变成摘要（结果按 id 缓存，卡片重绘不重复解析）
function watchParse(it){
  var raw = String(it && it.text || '');
  if(!raw.trim()) return null;
  var items = [];
  try{ items = parseText(raw, cfgForParse()) || []; }catch(e){ items = []; }
  items = items.filter(function(x){ return x && x.date && !personnelStatusOf(x.title); });
  return items.length ? items : null;
}

function watchSummaryOf(it){
  var items = WATCH.parsed[it.id];
  if(items === undefined) items = WATCH.parsed[it.id] = watchParse(it);
  if(!items || !items.length) return null;
  var a = items[0];
  return { count: items.length, date: a.date, start: a.start || '', title: a.title || '', place: a.place || '' };
}

function updateWatchBadge(){
  var n = (WATCH.items || []).length;
  var btn = $('btnWatch');
  if(btn){
    var b = btn.querySelector('.watch-badge');
    if(n){
      if(!b){ b = document.createElement('span'); b.className = 'watch-badge'; btn.appendChild(b); }
      b.textContent = String(n);
    }else if(b){ b.remove(); }
  }
}

// 参会统计卡也在右下角：有提醒卡片时把它整体顶上去，避免互相压住
function syncWatchLayout(){
  var box = $('watchStack');
  var on = !!(box && box.children.length);
  document.body.classList.toggle('watch-on', on);
  var h = 0;
  if(on){
    try{ h = Math.round(box.getBoundingClientRect().height) + 12; }catch(e){ h = 0; }
  }
  document.documentElement.style.setProperty('--watch-h', h + 'px');
}

function renderWatchCards(){
  var box = $('watchStack');
  if(!box) return;
  var list = (WATCH.items || []).filter(function(it){ return !WATCH.hidden[it.id]; });
  if(!list.length){ box.innerHTML = ''; syncWatchLayout(); return; }
  var html = '';
  list.forEach(function(it){
    var m = it.ok ? watchSummaryOf(it) : null;
    html += '<div class="wcard' + (it.ok ? '' : ' bad') + '" data-id="' + esc(it.id) + '">';
    html += '<div class="wc-head"><span class="wc-ico">' + (it.ok ? '📄' : '⚠️') + '</span>' +
            '<div class="wc-name">' + esc(it.name || '会议通知') + '</div>' +
            '<button class="wc-x" data-act="hide" title="本次先不显示（仍保留在待办里）">✕</button></div>';
    if(it.ok && m){
      html += '<div class="wc-meta">' +
              '<span><b>' + esc(m.date) + '</b>' + (m.start ? ' ' + esc(m.start) : '') + '</span>' +
              (m.place ? '<span>' + esc(m.place) + '</span>' : '') +
              (m.count > 1 ? '<span>共 ' + m.count + ' 场</span>' : '') +
              '</div>';
      html += '<div class="wc-title">' + esc(m.title || '未命名会议') + '</div>';
    }else if(it.ok){
      html += '<div class="wc-err">文件已读取，但没认出会议日期时间</div>';
    }else{
      html += '<div class="wc-err">' + esc(it.error || '解析失败') + '</div>';
    }
    html += '<div class="wc-act">';
    if(it.ok && m) html += '<button class="wc-ok" data-act="import">导入到日历</button>';
    if(!it.ok) html += '<button class="wc-ok" data-act="retry">重试解析</button>';
    if(it.ok && !m) html += '<button data-act="viewonly">查看原文</button>';
    else html += '<button data-act="view">查看原文</button>';
    html += '<button data-act="ignore">忽略</button>';
    html += '</div></div>';
  });
  box.innerHTML = html;
  syncWatchLayout();
}

function watchItemOf(id){
  return (WATCH.items || []).find(function(x){ return x.id === id; }) || null;
}

// 标记已处理（导入后 / 忽略后）：服务端删掉这条，本地同步移除
function watchSettle(id, action){
  bridgeFetch('/api/watch/act', { method:'POST', body:{ id:id, action:action } }).then(function(d){
    if(d && d.ok){
      WATCH.rev = d.rev || (WATCH.rev + 1);
      WATCH.items = (WATCH.items || []).filter(function(x){ return x.id !== id; });
      delete WATCH.parsed[id];
      renderWatchCards();
      updateWatchBadge();
    }
  }).catch(function(){ /* 下次轮询会自然对齐 */ });
}

// 解析失败的卡片：让服务端重新读一遍文件（解析器升级后不用把文件再放一次）
function watchRetry(id, btn){
  if(btn){ btn.disabled = true; btn.textContent = '解析中…'; }
  bridgeFetch('/api/watch/act', { method:'POST', body:{ id:id, action:'retry' } }).then(function(d){
    if(!d || !d.ok){ toast('重试失败：' + ((d && d.error) || '服务无响应')); if(btn){ btn.disabled = false; btn.textContent = '重试解析'; } return; }
    var it = watchItemOf(id);
    if(it){ it.ok = !!(d.item && d.item.ok); it.error = (d.item && d.item.error) || ''; }
    return watchPollOnce().then(function(){
      renderWatchCards();
      updateWatchBadge();
      toast((d.item && d.item.ok) ? '已重新解析，可以导入了' : ('仍然失败：' + ((d.item && d.item.error) || '未提取到文字')));
    });
  }).catch(function(e){
    toast('重试失败：' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = '重试解析'; }
  });
}

// 把解析出的会议写进日历（和手动导入同一套字段与去重口径）
function watchAddEvents(items){
  var added = 0, dup = 0;
  (items || []).forEach(function(it){
    if(!it || !it.date) return;
    var same = state.events.some(function(e){
      return e.date === it.date && e.title === it.title && (e.start || '') === (it.start || '');
    });
    if(same){ dup++; return; }
    state.events.push({
      id: 'ev_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      date: it.date, start: it.start || '', place: it.place || '',
      title: it.title || '未命名会议', type: it.type || 'dept',
      leaders: it.leaders || [], note: it.note || '',
      createdAt: new Date().toISOString(),
      syncedAt: null
    });
    added++;
  });
  if(added) saveState();
  return { added: added, dup: dup };
}

function watchImport(id){
  var it = watchItemOf(id);
  if(!it) return;
  var items = WATCH.parsed[id];
  if(items === undefined) items = WATCH.parsed[id] = watchParse(it);
  if(!items || !items.length){
    toast('这个文件里没认出会议，可点「查看原文」后手动粘贴解析', 5000);
    return;
  }
  var r = watchAddEvents(items);
  renderWeek();
  if(r.added){
    var dates = items.map(function(x){ return x.date; }).sort();
    var first = dates.length ? parseISO(dates[0]) : null;
    if(first) viewWeekStart = startOfWeek(first);
    renderWeek();
    toast('已从「' + it.name + '」导入 ' + r.added + ' 场会议' + (r.dup ? '，跳过重复 ' + r.dup + ' 场' : ''), 4000);
  }else{
    toast('这几场会议日历里已经有了（重复 ' + r.dup + ' 场），未重复导入', 4000);
  }
  watchSettle(id, 'imported');
}

// 查看原文：弹窗展示提取到的文字，可一键解析导入
function watchView(id, importOnly){
  var it = watchItemOf(id);
  if(!it) return;
  $('modal').className = 'modal';
  $('modalTitle').textContent = it.name || '会议通知原文';
  var h = '';
  h += '<p class="hint" style="margin:0 0 8px">文件：<code>' + esc(it.name) + '</code>' +
       (it.path ? '<br>位置：<code>' + esc(it.path) + '</code>' : '') + '</p>';
  if(it.ok){
    var items = WATCH.parsed[id] || watchParse(it) || [];
    if(items.length){
      h += '<div class="live-card" style="margin-bottom:10px"><h4>识别到 ' + items.length + ' 场会议</h4>';
      items.forEach(function(x, i){
        h += '<p style="margin:4px 0"><b>' + (i + 1) + '. ' + esc(x.date) + ' ' + esc(x.start || '') + '</b> ' +
             esc(x.title || '') + (x.place ? ' · ' + esc(x.place) : '') +
             ((x.leaders || []).length ? ' · ' + esc((x.leaders || []).map(function(l){ return l.name; }).join('、')) : '') +
             '</p>';
      });
      h += '</div>';
    }
    h += '<textarea id="watchRaw" readonly style="min-height:220px;max-height:52vh;font-size:12px;line-height:1.7">' +
         esc(it.text || '') + '</textarea>';
  }else{
    h += '<div class="live-card offline" style="margin-bottom:10px"><h4>没能解析出文字</h4>' +
         '<p>' + esc(it.error || '未知原因') + '</p>' +
         '<p>可把这个文件拖到左侧录入框重新解析，或直接手动粘贴内容。</p></div>';
  }
  $('modalBody').innerHTML = h;
  $('modalFoot').innerHTML =
    (it.ok && !importOnly ? '<button class="primary" id="watchDoImport">导入到日历</button>' : '') +
    '<button id="watchDoIgnore">忽略该文件</button>' +
    '<button class="ghost" id="watchDoClose">关闭</button>';
  $('backdrop').hidden = false;
  if($('watchDoImport')) $('watchDoImport').addEventListener('click', function(){ $('backdrop').hidden = true; watchImport(id); });
  $('watchDoIgnore').addEventListener('click', function(){ $('backdrop').hidden = true; watchSettle(id, 'ignored'); });
  $('watchDoClose').addEventListener('click', function(){ $('backdrop').hidden = true; });
}
