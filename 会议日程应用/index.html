<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>领导会议日程 · 某市住建局</title>
<style>
/* ===== Airbnb 设计系统（详见 DESIGN.md）=====
 * 白底 / 近黑墨色 / 单一 Rausch 红 / 发丝线 / 柔软圆角 / 单层阴影。
 * --accent 承载「文字与图标」的红色（白底与深底都过 AA）；
 * --accent-fill 专门给「白字实心按钮」做底（Rausch Active，白字 4.9:1）；
 * --brand 只做装饰（圆点、角标、进度条），不承载文字。
 */
:root{
  --brand:#ff385c;
  --accent:#e00b41;
  --accent-fill:#e00b41;
  --accent-ink:#ffffff;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 6px 16px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.04);
  --shadow-hover:0 8px 22px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.05);
  --font:"Airbnb Cereal VF",-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
}
:root[data-theme="light"]{
  --bg:#ffffff; --panel:#ffffff; --panel-2:#f7f7f7; --panel-3:#f2f2f2;
  --line:#dddddd; --line-soft:#ebebeb;
  --txt:#222222; --dim:#6a6a6a; --dim-2:#767676;
  --accent:#d5003c; --accent-fill:#d5003c;
  --city-a:#ff385c; --city-b:#e00b41;
  --in-a:#008a05; --in-b:#006607;
  --warn:#b87700; --danger:#c13515;
  --ev-city-bg:#fff0f3; --ev-city-line:#ffd1da; --ev-city-ink:#b32505;
  --ev-in-bg:#eefaf1; --ev-in-line:#c9ecd4; --ev-in-ink:#006607;
}
:root[data-theme="dark"]{
  --bg:#141414; --panel:#1c1c1c; --panel-2:#242424; --panel-3:#2e2e2e;
  --line:#3a3a3a; --line-soft:#2c2c2c;
  --txt:#f2f2f2; --dim:#a8a8a8; --dim-2:#8a8a8a;
  --accent:#ff385c; --accent-fill:#e00b41;
  --city-a:#ff385c; --city-b:#e00b41;
  --in-a:#1f9d55; --in-b:#137a3e;
  --warn:#f0a020; --danger:#ff6b6f;
  --ev-city-bg:rgba(255,56,92,.14); --ev-city-line:rgba(255,56,92,.42); --ev-city-ink:#ffb3bf;
  --ev-in-bg:rgba(31,157,85,.16); --ev-in-line:rgba(31,157,85,.42); --ev-in-ink:#8fe0a9;
}
*{box-sizing:border-box}
/* ---------- 滚动条：系统默认那根太粗太抢眼，改成细窄半透明，指上去才明显 ---------- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:rgba(141,153,173,.22);border-radius:99px;
  border:3px solid transparent;background-clip:padding-box;
  transition:background .15s;
}
::-webkit-scrollbar-thumb:hover{background:rgba(141,153,173,.45);background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-thumb:active{background:rgba(141,153,173,.6);background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
:root[data-theme="light"] ::-webkit-scrollbar-thumb{background:rgba(93,106,126,.2);background-clip:padding-box;border:3px solid transparent}
:root[data-theme="light"] ::-webkit-scrollbar-thumb:hover{background:rgba(93,106,126,.42);background-clip:padding-box;border:3px solid transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font-family:var(--font);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
}
/* 默认允许换行：长按钮宁可变高，也不能把字裁掉（原来是 nowrap，长文案直接被切） */
button{font-family:inherit;font-size:13.5px;line-height:1.5;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--txt);padding:8px 14px;border-radius:var(--radius-sm);transition:background .15s,border-color .15s,box-shadow .15s;white-space:normal;max-width:100%;text-align:center;overflow-wrap:anywhere;flex:0 1 auto}
button:hover{background:var(--panel-3);border-color:var(--txt)}
/* 短按钮保持单行 */
.weeknav button,button.icon-btn,.cf-toggle,.cf-x,.rm-x,.nw-head button,.fp-foot button{white-space:nowrap}
button.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink);font-weight:600}
button.primary:hover{background:#c00039;border-color:#c00039}
button.ghost{background:transparent}
button.icon-btn{padding:6px 10px;line-height:1}
input,select,textarea{font-family:inherit;font-size:13.5px;line-height:1.5;background:var(--panel-2);color:var(--txt);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--txt);box-shadow:inset 0 0 0 1px var(--txt)}
input[type="date"],input[type="time"]{color-scheme:dark}
:root[data-theme="light"] input[type="date"],:root[data-theme="light"] input[type="time"]{color-scheme:light}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap;min-width:0}
.brand b{font-size:16px;letter-spacing:.5px}
.brand span{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.weeknav{display:flex;align-items:center;gap:8px;margin-left:6px}
.weeknav .range{font-size:14px;font-weight:600;min-width:158px;text-align:center;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.topbar .spacer{flex:1;min-width:8px}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}

/* ---------- 搜索 ---------- */
.search-wrap{position:relative;display:flex;align-items:center;gap:0;min-width:200px;flex:0 1 320px}
.search-box{position:relative;width:100%}
.search-box input{padding:7px 30px 7px 32px;border-radius:99px;font-size:12.5px;background:var(--panel-2)}
.search-box .s-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px;pointer-events:none}
.search-box .s-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--dim);font-size:14px;padding:1px 5px;cursor:pointer;display:none;white-space:nowrap}
.search-box .s-clear:hover{color:var(--txt)}
.search-box .s-clear.on{display:block}
.search-pop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:90;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:min(56vh,440px);overflow:auto;display:none}
.search-pop.on{display:block}
.s-item{padding:9px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer;line-height:1.55}
.s-item:last-child{border-bottom:none}
.s-item:hover{background:var(--panel-3)}
.s-item .s-t{font-size:13px;font-weight:600;color:var(--txt)}
.s-item .s-meta{font-size:12px;color:var(--dim);margin-top:1px}
.s-item .s-lead{font-size:12px;color:var(--dim-2);margin-top:1px}
.s-item mark{background:transparent;color:var(--accent);font-weight:700}
.s-empty{padding:14px 12px;color:var(--dim);font-size:12.5px;text-align:center}
.s-count{padding:6px 12px;font-size:12px;color:var(--dim-2);border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--panel)}

/* 录入按钮：窄屏展开侧栏抽屉的入口；宽屏时隐藏（侧栏常驻） */
.entry-toggle{display:none;white-space:nowrap;font-weight:600;background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.entry-toggle:hover{background:#c00039;border-color:#c00039}

/* 更多菜单 */
.more-wrap{position:relative}
.more-toggle{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;padding:8px 11px}
.more-toggle .caret{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;margin-top:2px}
.more-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:80;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px}
.more-menu[hidden]{display:none}
.more-menu button{text-align:left;border:none;background:transparent;padding:8px 11px;border-radius:8px;font-size:13px;justify-content:flex-start}
/* 图标定宽，六项的文字左边缘才对齐（📊 与 ⇅ 本身宽度差很多） */
.more-menu .mi{display:inline-block;width:1.2em;text-align:center;font-style:normal;margin-right:.45em}
.more-menu button:hover{background:var(--panel-3)}

/* ---------- alert（固定单行，明细浮层，绝不挤占左侧解析窗口） ---------- */
.alertbar{display:none;position:relative;align-items:center;gap:12px;flex-wrap:nowrap;padding:0 18px;height:44px;box-sizing:border-box;background:rgba(229,72,77,.10);border-bottom:1px solid rgba(229,72,77,.32);color:var(--txt);font-size:12.5px;flex:0 0 auto;z-index:40}
.alertbar.on{display:flex}
.alertbar b{color:var(--danger)}
.cf-main{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 auto;overflow:hidden}
.cf-main b{font-size:13.5px;letter-spacing:.2px;white-space:nowrap;flex:none}
.cf-sub{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cf-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto;margin-left:auto}
.cf-toggle{font-size:12px;padding:4px 11px;border-radius:99px;border:1px solid rgba(229,72,77,.45);background:rgba(229,72,77,.12);color:var(--txt);white-space:nowrap}
.cf-toggle:hover{background:rgba(229,72,77,.22)}
.cf-x{border:none;background:none;color:var(--dim);font-size:13px;padding:2px 6px;cursor:pointer;flex:none}
.cf-x:hover{color:var(--txt)}
/* 明细浮层：绝对定位在提示条下方，不占布局高度 */
.cf-pop{position:absolute;left:16px;right:16px;top:calc(100% + 6px);z-index:56;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;max-height:min(48vh,380px);overflow:auto;font-size:12px;line-height:1.8}
.cf-pop[hidden]{display:none}
.cf-pop .cf-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cf-chip{font-size:12px;border:1px solid rgba(229,72,77,.45);background:rgba(229,72,77,.12);border-radius:99px;padding:2px 10px;white-space:nowrap}
.cf-chip i{font-style:normal;color:var(--dim);margin-left:6px;font-variant-numeric:tabular-nums}
.cf-pop .cf-sec{font-size:12px;color:var(--dim);margin:2px 0 6px;letter-spacing:.3px}
.cf-pop .cf-item{padding:5px 0;border-bottom:1px dashed var(--line-soft);line-height:1.7;cursor:pointer;border-radius:4px}
.cf-pop .cf-item:last-child{border-bottom:none}
.cf-pop .cf-item:hover{background:var(--panel-3);padding-left:6px}
.cf-pop .cf-sec-hard{color:var(--danger);font-weight:600;margin-top:6px}
.cf-item.cf-pending{cursor:default}
.cf-item.cf-pending:hover{background:transparent;padding-left:0}
.cf-pair{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cf-who{font-weight:700;color:var(--txt)}
.cf-date{color:var(--dim);font-size:12px}
.cf-pair-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:3px 0 6px}
.cf-jump{color:var(--accent);text-decoration:none;cursor:pointer;border-bottom:1px dotted var(--accent)}
.cf-jump:hover{text-decoration:underline}
.cf-arrow{color:var(--dim);font-size:12px}
.cf-pair-actions{display:flex;gap:6px}
.cf-ok,.cf-bad{font-size:12px;padding:3px 10px;border-radius:99px;cursor:pointer;border:1px solid}
.cf-ok{background:rgba(46,160,67,.14);border-color:rgba(46,160,67,.45);color:var(--txt)}
.cf-ok:hover{background:rgba(46,160,67,.26)}
.cf-bad{background:rgba(229,72,77,.12);border-color:rgba(229,72,77,.45);color:var(--txt)}
.cf-bad:hover{background:rgba(229,72,77,.24)}
.cf-ignore{font-size:12px;padding:3px 10px;border-radius:99px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--dim)}
.cf-ignore:hover{background:var(--panel-3);color:var(--txt)}
.cf-hard-text{cursor:pointer}
.cf-hard-text:hover{color:var(--accent)}
.cf-item.cf-hard{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cf-item.cf-hard .cf-ignore{flex:0 0 auto}

/* 跳转定位后的目标卡片高亮 */
.ev.flash{animation:evFlash 2.2s ease}
@keyframes evFlash{0%,55%{outline:3px solid var(--accent);outline-offset:2px;background:var(--panel-2)}100%{outline:none}}

/* ---------- layout ---------- */
.layout{flex:1;display:grid;grid-template-columns:clamp(292px,22vw,392px) minmax(0,1fr);min-height:0;position:relative}
.aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
/* 抽屉遮罩（窄屏抽屉模式下才显示） */
.aside-mask{display:none}
.aside-close{display:none;margin-left:auto;border:none;background:none;color:var(--dim);font-size:13px;padding:2px 7px;white-space:nowrap}
.aside-close:hover{color:var(--txt)}
.aside-scroll{flex:1;min-height:0;overflow:auto;padding:16px 16px 22px;display:flex;flex-direction:column;gap:14px}
/* 关键：滚动容器里的子项一律不压缩，否则空间不够时 flex 会把输入框压扁，而不是出现滚动条 */
.aside-scroll > *{flex:0 0 auto}
.aside-foot{flex:0 0 auto;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel-2);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.aside-foot[hidden]{display:none}
.section-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--txt);letter-spacing:.4px;flex-wrap:wrap}
.section-title .tag{font-size:12px;font-weight:400;color:var(--dim)}
.hint{font-size:12px;color:var(--dim);line-height:1.8;margin:0}
.hint code{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px;color:var(--txt);white-space:nowrap}
#input{min-height:96px;height:clamp(110px,16vh,220px);max-height:min(50vh,420px);resize:vertical;line-height:1.75;font-size:12.5px;overflow:auto}
.row{display:flex;gap:9px;flex-wrap:wrap}
/* 文件上传 + 图片粘贴 */
.file-drop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.file-drop .btn-file{white-space:nowrap}
.paste-hint{font-size:12px;color:var(--dim);flex:1 1 100%}
#input.dragover{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
/* 整个录入栏作为拖放区时的整体高亮 */
.aside.dragover{outline:2px dashed var(--accent);outline-offset:-6px;background:rgba(224,11,65,.05)}
.aside.dragover .drop-overlay{display:flex}
.drop-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(224,11,65,.07);color:var(--accent);font-size:15px;font-weight:700;pointer-events:none;z-index:5;border-radius:var(--radius)}
.drop-hint{font-size:12px;color:var(--dim);margin-top:4px}
.drop-hint b{color:var(--accent)}
.paste-img-preview{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-top:6px}
.paste-img-preview img{max-height:44px;border-radius:6px;border:1px solid var(--line)}

/* preview */
#previewWrap{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);overflow:hidden}
.pv-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
.pv-head .cnt{font-weight:400;color:var(--dim);font-size:12px}
.pv-list{padding:10px;display:flex;flex-direction:column;gap:10px}
.pv-item{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:5px;position:relative}
.pv-item input,.pv-item select{padding:5px 7px;font-size:12px;border-radius:6px}
.pv-item .grow2{display:grid;grid-template-columns:1.15fr .85fr;gap:5px}
.pv-item .grow3{display:grid;grid-template-columns:1fr 90px;gap:5px}
.pv-item .grow3 select{padding:5px 2px 5px 5px;font-size:12px}
.pv-item .rm{position:absolute;top:5px;right:6px;font-size:12px;color:var(--dim);background:none;border:none;padding:2px 5px}
.pv-suggest{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.chip{border:1px dashed var(--accent);color:#b32505;background:transparent;border-radius:99px;padding:2px 9px;font-size:12px}
.chip:hover{background:rgba(224,11,65,.05)}
.pv-foot{padding:9px 12px;border-top:1px solid var(--line);display:flex;gap:8px}

/* ---------- calendar ---------- */
.cal{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.leader{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel-2);cursor:pointer;transition:.13s}
.leader:hover{border-color:var(--accent);background:var(--panel-3)}
.leader-top{display:flex;align-items:baseline;gap:6px}
.leader-top b{font-size:13px;white-space:nowrap}
.leader-top .role{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-mini{margin-left:auto;font-size:12px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--dim-2);white-space:nowrap}
.leader:hover .copy-mini{border-color:var(--accent);color:var(--accent)}
.duty{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.55}
.cal-scroll{flex:1;overflow:auto;padding:16px 18px 26px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;align-items:start}
.daycol{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-height:300px;display:flex;flex-direction:column;overflow:hidden}
.daycol.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.daycol.weekend .dayhead{color:var(--dim)}
.dayhead{display:flex;align-items:baseline;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);position:sticky;top:0;z-index:2;flex-wrap:wrap}
.dayhead .wd{font-size:12.5px;font-weight:700}
.dayhead .dt{font-size:12px;color:var(--dim)}
.dayhead .n{margin-left:auto;font-size:12px;color:var(--dim-2);white-space:nowrap}
.slot{border-top:1px solid var(--line-soft);padding:8px 8px 10px;display:flex;flex-direction:column;gap:7px}
.slot:first-of-type{border-top:none}
.slot-label{font-size:12px;color:var(--dim-2);letter-spacing:2px;padding-left:3px}
.slot-body{display:flex;flex-direction:column;gap:7px}
.slot-empty{font-size:12px;color:var(--dim-2);text-align:center;padding:6px 0;opacity:.45}
.empty{color:var(--dim-2);font-size:12px;text-align:center;padding:18px 0;line-height:1.7}

/* ---------- 下周会议预告 ---------- */
.nextweek{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.nw-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);font-size:12.5px;font-weight:700}
.nw-head .sub{font-weight:400;font-size:12px;color:var(--dim)}
.nw-head .acts{margin-left:auto;display:flex;gap:6px}
.nw-head button{font-size:12px;padding:3px 9px;border-radius:99px}
.nw-body{padding:8px 12px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:6px 16px}
.nw-day{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:start;padding:7px 2px;border-bottom:1px dashed var(--line-soft)}
.nw-day.weekend .nw-date b{color:var(--dim)}
.nw-date{line-height:1.45}
.nw-date b{display:block;font-size:12px;letter-spacing:.2px}
.nw-date span{font-size:12px;color:var(--dim-2)}
.nw-items{display:flex;flex-direction:column;gap:5px;min-width:0}
.nw-item{display:flex;gap:6px;align-items:baseline;font-size:12px;line-height:1.5;min-width:0}
.nw-item .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;margin-top:5px}
.nw-item .t{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:34px}
.nw-item .body{min-width:0}
.nw-item .n{font-weight:600;word-break:break-word}
.nw-item .p{color:var(--dim);font-size:12px;margin-left:6px;white-space:nowrap}
.nw-item .ls{color:var(--accent);font-size:12px;margin-left:6px;white-space:nowrap}
.nw-item.city .dot{background:var(--city-a)}
.nw-item.internal .dot{background:var(--in-a)}
.nw-item.dept .dot{background:var(--dim-2)}
.nw-empty{padding:16px;text-align:center;color:var(--dim-2);font-size:12px;line-height:1.7}
.nw-more{grid-column:1/-1;font-size:12px;color:var(--dim-2);text-align:right;padding:2px 4px 0}

/* ---------- 云文档同步 ---------- */
.badge{display:inline-block;min-width:15px;height:15px;line-height:15px;text-align:center;background:var(--warn);color:#231a00;border-radius:99px;font-size:12px;font-weight:700;padding:0 4px;margin-left:5px;vertical-align:1px}
.sync-target{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);font-size:12.5px}
.sync-target a{margin-left:auto;color:var(--accent);text-decoration:none;font-size:12px}
.sync-target a:hover{text-decoration:underline}
.sync-table{width:100%;border-collapse:collapse;font-size:12px}
.sync-table th{text-align:left;color:var(--dim);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
.sync-table td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.65}
.sync-table tr:last-child td{border-bottom:none}
.sync-skip{font-size:12px;color:var(--dim);background:var(--panel-2);border:1px dashed var(--line);border-radius:9px;padding:11px 13px;line-height:1.8}
.snap-bar{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);font-size:12px;line-height:1.6;margin-top:10px;flex-wrap:wrap}
.snap-bar.ok{border-color:rgba(46,160,67,.45);background:rgba(46,160,67,.09)}
.snap-bar.none{border-color:rgba(210,153,34,.45);background:rgba(210,153,34,.09)}
.snap-bar.stale{border-color:rgba(210,153,34,.45);background:rgba(210,153,34,.07)}
.snap-ico{font-size:15px;flex:none;line-height:1}
.snap-main{flex:1;min-width:0}
.snap-main b{display:block;font-size:12.5px}
.snap-sub{color:var(--dim);font-size:12px;word-break:break-all}
.snap-box{margin-top:8px;display:flex;flex-direction:column;gap:7px}
.snap-box textarea{min-height:104px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.6}
.snap-box .row{gap:6px;flex-wrap:wrap}
.sync-dup{font-size:12px;color:var(--dim);background:rgba(210,153,34,.08);border:1px dashed rgba(210,153,34,.45);border-radius:9px;padding:9px 11px;line-height:1.75;margin-top:8px}
.sync-dup b{color:var(--txt)}
.sync-dup .dup-line{padding:1px 0}
.tag-exist{display:inline-block;font-size:12px;padding:0 5px;border-radius:4px;background:rgba(210,153,34,.18);color:#c08a1e;margin-left:4px;vertical-align:1px}

/* ---------- 需从云文档删除 ---------- */
.sync-rm{border:1px solid rgba(229,72,77,.42);background:rgba(229,72,77,.07);border-radius:11px;padding:12px 13px;margin-top:10px}
.rm-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.rm-head b{font-size:13px;color:var(--txt)}
.rm-sub{font-size:12px;color:var(--dim)}
.rm-table{margin-bottom:9px}
.rm-table td{border-bottom:1px solid rgba(229,72,77,.16)}
.rm-opt{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.6;color:var(--txt);cursor:pointer;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.rm-opt input{margin:2px 0 0;width:auto;flex:none}
.rm-note{font-size:12px;color:var(--dim);line-height:1.6;margin-top:6px;padding-left:2px}
.rm-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rm-btn{font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid rgba(229,72,77,.55);background:rgba(229,72,77,.16);color:var(--txt);font-weight:600}
.rm-btn:hover{background:rgba(229,72,77,.26)}
.rm-btn.ghost{border-color:var(--line);background:transparent;color:var(--dim);font-weight:400}
.rm-btn.ghost:hover{background:var(--panel-2);color:var(--txt)}
.sync-stale{margin-top:10px;padding:10px 12px;border:1px solid rgba(210,153,34,.5);background:rgba(210,153,34,.1);border-radius:10px;font-size:12px;line-height:1.75;color:var(--txt)}
.sync-stale b{color:#d29922}
.sync-gone{margin-top:10px;border:1px solid rgba(210,153,34,.42);background:rgba(210,153,34,.07);border-radius:11px;padding:12px 13px}
.gone-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--txt)}
.gone-head b{color:#d29922}
.sync-gone.pend{border-color:rgba(229,72,77,.45);background:rgba(229,72,77,.07)}
.sync-gone.pend .gone-head b{color:#f85149}
.gone-sub{font-size:12px;color:var(--dim)}
.gone-list{margin-top:7px;font-size:12px;color:var(--dim);line-height:1.75}
.gone-line{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 直连同步（本地服务） ---------- */
/* 同步状态：与顶部其它按钮同一套外观（同样的边框/圆角/底色/字号），只用一个小圆点表达状态 */
.rt-chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.rt-chip .rt-dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:0 0 auto;transition:.2s}
.rt-chip.on .rt-dot{background:#3fb950;box-shadow:0 0 0 3px rgba(63,185,80,.16)}
.rt-chip.warn .rt-dot{background:#d29922}
.rt-chip.err .rt-dot{background:var(--danger)}
.rt-chip.busy .rt-dot{background:var(--accent);animation:rtPulse .9s ease-in-out infinite}
.rt-chip.off .rt-dot,.rt-chip.idle .rt-dot{background:var(--dim);opacity:.55}
@keyframes rtPulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
:root[data-theme="light"] .rt-chip.on .rt-dot{background:#1a7f37;box-shadow:0 0 0 3px rgba(26,127,55,.14)}
:root[data-theme="light"] .rt-chip.warn .rt-dot{background:#8a5b00}
/* 实时同步设置面板 */
.live-card{border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:var(--panel-2);margin-top:9px}
.live-card.live{border-color:rgba(46,160,67,.4);background:rgba(46,160,67,.07)}
.live-card.offline{border-color:rgba(210,153,34,.4);background:rgba(210,153,34,.06)}
.live-card h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:7px}
.live-card p{margin:0;font-size:12px;color:var(--dim);line-height:1.7}
.live-row{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.live-row:last-child{border-bottom:none}
.live-row input[type="checkbox"]{margin-top:3px;flex:0 0 auto;width:15px;height:15px;accent-color:var(--accent)}
.live-row .live-txt{min-width:0;flex:1 1 auto}
.live-row .live-txt b{font-size:12.5px;font-weight:600}
.live-row .live-txt span{display:block;font-size:12px;color:var(--dim);line-height:1.6;margin-top:1px}
.live-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);line-height:1.8;margin-top:8px}
.live-meta b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
.live-note{margin-top:9px;padding:9px 11px;border-radius:9px;border:1px solid rgba(46,160,67,.35);background:rgba(46,160,67,.07);font-size:12px;line-height:1.7;color:var(--dim)}
.live-note b{color:#2ea043;font-weight:700}
.sync-hero{border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--panel-2);margin-top:9px}
.sync-hero.live{border-color:rgba(46,160,67,.4);background:rgba(46,160,67,.07)}
.sync-hero.offline{border-color:rgba(210,153,34,.4);background:rgba(210,153,34,.06)}
.sync-hero h4{margin:0 0 4px;font-size:13px}
.sync-hero p{margin:0 0 10px;font-size:12px;color:var(--dim);line-height:1.65}
.sync-hero .hero-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.sync-hero .hero-actions button{flex:0 1 auto;max-width:100%;white-space:normal;padding:9px 15px;min-height:36px;line-height:1.45;overflow-wrap:anywhere}
.sync-hero code{background:var(--panel-3);padding:1px 5px;border-radius:4px;font-size:12px}
.sync-log{font-size:12px;line-height:1.85;color:var(--dim);max-height:220px;overflow:auto;background:var(--panel-3);border-radius:8px;padding:8px 10px;margin-top:9px;font-family:ui-monospace,Consolas,monospace}
.sync-log .ok{color:#3fb950}
.sync-log .skip{color:#d29922}
.sync-log .err{color:var(--danger)}
.sync-res{margin-top:9px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sync-res .res-cap{padding:8px 11px;background:var(--panel-3);font-size:12px;font-weight:700}
.sync-res .res-row{padding:6px 11px;font-size:12px;border-top:1px solid var(--line-soft);line-height:1.6}
.sync-res .res-row b{font-weight:700}
.busy{opacity:.6;pointer-events:none;position:relative}

.ev{border-radius:var(--radius-sm);padding:9px 10px;cursor:pointer;position:relative;border:1px solid var(--line);transition:box-shadow .15s,transform .15s}
.ev:hover{transform:translateY(-1px);box-shadow:var(--shadow-hover)}
.ev .ev-top{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.92;flex-wrap:wrap}
.ev .ev-time{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.3px;white-space:nowrap}
.ev .ev-place{opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 40px}
.ev .ev-sync{margin-left:auto;flex:none;font-size:12px;height:16px;line-height:14px;padding:0 6px;border-radius:99px;white-space:nowrap;font-weight:700;letter-spacing:0}
.ev .ev-sync.doc{background:#0d7a3e;color:#fff;border:1px solid #0d7a3e}
.ev .ev-sync.pushed{color:inherit;border:1px dashed currentColor;opacity:.62;background:transparent}
.ev .ev-sync.gone{color:#b42318;border:1px solid rgba(180,35,24,.5);background:rgba(180,35,24,.09)}
.ev .ev-sync.stale{color:#8a5b00;border:1px solid rgba(138,91,0,.5);background:rgba(210,153,34,.14)}
:root[data-theme="light"] .ev .ev-sync.gone{color:#b42318;border-color:rgba(180,35,24,.45);background:rgba(180,35,24,.09)}
.ev .ev-title{font-size:13px;font-weight:700;margin-top:5px;line-height:1.52;word-break:break-word}
.ev .ev-leaders{font-size:12px;margin-top:5px;opacity:.95;line-height:1.6;word-break:break-word}
.ev .ev-note{font-size:12px;margin-top:5px;opacity:.75;line-height:1.6}
.ev .ev-sug{font-size:12px;margin-top:5px;opacity:.8;font-style:italic}
.ev.city{background:var(--ev-city-bg);color:var(--txt);border-color:var(--ev-city-line)}
.ev.city .ev-time{color:var(--ev-city-ink)}
.ev.internal{background:var(--ev-in-bg);color:var(--txt);border-color:var(--ev-in-line)}
.ev.internal .ev-time{color:var(--ev-in-ink)}
.ev.dept{background:var(--panel-2);color:var(--txt);border-color:var(--line)}
.ev.dept .ev-time{color:var(--dim)}
.ev.conflict{outline:2px dashed var(--warn);outline-offset:1px}
.ev.conflict::after{content:"冲突";position:absolute;top:-7px;right:6px;background:var(--warn);color:#231a00;font-size:12px;font-weight:700;padding:1px 6px;border-radius:99px}

/* ---------- modal ---------- */
.backdrop{position:fixed;inset:0;background:rgba(4,7,12,.62);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.backdrop[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(780px,100%);max-height:88vh;max-height:88dvh;display:flex;flex-direction:column}
.modal.sm{width:min(540px,100%)}
.modal-head{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:15px}
.modal-head .x{margin-left:auto}
.modal-body{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
/* 同理：弹窗内容不压缩，超出就滚动，避免按钮/文字被挤掉 */
.modal-body > *{flex:0 0 auto}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--dim)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
textarea.code{min-height:120px;font-family:Consolas,"Courier New",monospace;font-size:12px;line-height:1.6}

/* leader table */
table.lt{width:100%;border-collapse:collapse;font-size:12px}
table.lt th{text-align:left;font-weight:600;color:var(--dim);padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px}
table.lt td{padding:4px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.lt input,table.lt select{padding:5px 6px;font-size:12px}
table.lt td.nm{width:78px}
table.lt td.tt{width:120px}
table.lt td.ab{width:76px}
table.lt td.act{width:34px;text-align:center}
.subhead{display:flex;flex-direction:column;gap:3px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px}
.subhead b{color:var(--txt)}
.del-x{border:none;background:none;color:var(--dim);font-size:14px;padding:2px 5px}
.del-x:hover{color:var(--danger)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--panel-3);border:1px solid var(--line);color:var(--txt);padding:9px 16px;border-radius:99px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 文件夹监听：右下角会议通知提醒 ===== */
.watch-stack{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:10px;
  align-items:flex-end;max-width:min(400px,calc(100vw - 24px));max-height:min(70vh,560px);overflow-y:auto;
  overflow-x:hidden;pointer-events:none;padding:2px}
.watch-stack:empty{display:none}
.wcard{pointer-events:auto;width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:12px 13px 11px;animation:wcardIn .28s cubic-bezier(.2,.8,.3,1);font-size:12.5px;line-height:1.6}
@keyframes wcardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.wcard.bad{border-color:rgba(193,53,21,.5);background:#fff6f4}
.wc-head{display:flex;align-items:flex-start;gap:8px}
.wc-ico{flex:0 0 auto;font-size:14px;line-height:1.35}
.wc-name{flex:1 1 auto;font-weight:600;color:var(--txt);font-size:12.5px;
  overflow-wrap:anywhere;word-break:break-all}
.wc-x{flex:0 0 auto;background:none;border:none;color:var(--dim-2);padding:0 2px;line-height:1;
  font-size:13px;cursor:pointer;border-radius:4px}
.wc-x:hover{color:var(--txt);background:var(--panel-3)}
.wc-meta{margin-top:6px;color:var(--dim);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px}
.wc-meta b{color:var(--txt);font-weight:600}
.wc-title{margin-top:5px;color:var(--txt);font-weight:600;font-size:12.5px;overflow-wrap:anywhere}
.wc-err{margin-top:6px;color:var(--danger,#e5484d);font-size:12px;overflow-wrap:anywhere}
.wc-act{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.wc-act button{font-size:12px;padding:5px 11px;border-radius:7px}
.wc-act .wc-ok{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink);font-weight:600}
.wc-act .wc-ok:hover{background:#c00039;border-color:#c00039}
@media(max-width:640px){.watch-stack{right:10px;left:10px;bottom:10px;max-width:none;align-items:stretch;max-height:70vh;overflow:auto}}

/* 右上角是参会统计卡：监听卡片出现时把它顶上去，别互相压住 */
body.watch-on .fp{bottom:calc(16px + var(--watch-h,0px))}

/* 文件夹监听设置面板：常用位置 / 子目录点选 */
.watch-roots,.watch-dirs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.watch-tip{width:100%;font-size:12px;color:var(--dim-2);margin-top:2px;overflow-wrap:anywhere}
.watch-chip{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--txt);max-width:100%;overflow-wrap:anywhere}
.watch-chip:hover{background:var(--panel-3);border-color:var(--accent);color:var(--accent)}
.watch-chip.up{font-weight:600}
.watch-badge{display:inline-block;margin-left:6px;min-width:16px;padding:0 5px;border-radius:99px;
  background:var(--accent-fill);color:var(--accent-ink);font-size:12px;font-weight:700;line-height:16px;text-align:center}
.legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--dim);padding:11px 18px 4px;flex-wrap:wrap;line-height:1.7}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* 悬浮统计卡 */
.fp{position:fixed;right:16px;bottom:16px;width:clamp(250px,21vw,326px);max-height:min(72vh,580px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:45;overflow:hidden}
.fp[hidden]{display:none}
.fp-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);font-size:12.5px;font-weight:700}
.fp-head .sub{font-weight:400;font-size:12px;color:var(--dim)}
.fp-head .x{margin-left:auto;border:none;background:none;color:var(--dim);font-size:13px;padding:2px 6px}
.fp-body{flex:1;min-height:0;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.fp-foot{padding:8px 10px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.fp-foot button{font-size:12px}
.rank{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:var(--panel-2);cursor:pointer;transition:.13s}
.rank:hover{border-color:var(--accent);background:var(--panel-3)}
.rank.on{border-color:var(--accent);background:var(--panel-3);box-shadow:0 0 0 1px var(--accent) inset}
.rank .idx{flex:0 0 15px;font-size:12px;color:var(--dim-2);font-variant-numeric:tabular-nums}
.rank b{font-size:12.5px;white-space:nowrap}
.rank .role{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rank .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.rank .more{flex:none;font-size:12px;color:var(--dim-2);opacity:0;transform:translateX(-2px);transition:.15s}
.rank:hover .more,.rank.on .more{opacity:1;transform:none}
.rank .off-tag{flex:none;font-size:12px;line-height:1.5;padding:0 5px;border-radius:4px;
  border:1px solid rgba(210,153,34,.45);color:#d29922;background:rgba(210,153,34,.1);white-space:nowrap}
.rank-bar{height:3px;border-radius:99px;background:var(--line);margin:-3px 2px 3px;overflow:hidden}
.rank-bar>div{height:100%;background:var(--accent);opacity:.6;border-radius:99px;transition:width .2s}
.fp-total{font-size:12px;color:var(--dim);text-align:right;padding:2px 2px 0}
/* 参会明细悬浮层 */
.fpop{position:fixed;z-index:60;width:min(336px,calc(100vw - 26px));max-height:min(56vh,430px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow) 0 0 0 1px rgba(0,0,0,.02)}
.fpop[hidden]{display:none}
.fpop-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:9px 11px;
  background:var(--panel-2);border-bottom:1px solid var(--line);font-weight:700;font-size:12px}
.fpop-head em{font-style:normal;font-weight:400;font-size:12px;color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpop-head button{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--panel);color:var(--dim);
  font-size:12px;line-height:1.5;padding:2px 8px;border-radius:6px}
.fpop-head button:hover{color:var(--txt);border-color:var(--dim-2)}
.fpop-item{padding:8px 11px;border-bottom:1px solid var(--line-soft);line-height:1.5}
.fpop-item:last-child{border-bottom:none}
.fpop-item .d{font-size:12px;color:var(--dim-2);font-variant-numeric:tabular-nums}
.fpop-item .t{font-size:12px;font-weight:600;margin-top:2px}
.fpop-item .p{font-size:12px;color:var(--dim);margin-top:1px}
.fpop-empty{padding:18px 12px;text-align:center;color:var(--dim-2);font-size:12px;line-height:1.7}
.fp-empty{font-size:12px;color:var(--dim-2);text-align:center;padding:22px 10px;line-height:1.7}
.fp-out{margin-top:7px;padding-top:6px;border-top:1px dashed var(--line);font-size:12px;color:var(--dim-2);line-height:1.6}
/* 周/月切换 */
.fp-scope{display:flex;align-items:center;gap:7px;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--panel-2);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:none;border-radius:0;background:transparent;padding:4px 11px;font-size:12px;color:var(--dim);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-fill);color:var(--accent-ink);font-weight:700}
.fp-month{display:flex;align-items:center;gap:3px;margin-left:auto;font-size:12px;color:var(--txt)}
.fp-month b{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.2px;min-width:66px;text-align:center;
  cursor:pointer;border-radius:5px;padding:1px 3px;white-space:nowrap}
.fp-month b:hover{color:var(--accent)}
.fp-month button{border:1px solid transparent;background:transparent;color:var(--dim);padding:1px 5px;font-size:12px;line-height:1.3}
.fp-month button:hover{border-color:var(--line);color:var(--txt)}
.tag-trn{font-size:12px;padding:0 4px;border-radius:4px;background:rgba(139,110,247,.18);color:#9b7cf7;white-space:nowrap;font-weight:700}
:root[data-theme="light"] .tag-trn{color:#6f4bd8;background:rgba(139,110,247,.14)}

/* 日历里的「外出培训」占位条 */
.trn{display:flex;flex-direction:column;gap:2px;margin:6px 6px 0;padding:6px 8px;border-radius:8px;border:1px dashed #8b6ef7;background:rgba(139,110,247,.13);font-size:12px;line-height:1.45;cursor:pointer}
.trn:hover{background:rgba(139,110,247,.2)}
.trn .trn-top{display:flex;align-items:center;gap:5px;font-weight:700;font-size:12px}
.trn .trn-top .who{white-space:nowrap}
.trn .trn-top .when{margin-left:auto;font-weight:400;font-size:12px;color:var(--dim);white-space:nowrap}
.trn .trn-ttl{color:var(--txt);opacity:.92;word-break:break-word}
.trn .trn-conf{color:#e5484d;font-size:12px;font-weight:700}
:root[data-theme="light"] .trn{border-color:#7c5cf0;background:rgba(124,92,240,.10)}
.trn-legend i{background:rgba(139,110,247,.55)}

/* 培训面板 */
.trn-list{display:flex;flex-direction:column;gap:6px}
.trn-item{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--panel-2);font-size:12px;line-height:1.5}
.trn-item .d{font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap;font-size:12px}
.trn-item .t{flex:1;min-width:0;word-break:break-word}
.trn-item .t b{font-size:12.5px}
.trn-item .ops{display:flex;gap:2px;flex:0 0 auto}
.trn-item .ops button{border:none;background:none;color:var(--dim);padding:1px 4px;font-size:12px}
.trn-item .ops button:hover{color:var(--accent)}
.trn-item .ops button.del:hover{color:var(--danger)}
.trn-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;align-items:end}

/* ================= 响应式：拖拽窗口即自适应 ================= */
/* 断点设计（针对分屏场景）：
 *   >1320px   宽屏：左栏常驻（22vw），日历 7 列
 *   1180~1320 中宽：左栏收窄到 26vw，日历仍 7 列
 *   960~1180  分屏主战场：左栏变抽屉（点「＋录入」滑出），日历 5 列
 *   720~960   窄分屏：抽屉模式，日历 4 列
 *   500~720   更窄：抽屉模式，日历 2 列，topbar 折叠
 *   <500px    手机：抽屉全宽，日历 1 列
 */

/* 1) 宽屏微调 */
@media (max-width:1560px){
  .brand span{display:none}
  .weeknav .range{min-width:140px}
}
@media (max-width:1320px){
  .layout{grid-template-columns:clamp(280px,26vw,340px) minmax(0,1fr)}
  .week{gap:10px}
}

/* 2) 中宽：topbar 次要按钮收进「更多」，日历 6 列 */
@media (max-width:1280px){
  .week{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
  .daycol{min-height:auto}
}

/* 3) 分屏主战场：侧栏抽屉化 + 日历 5 列 */
@media (max-width:1180px){
  .entry-toggle{display:inline-flex}
  .aside-close{display:inline-block}
  .aside-mask{display:block}
  /* 侧栏改为抽屉：覆盖层滑出 */
  .layout{grid-template-columns:minmax(0,1fr);position:relative}
  .aside{
    position:absolute;left:0;top:0;bottom:0;width:min(360px,88vw);z-index:50;
    border-right:1px solid var(--line);border-radius:0 var(--radius) var(--radius) 0;
    box-shadow:var(--shadow);
    transform:translateX(-102%);transition:transform .22s ease;
  }
  .aside.open{transform:translateX(0)}
  /* 抽屉遮罩 */
  .aside-mask{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:49;opacity:0;pointer-events:none;transition:opacity .2s}
  .aside-mask.on{opacity:1;pointer-events:auto}
  .week{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
}

/* 4) 窄分屏：日历 4 列 */
@media (max-width:960px){
  .week{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  /* topbar 只保留核心：品牌 + 录入 + 周切换 + 同步/读回；其余进更多 */
  .cal-scroll{padding:14px 14px 84px}
}

/* 5) 更窄：日历 2 列，topbar 折叠换行 */
@media (max-width:720px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .legend{font-size:12px;gap:10px}
  .fp{width:min(88vw,300px);right:12px;bottom:74px;max-height:46vh}
}

/* 6) 手机：日历 1 列 */
@media (max-width:500px){
  body{font-size:13.5px}
  .topbar{padding:10px 12px;gap:8px}
  .brand b{font-size:15px}
  .weeknav .range{min-width:118px;font-size:13px}
  .week{grid-template-columns:minmax(0,1fr);gap:9px}
  .aside{width:100vw}
  .modal-body{padding:15px 15px}
  .modal-foot{padding:11px 15px}
  .modal-foot button{flex:1 1 auto}
  .nw-body{grid-template-columns:minmax(0,1fr)}
}

/* 7) 矮屏：压缩纵向留白，保证一屏能看到内容 */
@media (max-height:720px){
  .aside-scroll{padding-top:12px;gap:11px}
  #input{min-height:72px;height:auto;max-height:26vh}
  .daycol{min-height:200px}
}
@media (max-height:560px){
  .topbar{padding:8px 16px}
  .legend{padding:6px 18px 2px}
  .cal-scroll{padding-top:10px}
  .aside-scroll{padding-top:8px;gap:8px}
  #input{min-height:60px}
}

/* ===== Airbnb 精修层 =====
 * 统一浮层/卡片圆角与「单层阴影」；卡片默认无阴影，仅悬浮时抬起。
 * 不引入任何发光、渐变边框或彩色投影。
 */
.search-pop,.more-menu,.cf-pop,.fpop{border-radius:var(--radius);box-shadow:var(--shadow);border-color:var(--line)}
.modal{border-radius:16px;box-shadow:var(--shadow)}
.fp,.nextweek,.daycol,#previewWrap{border-color:var(--line)}
.daycol{transition:box-shadow .15s,border-color .15s}

.leader,.sync-target,.rank,.trn-item,.live-card,.sync-hero,.sync-res,.snap-bar,.sync-skip,.sync-dup{border-radius:var(--radius-sm)}
.search-box input{border-radius:9999px}
.topbar{background:var(--panel);border-bottom-color:var(--line)}
.hint code{background:var(--panel-2);border-color:var(--line)}
.fp-head,.nw-head,.dayhead,.aside-foot,.modal-head,.modal-foot,.fp-scope,.fp-foot{background:var(--panel-2)}
</style>
</head>

<script>
/*PARSER-START*/
/* ================= 纯解析层（不依赖 DOM，可独立测试） ================= */
function pad2(n){ return String(n).padStart(2,'0'); }

var CN_NUM = {'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function cnNum(s){
  if(s===undefined||s===null) return NaN;
  s = String(s).trim();
  if(/^\d+$/.test(s)) return parseInt(s,10);
  if(s==='十') return 10;
  if(s==='半') return 30;
  if(/^十[一二三四五六七八九]$/.test(s)) return 10 + CN_NUM[s[1]];
  if(/^[一二三四五六七八九]十$/.test(s)) return CN_NUM[s[0]]*10;
  if(/^[一二三四五六七八九]十[一二三四五六七八九]$/.test(s)) return CN_NUM[s[0]]*10 + CN_NUM[s[2]];
  if(s.length===1 && (s in CN_NUM)) return CN_NUM[s];
  return NaN;
}

// 常见的「月日」简写：10.31 / 10 31 / 10/31 / 10-31 都要认，但不能把小数、房号、时间误当日期
function mdLooksLikeDate(M, D, tail, allowHao){
  if(!(M >= 1 && M <= 12) || !(D >= 1 && D <= 31)) return false;
  if(D > 12) return true;                       // 日 > 12 必然不是小数（10.31 / 10 31）
  var t = String(tail || '').replace(/^\s+/, '');
  if(t.charAt(0) === '日') return true;         // 10.5日
  if(allowHao && t.charAt(0) === '号') return true;  // 10.5号（但「3 5号」更像房号，空格写法不认号）
  // 日 ≤ 12 有歧义（3.5 可能是小数），必须紧跟星期/时段，或后面就是时间、标点、行尾
  return /^(?:星期|周|礼拜|上午|下午|中午|晚上|早上|傍晚|凌晨|\(|（|,|，|;|；|。|$)/.test(t) ||
         /^\d{1,2}\s*[:：]/.test(t);
}
function normalizeText(text){
  return (text||'')
    .replace(/\r\n?/g,'\n')   // 统一换行：单独的 \r 也要变成换行，否则两行会粘成一行
    .replace(/：/g,':').replace(/，/g,',').replace(/；/g,';')
    .replace(/（/g,'(').replace(/）/g,')')
    .replace(/[－—–]/g,'-')
    .replace(/[ \t\u3000]+/g,' ')
    // 全日期：2026-10-31 / 2026.10.31 / 2026/10/31 → 2026年10月31日
    .replace(/(\d{4})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{1,2})/g,'$1年$2月$3日')
    // 月日：10-31 / 10/31 → 10月31日
    .replace(/(?<![\d年月:.])(\d{1,2})\s*[-\/]\s*(\d{1,2})(?![\d:])/g,'$1月$2日')
    // 月日（点号）：10.31 → 10月31日（3.5 这类小数不动）
    // 后面紧跟冒号的不是日期，是「序号 + 时间」（1. 14:30），留给后面按多场会议拆
    .replace(/(^|[^\d年月日:.\/])(\d{1,2})\s*[.．]\s*(\d{1,2})(?![\d.．:])/g, function(all, pre, m1, m2, off, str){
      var tail = str.slice(off + all.length);
      return mdLooksLikeDate(+m1, +m2, tail, true) ? pre + m1 + '月' + m2 + '日' : all;
    })
    // 月日（空格）：10 31 → 10月31日
    .replace(/(^|[^\d年月日:.第共约\/])(\d{1,2})[ ]+(\d{1,2})(?![\d年月日号室楼层台位名人个次时点分秒%％])/g, function(all, pre, m1, m2, off, str){
      var tail = str.slice(off + all.length);
      return mdLooksLikeDate(+m1, +m2, tail, false) ? pre + m1 + '月' + m2 + '日' : all;
    });
}

var DATE_FULL = /(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/;
var DATE_MD   = /(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/;
var WD_RE     = /(?:\(|（)?(?:星期|周|礼拜)([一二三四五六日天])(?:\)|）)?/;
var WD_MAP    = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':7,'天':7};

function findDate(s, refDate){
  var ref = refDate || new Date();
  var m = s.match(DATE_FULL);
  if(m){
    return { date: m[1]+'-'+pad2(m[2])+'-'+pad2(m[3]), raw: m[0] };
  }
  m = s.match(DATE_MD);
  if(m){
    var y = ref.getFullYear();
    var d = new Date(y, +m[1]-1, +m[2]);
    if(d.getTime() < ref.getTime() - 180*864e5) d = new Date(y+1, +m[1]-1, +m[2]);
    return { date: d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()), raw: m[0] };
  }
  m = s.match(WD_RE);
  if(m){
    var base = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
    var wd = (base.getDay()+6)%7;            // 0=周一
    var mon = new Date(base); mon.setDate(base.getDate()-wd);
    var target = new Date(mon); target.setDate(mon.getDate() + (WD_MAP[m[1]]-1));
    if(target.getTime() < base.getTime()) target.setDate(target.getDate()+7);
    return { date: target.getFullYear()+'-'+pad2(target.getMonth()+1)+'-'+pad2(target.getDate()), raw: m[0] };
  }
  return null;
}

var TIME_RE = /(上午|下午|中午|晚上|早上|傍晚|早晨|凌晨)?\s*(\d{1,3}|十[一二]?|[一二三四五六七八九十]{1,3})\s*(?::\s*(\d{1,2})|([时点])(半|\d{1,2}|[一二三四五六七八九十]{1,3})?\s*分?)/;

function findTime(s){
  var m = s.match(TIME_RE);
  if(!m) return null;
  var per = m[1]||'';
  var h = cnNum(m[2]);
  var mi = 0;
  if(m[3]!==undefined) mi = cnNum(m[3]);
  else if(m[5]!==undefined) mi = (m[5]==='半') ? 30 : cnNum(m[5]);
  if(!isFinite(h)) return null;
  if(!isFinite(mi)) mi = 0;
  if((per==='下午'||per==='晚上'||per==='傍晚') && h<12) h += 12;
  if(per==='中午' && h<12) h += 12;
  if(per==='凌晨' && h===12) h = 0;
  if(h>23 || mi>59) return null;
  return { start: pad2(h)+':'+pad2(mi), raw: m[0] };
}

// 地点：先认「地点:xxx」显式标注，再认「在 xxx 会议室/会场/…」，最后退化为后缀匹配
var PLACE_TAIL = '(?:会议室|会议厅|会场|会堂|礼堂|大厅|多功能厅|指挥中心|\\d{1,4}室|\\d{1,4}楼(?!\\s*\\d)(?!会议|会|室|厅|大)|[一二三四五六七八九十]{1,3}楼(?!\\s*\\d)(?!会议|会|室|厅|大)|楼\\d{1,4}(?!号)|会议室\\d+|厅)';
var PLACE_PATTERNS = [
  new RegExp('(?:地点|地址|会议地点|地点安排)\\s*:\\s*([^\\n,;。()]{2,40})'),
  new RegExp('在\\s*([^,;。\\s()]{2,40}?'+PLACE_TAIL+')(?=\\s*(?:召开|举行|举办|参加|出席|开会|进行|签到)|[,;。\\s]|$)'),
  // 完整房间号（带会议室/室等后缀）要优先于裸编号匹配，否则「B027会议室」会被截成「B027」
  /\b([A-Z]{1,2}\s?\d{2,4}\s*(?:会议室|会议厅|会场|会堂|礼堂|大厅|多功能厅|指挥中心|室|厅))/, 
  /\b([A-Z]{1,2}\s?\d{2,4})\b/,
  new RegExp('([\\u4e00-\\u9fa5A-Za-z0-9()]{2,24}?'+PLACE_TAIL+')'),
  /(\d{1,2}楼\s*\d{1,4}室)/
];
function cleanPlace(v){
  var t = String(v||'')
    .replace(/\s+/g,'')
    .replace(/^(?:在|于|到|至)+/,'')
    .replace(/(?:召开|举行|举办|开会|参加|出席|门口|集合)+$/,'');
  return t.trim();
}
function findPlace(s){
  for(var i=0;i<PLACE_PATTERNS.length;i++){
    var m = s.match(PLACE_PATTERNS[i]);
    if(m && m[1]){
      var v = cleanPlace(m[1]);
      if(v.length>=2) return { place:v, raw:m[0] };
    }
  }
  return null;
}

var TITLE_PATTERNS = [
  /(?:会议名称|会议内容|议题|内容|主题)\s*:\s*([^\n,;。]+)/,
  /关于\s*(?:召开|举办|举行|组织)?\s*([^\n,;。]{2,40}?)\s*的?\s*(?:通知|会议通知|函)/,
  /(?:召开|举办|举行|组织)\s*([^\s,;。:\n]{2,30})/
];
// 一条里既有「会议名称:」又有「时间:」「地点:」时，避免把后面字段吞进标题
function cutFields(t){
  return String(t||'')
    .split(/(?:\n|时间\s*:|地点\s*:|参会|出席|列席|备注\s*:|主持\s*:)/)[0]
    .replace(/(?:请|要求|拟请)[^,;。]{0,40}?(?:参加|出席|列席|参会)[\s\S]*$/,'')
    .trim();
}

/* ---------- 「崔局」「谷局」「贺主任」这类口头称呼 → 具体姓名 ---------- */
var ALIAS_KINDS = [
  { re: /([\u4e00-\u9fa5])\s*副?局\s*长?/g, kind: 'ju' },
  { re: /([\u4e00-\u9fa5])\s*主任/g, kind: 'zhuren' },
  { re: /([\u4e00-\u9fa5])\s*书记/g, kind: 'shuji' }
];
// 姓 + 职务怎么落到人：先按职务对，同姓多人时才靠职务区分，只有一个同姓就直接认
function resolveAlias(surname, kind, leaders){
  var cands = (leaders||[]).filter(function(l){ return String(l.name||'').charAt(0) === surname; });
  if(!cands.length) return null;
  var hit = null;
  if(kind === 'ju'){
    // 「X局」默认指一把手：优先「局长」且不是「副局长」的那位
    hit = cands.find(function(l){
      var t = l.title || '';
      return t.indexOf('局长') >= 0 && t.indexOf('副局长') < 0;
    }) || null;
  }else if(kind === 'zhuren'){
    hit = cands.find(function(l){ return (l.title||'').indexOf('主任') >= 0; }) || null;
  }else if(kind === 'shuji'){
    hit = cands.find(function(l){ return (l.title||'').indexOf('书记') >= 0; }) || null;
  }
  if(hit) return hit;
  return cands.length === 1 ? cands[0] : null;   // 同姓只有一人时才敢认
}
// 从一段文字里捞出所有能落地的称谓，返回 [{name, raw}]
function aliasHits(s, leaders){
  var txt = String(s||''), out = [];
  if(!txt) return out;
  ALIAS_KINDS.forEach(function(K){
    K.re.lastIndex = 0;
    var m;
    while((m = K.re.exec(txt))){
      var L = resolveAlias(m[1], K.kind, leaders);
      if(!L) continue;
      if(out.some(function(x){ return x.raw === m[0] && x.name === L.name; })) continue;
      out.push({ name: L.name, raw: m[0], kind: K.kind });
    }
  });
  return out;
}

function findLeaders(s, cfg){
  var names = cfg.leaders.map(function(l){return l.name;});
  var out = [];
  function roleOf(n){
    var l = cfg.leaders.find(function(x){return x.name===n;});
    return l ? (l.title||'') : '';
  }
  function add(n, raw){
    n = String(n||'').trim();
    if(!n) return;
    var got = out.find(function(x){ return x.name === n; });
    if(got){
      if(raw){ got.aliases = got.aliases || []; if(got.aliases.indexOf(raw) < 0) got.aliases.push(raw); }
      return;
    }
    out.push({ name:n, role:roleOf(n), aliases: raw ? [raw] : [] });
  }
  var ex = s.match(/(?:参会领导|参加领导|参会人员|出席领导|参加人员|参会|出席|参加)\s*:\s*([^。;]+)/);
  if(ex){
    ex[1].split(/(?:备注|地点|地址|时间|主持)/)[0].split(/[、,和及与]/).forEach(function(tok){
      tok = tok.replace(/^(请|由|和|与|及)/,'').trim();
      if(!tok) return;
      var hit = names.find(function(n){return tok.indexOf(n)>=0;});
      if(hit){ add(hit); return; }
      var a = aliasHits(tok, cfg.leaders)[0];      // 「参会领导：崔局」这种写法
      if(a){ add(a.name, a.raw); return; }
      add(tok);
    });
  }
  names.forEach(function(n){ if(s.indexOf(n)>=0) add(n); });
  // 称谓这一路补在最后：即便没写全名，只要写了「崔局」也能认出来
  aliasHits(s, cfg.leaders).forEach(function(h){ add(h.name, h.raw); });
  return out;
}

function stripLeaderMentions(s, leaders){
  var t = s;
  leaders.forEach(function(l){
    // 先把吃掉的称谓原文抹掉，否则会混进会议名里
    (l.aliases || []).forEach(function(a){
      if(a) t = t.replace(new RegExp(escapeRe(a), 'g'), ' ');
    });
    if(!l.name) return;
    var re = new RegExp(escapeRe(l.name)+'(?:副局长|局长|副主任|主任|副组长|组长|副书记|书记|调研员)?','g');
    t = t.replace(re,' ');
  });
  return t;
}
function escapeRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function cleanTitle(t){
  return String(t||'')
    .replace(/[()]/g,' ')
    .replace(/(?:定于|拟于|将于|届时|另行通知)/g,' ')
    .replace(/[\s,;:。、.]/g,' ')
    .replace(/^(?:请|由|在|于|和|与|及|并|的|另)+/,'')
    .replace(/^(?:参加|出席|列席|组织|召开|举办|举行)+/,'')
    .replace(/(?:于|在|定于|拟于|将于|就|关系到|涉及)$/,'')
    .replace(/(?:召开|举行|举办|组织)$/,'')
    .replace(/^\d+\s*/,'')
    .replace(/\s+/g,' ')
    .trim();
}

// 会议名称「像不像」一个会议名：强结尾词加分，背景/事务性词结尾扣分
var TITLE_TAIL_STRONG = ['视频会议','电视电话会议','会议','大会','视频会','座谈会','汇报会','调度会','推进会','部署会','动员会','协调会','联席会','评审会','论证会','听证会','发布会','表彰会','总结会','分析会','研判会','培训会','党组会','局务会','办公会','专题会','工作会','例会','年会','论坛','仪式','活动','培训班','读书班'];
var TITLE_TAIL_SOFT = ['会','会期'];
var TITLE_TAIL_BAD = ['期间','之际','精神','要求','部署','安排','通知','文件','工作','情况','内容','议程','主题','范围','对象','时间','地点','形式','方式','主持','记录','报道','宣传','保障','准备','落实'];

function endHit(t, list){
  for(var i=0;i<list.length;i++){
    var w = list[i];
    if(t.length > w.length && t.slice(-w.length) === w) return w;
  }
  return '';
}

function scoreTitle(t, posRatio){
  var s = String(t||'').trim();
  if(s.length < 3) return -999;
  var sc = 0;
  if(endHit(s, TITLE_TAIL_STRONG)) sc += 50;
  else if(endHit(s, TITLE_TAIL_SOFT)) sc += 35;
  if(s.length >= 6 && s.length <= 40) sc += 8;
  else if(s.length > 40) sc -= 12;
  if(endHit(s, TITLE_TAIL_BAD)) sc -= 32;
  if(/^(?:会议|时间|地点|参会|出席|要求|请|现将|有关|事项)/.test(s)) sc -= 6;
  if(/(?:召开|举办|举行|组织)/.test(s)) sc += 10;
  sc += (posRatio||0) * 6;   // 中文通知里会议名多在后半句，位置靠后微加分
  return sc;
}

function fallbackTitle(w){
  var parts = String(w||'').split(/[\s,;。、]/).map(cleanTitle)
    .filter(function(s){ return s.length >= 3; });
  if(!parts.length) return '';
  var best = '', bestScore = -1e9;
  parts.forEach(function(p, i){
    var sc = scoreTitle(p, parts.length>1 ? i/(parts.length-1) : 0);
    if(sc > bestScore){ bestScore = sc; best = p; }
  });
  if(bestScore < 0 && parts.length) best = parts[parts.length-1]; // 都不像会议名时取最后一段
  return best.slice(0,40);
}

function parseChunk(raw, cfg){
  var s0 = String(raw||'').trim();
  s0 = s0.replace(/^(?:\d{1,2}\s*[.、)）]|[（(]\d{1,2}[)）])\s*/,''); // 去掉「1.」「（2）」
  if(!s0) return null;
  var d = findDate(s0, cfg.refDate);
  if(!d) return null;

  var t = findTime(s0);
  var p = findPlace(s0);
  var noteM = s0.match(/备注\s*:\s*([^。;]+)/);
  var note = noteM ? noteM[1].trim() : '';

  var sNoNote = noteM ? s0.replace(noteM[0],' ') : s0;
  var leaders = findLeaders(sNoNote, cfg);

  // 构造用于提取标题的干净串
  var w = s0;
  w = w.replace(d.raw,' ');
  w = w.replace(WD_RE,' ');
  if(t) w = w.replace(t.raw,' ');
  if(p) w = w.replace(p.raw,' ');
  if(noteM) w = w.replace(noteM[0],' ');
  w = w.replace(/(?:会议名称|会议内容|议题|内容|主题|时间|地点|地址|参会领导|参加领导|参会人员|出席领导|备注|主持人?)\s*:\s*/g,' ');
  w = w.replace(/(?:请|要求|拟请)[^。;]{0,50}?(?:参加|出席|列席|参会)[^。;]{0,12}/g,' ');
  w = stripLeaderMentions(w, leaders);

  var title = '';
  var cands = [];
  for(var i=0;i<TITLE_PATTERNS.length;i++){
    var m = w.match(TITLE_PATTERNS[i]);
    if(m && m[1]){
      var tt = cleanTitle(cutFields(m[1]));
      if(tt.length>=2) cands.push({ t: tt, base: (i<2 ? 100 : 0) });
    }
  }
  var fb = fallbackTitle(w);
  if(fb) cands.push({ t: fb, base: 0 });
  var bestSc = -1e9;
  cands.forEach(function(c){
    var sc = c.base + scoreTitle(c.t, 0.5);
    if(sc > bestSc){ bestSc = sc; title = c.t; }
  });
  if(!title) title = '未命名会议';

  var cls = classifyType(s0, cfg);

  return {
    date: d.date,
    start: t ? t.start : '',
    place: p ? p.place : '',
    title: title,
    type: cls,
    leaders: leaders,
    note: note,
    raw: s0
  };
}

function strongInternal(s, cfg){
  var strong = (cfg.keywords && cfg.keywords.strongInternal) || ['局党组','局务会','局长办公会','我局','本局','局机关','机关党委','局内','科室','支部'];
  return strong.some(function(k){ return s.indexOf(k)>=0; });
}

function classifyType(s, cfg){
  var kw = cfg.keywords || {city:[],internal:[]};
  var city = (kw.city||[]).filter(function(k){return k && s.indexOf(k)>=0;});
  var inner = (kw.internal||[]).filter(function(k){return k && s.indexOf(k)>=0;});
  if(strongInternal(s,cfg)) return 'internal';
  if(city.length && inner.length) return city.length>=inner.length ? 'city' : 'internal';
  if(city.length) return 'city';
  if(inner.length) return 'internal';
  return 'dept';
}

function recommendLeaders(text, cfg){
  var pool = (cfg.leaders||[]).filter(function(l){ return !isInactiveOn(l.name, todayISO()); });
  // ① 称谓优先：文本里写了「崔局」「谷局」「贺主任」这类叫法，直接认定，不再按关键词猜
  var ah = aliasHits(text, pool)[0];
  if(ah){
    var L0 = pool.find(function(l){ return l.name === ah.name; });
    if(L0){
      var bk0 = L0.ab ? (pool.find(function(l){ return l.name === L0.ab; }) || null) : null;
      return { name: L0.name, title: L0.title||'', score: 999, hits: [ah.raw], byAlias: ah.raw,
               backup: bk0 ? {name:bk0.name, title:bk0.title||''} : null };
    }
  }
  // ② 否则按分管关键词打分
  var best = null, bestScore = 0, bestHits = [];
  pool.forEach(function(L){
    var sc = 0, hits = [];
    (L.keywords||[]).forEach(function(k){
      if(k && text.indexOf(k)>=0){ sc += Math.max(1,k.length); hits.push(k); }
    });
    if(sc > bestScore){ bestScore = sc; best = L; bestHits = hits; }
  });
  if(!best) return null;
  var backup = null;
  if(best.ab){
    backup = pool.find(function(l){return l.name===best.ab;}) || null;
  }
  return {
    name: best.name, title: best.title||'', score: bestScore, hits: bestHits,
    backup: backup ? {name:backup.name, title:backup.title||''} : null
  };
}

function hasDateLike(line){
  return DATE_FULL.test(line) || DATE_MD.test(line) || WD_RE.test(line);
}

function splitMultiDate(line){
  var re = /(?:\d{4}\s*年\s*)?\d{1,2}\s*月\s*\d{1,2}\s*[日号]?/g;
  var idx = [], m;
  while((m = re.exec(line))){ idx.push(m.index); }
  if(idx.length < 2) return [line];
  var segs = [];
  for(var i=0;i<idx.length;i++){
    var end = (i+1<idx.length) ? idx[i+1] : line.length;
    var seg = line.slice(idx[i], end).trim();
    if(seg) segs.push(seg);
  }
  if(idx[0] > 0){
    var head = line.slice(0, idx[0]).trim();
    if(head) segs[0] = head + ' ' + segs[0];
  }
  return segs;
}

// 从一行里取出日期写法（用于把日期补给拆分后的后续小段）
function dateTokenOf(s){
  s = String(s||'');
  var m = s.match(/(?:\d{4}\s*年\s*)?\d{1,2}\s*月\s*\d{1,2}\s*[日号]/) ||
          s.match(/\d{4}\s*[-\/.]\s*\d{1,2}\s*[-\/.]\s*\d{1,2}/) ||
          s.match(/\d{1,2}\s*月\s*\d{1,2}/);
  return m ? m[0] : '';
}

// 一格/一行里可能挤了多场会：「1. 14:30，…；2. 15:45，…」
//   切点只有两种：分号；或「编号 + 时间」（如「2. 15:45」）
//   切完只保留「自带时间」的片段，不带时间的并回上一段——
//   这样「…会议；请各科室准时参加」不会被误拆成两场会。
function splitMultiMeetings(line){
  var s = String(line||'').trim();
  if(!s) return [];
  // 段首编号（1. / （2） / ①）直接去掉，它只是序号不是内容
  s = s.replace(/^\s*(?:\d{1,2}\s*[.、．)）]|[（(]\d{1,2}[)）]|[①②③④⑤⑥⑦⑧⑨⑩])\s*/, '');
  // 夹在中间的「2. 15:45」＝分号
  var SEPA = /[\s。；;、]*(?:\d{1,2}\s*[.、．)）]|[①②③④⑤⑥⑦⑧⑨⑩])\s*(?=(?:上午|下午|中午|晚上|早上|傍晚|早晨|凌晨)?\s*\d{1,2}\s*[:：时点])/g;
  s = s.replace(SEPA, '；');
  var parts = s.split(/[；;]+/).map(function(x){ return x.trim(); }).filter(Boolean);
  if(parts.length < 2) return [s];
  var out = [], cur = parts[0];
  for(var i = 1; i < parts.length; i++){
    if(findTime(parts[i])){ out.push(cur); cur = parts[i]; }
    else{ cur += '；' + parts[i]; }
  }
  out.push(cur);
  return out.filter(function(x){ return String(x).trim(); });
}

function splitChunks(text){
  var lines = text.split(/\n+/).map(function(s){return s.trim();}).filter(Boolean);
  var raw = [], cur = null;
  // 第一层：按日期归拢成「一条开会通知」
  lines.forEach(function(line0){
    splitMultiDate(line0).forEach(function(line){
      if(hasDateLike(line)){
        cur = line; raw.push(cur);
      } else if(cur){
        // 续行要接在当前这条后面（不能拿 cur 重新拼，否则多行续行会互相覆盖）
        raw[raw.length-1] = raw[raw.length-1] + ' ' + line;
      } else {
        cur = null; // 无日期的开头说明行，丢弃
      }
    });
  });
  // 第二层：一条通知里可能挤了多场会（「1. 14:30…；2. 15:45…」），逐场拆开
  //   后续小段没有日期，得把本条的日期补上，否则会因缺日期被丢掉
  var chunks = [];
  raw.forEach(function(c){
    var dt = dateTokenOf(c);
    var segs = splitMultiMeetings(c).filter(function(sg){ return !!findTime(sg); });
    if(segs.length > 1){
      segs.forEach(function(sg){
        chunks.push(hasDateLike(sg) ? sg : (dt ? dt + ' ' + sg : sg));
      });
    }else{
      chunks.push(c);
    }
  });
  return chunks;
}

/* ================= 结构化公文通知解析 =================
   会议通知的典型结构：
     标题：关于召开……会议的通知
     称呼：各区（市）……：
     正文：根据工作安排……现将有关事项通知如下。
     一、会议时间
     2026年9月14日（星期一）下午14：30
     二、会议地点
     XXX会议室
     三、参会人员
     XXX
   旧的「逐行解析」只认「带日期的那一行」，把标题、地点、参会人员全丢了。
   这里专门识别这种分节通知，把标题+时间+地点+人员拼成完整的一条会议。 */
var NOTICE_SECTION_RE = /^(?:[一二三四五六七八九十]+|[0-9]+)\s*[、.．)）:：]\s*(会议时间|时间|会议地点|地点|会议地址|地址|参会人员|参会领导|参加人员|出席人员|参加领导|出席领导|列席人员|会议内容|会议议程|议程|议题|主要内容|会议主题|主题|会议要求|要求|会议主持|主持|主持人|会议名称|会议议题|会议安排|有关事项|联系人|联系电话|备注)(?:[、.．)）:：]|$)/;

// 抓一个分节标签下、下一个分节标签之前的所有内容行
function noticeSections(lines){
  var secs = [];          // [{label, body:[]}]
  var cur = null;
  lines.forEach(function(ln){
    var m = ln.match(NOTICE_SECTION_RE);
    if(m){
      cur = { label: m[1], body: [] };
      secs.push(cur);
      return;
    }
    if(cur) cur.body.push(ln);
  });
  return secs;
}

// 从通知标题里提取会议名（关于召开/举行……会议/通知）
function noticeTitleOf(lines){
  var title = '';
  for(var i = 0; i < Math.min(lines.length, 8); i++){
    var ln = lines[i];
    // 分节标签（一、会议时间 / 1. 会议地点）不是标题，跳过
    if(NOTICE_SECTION_RE.test(ln)) continue;
    // 地点行（以会议室/会场/厅/室结尾、或带楼层房号）不是标题，跳过
    if(/(?:会议室|会议厅|会场|会堂|礼堂|大厅|多功能厅|指挥中心|\d+室|\d+楼|楼\d+|厅|室)\s*$/.test(ln)) continue;
    // 标题通常含「关于」或「召开/举行/举办」或「通知」，且不含「：」「现将」「如下」这类正文标志
    if(!/关于|召开|举行|举办|通知/.test(ln)) continue;
    if(/(如下|现将|根据|安排|各区|各单位|同志|各位|成员单位|你好)/.test(ln)) continue;
    if(/[：:]/.test(ln)) continue;
    var t = ln.replace(/^关于\s*/, '').replace(/\s*(的)?\s*(预)?通知$/, '').trim();
    if(t.length >= 4){ title = t; break; }
  }
  return title;
}

// 结构化通知解析入口：返回 [{date,start,place,title,leaders,note,type,raw}] 或 null（不匹配时）
function parseNotice(text, cfg){
  var norm = normalizeText(text);
  var lines = norm.split(/\n+/).map(function(s){return s.trim();}).filter(Boolean);
  if(lines.length < 3) return null;
  var secs = noticeSections(lines);
  if(!secs.length) return null;

  // 时间分节：找「会议时间/时间」分节下的日期+时间
  var timeSec = null, placeSec = null, peopleSec = null, contentSec = null;
  secs.forEach(function(s){
    if(/会议时间|时间/.test(s.label) && !timeSec) timeSec = s;
    else if(/会议地点|会议地址|地点|地址/.test(s.label) && !placeSec) placeSec = s;
    else if(/参会人员|参会领导|参加人员|出席人员|参加领导|出席领导|列席人员/.test(s.label) && !peopleSec) peopleSec = s;
    else if(/会议内容|会议议程|议程|议题|主要内容|会议主题|主题|会议议题/.test(s.label) && !contentSec) contentSec = s;
  });

  var timeBody = (timeSec ? timeSec.body.join(' ') : '') || norm;
  var d = findDate(timeBody, cfg.refDate);
  if(!d) return null;
  var t = findTime(timeBody);

  var title = noticeTitleOf(lines) || '';
  // 标题没抓到时，退而求其次：用「会议内容/议程」分节，或用「关于……的通知」正则兜底
  if(!title){
    if(contentSec && contentSec.body.length){
      title = cleanTitle(contentSec.body[0]);
    }else{
      var tm = norm.match(/关于\s*((?:召开|举行|举办|组织)?[^\n,;。]{2,60}?(?:会议|大会|视频会|座谈会|推进会|调度会|部署会|动员会|协调会|联席会))\s*的?\s*(?:预)?通知/);
      if(tm) title = cleanTitle(tm[1]);
    }
  }

  var place = '';
  if(placeSec){
    var pb = placeSec.body.join(' ').trim();
    if(pb){
      var pm = findPlace(pb);
      place = pm ? pm.place : cleanPlace(pb);
    }
  }

  var peopleText = peopleSec ? peopleSec.body.join(' ') : '';
  var leaders = peopleText ? findLeaders(peopleText, cfg) : findLeaders(norm, cfg);
  // 时间行、地点行里可能也直接写了领导/称谓（如「请崔局参加」）
  if(!leaders.length) leaders = findLeaders(norm, cfg);

  var note = '';
  if(contentSec && contentSec.body.length) note = contentSec.body.join('；').trim();

  // 用「时间+地点+标题+正文」整体判断会议类型
  var type = classifyType([title, timeBody, place, peopleText].join(' '), cfg);

  return [{
    date: d.date,
    start: t ? t.start : '',
    place: place,
    title: title || '未命名会议',
    type: type,
    leaders: leaders,
    note: note,
    raw: norm
  }];
}

function parseText(text, cfg){
  var norm = normalizeText(text);
  // 优先按结构化公文通知解析；识别不出分节结构时再退回逐行解析
  var notice = parseNotice(text, cfg);
  if(notice && notice.length) return notice;
  var out = [];
  splitChunks(norm).forEach(function(c){
    var r = parseChunk(c, cfg);
    if(r) out.push(r);
  });
  return out;
}
/*PARSER-END*/

// 留着它会把「改过时间/地点的会」永久挡在门外（看起来就是云同步不动）。
// 升级后一次性作废这些无法判断的旧标记，之后写入的都带完整信息。
function migrateOldMarks(){
  if(state.marksMigrated) return 0;
  state.marksMigrated = 1;
  var n = 0;
  Object.keys(state.marks || {}).forEach(function(k){
    var mk = state.marks[k];
    if(mk && mk.title) return;
    delete state.marks[k]; n++;
  });
  if(n){
    console.info('[同步] 作废 ' + n + ' 条无法判断的旧格位记忆（升级一次性处理）');
    saveState(true);
  }
  return n;
}

// 判断一段文字是不是「调出 / 借调 / 休假」这类状态标记（不是会议）
function personnelStatusOf(raw){
  var t = String(raw || '');
  if(!t.trim()) return null;
  var seg = t.split(/[\n]/)[0].split(/[，,；;。]/)[0];
  seg = seg.replace(/[\s\u3000]/g, '')
           .replace(/^[·•\-–—\d０-９.、]+/, '')
           .replace(/[：:、]+$/, '');
  // 「（调出）」整段被括号包着 → 取括号里的内容；「调出（不再统计）」→ 去掉括号说明
  var wrap = seg.match(/^[（(]([^）)]{1,30})[）)]$/);
  if(wrap) seg = wrap[1].trim();
  else seg = seg.replace(/[（(][^）)]{0,30}[）)]/g, '');
  if(!seg) return null;
  if(STATUS_EXACT_RE.test(seg)) return seg.replace(/^(?:已|自.{0,8}起)/, '');
  var m = seg.match(STATUS_SUFFIX_RE);
  if(m){
    var nm = m[1];
    // 前缀得像个名字，不能是会议词（防止「工作会议调出」这类被误判）
    if(/^[\u4e00-\u9fa5]{2,4}$/.test(nm) && !/会议|上午|下午|召开|关于|工作|安排|通知|研究|部署/.test(nm)) return m[2];
  }
  return null;
}
// 整格都是状态词才算「状态格」（多行里夹一条会议，那这条会议要保留）
function cellStatusOf(raw){
  var segs = cellSegments(raw).map(function(s){
    return String(s).replace(/^[\s·•\-–—\d.、]+/, '').trim();
  }).filter(Boolean);
  if(!segs.length) return null;
  var st = null;
  for(var i = 0; i < segs.length; i++){
    var x = personnelStatusOf(segs[i]);
    if(!x) return null;
    st = x;
  }
  return st;
}
function inactiveOf(name){
  var list = state.inactive || [];
  for(var i = 0; i < list.length; i++){ if(list[i].name === name) return list[i]; }
  return null;
}
// 该领导在这个日期是否已经不算本单位的人（无日期按已离岗处理）
function isInactiveOn(name, dateISO){
  var x = inactiveOf(name);
  if(!x) return false;
  if(!x.since || !dateISO) return true;
  return String(dateISO).slice(0, 10) >= String(x.since).slice(0, 10);
}

var TRAIN_EXACT_RE = new RegExp('^' + TRAIN_PRE + TRAIN_CORE + '(?:班)?(?:期间|中|期)?$');
var TRAIN_WITH_NAME_RE = new RegExp('^([\\u4e00-\\u9fa5]{2,4})' + TRAIN_PRE + TRAIN_CORE + '(?:班)?$');

function trainingMarkerOf(raw){

  if(!t.trim()) return null;
  // 先把「（9月14日-9月18日）」这类日期区间摘出来，剩下的再判断是不是培训

  var seg = t.split(/\n/)[0].split(/[，,；;。]/)[0];
  seg = seg.replace(/[\s\u3000]/g, '').replace(/^[·•\-–—\d０-９.、]+/, '').replace(/[：:、]+$/, '');
  var wrap = seg.match(/^[（(]([^）)]{1,30})[）)]$/);
  if(wrap) seg = wrap[1].trim();
  else seg = seg.replace(/[（(][^）)]{0,40}[）)]/g, '');
  seg = seg.replace(/^(?:已|自.{0,10}起)/, '');
  if(TRAIN_EXACT_RE.test(seg)) return { label: seg, range: rangeRaw };
  var m = seg.match(TRAIN_WITH_NAME_RE);
  if(m && !/会议|上午|下午|召开|关于|工作|安排|通知|研究|部署/.test(m[1])) return { label: seg, range: rangeRaw };
  return null;
}
// 「9月14日-9月18日」「10.8-10.12」「9月14日至18日」→ [fromISO, toISO]
function parseRangeText(txt, baseISO){
  var s = String(txt || '');
  var y = (String(baseISO || '').slice(0, 4)) || String(new Date().getFullYear());
  var m = s.match(/(\d{1,2})\s*[月.\/]\s*(\d{1,2})\s*[日号]?\s*[-–—~至到]\s*(?:(\d{1,2})\s*[月.\/]\s*)?(\d{1,2})\s*[日号]?/);
  if(!m) return null;
  var m1 = +m[1], d1 = +m[2], m2 = m[3] ? +m[3] : m1, d2 = +m[4];
  if(!(m1 >= 1 && m1 <= 12 && m2 >= 1 && m2 <= 12 && d1 >= 1 && d1 <= 31 && d2 >= 1 && d2 <= 31)) return null;
  var from = y + '-' + pad2(m1) + '-' + pad2(d1);
  var toY = (m2 < m1) ? String(+y + 1) : y;
  var to = toY + '-' + pad2(m2) + '-' + pad2(d2);
  if(to < from) return null;
  return [from, to];
}
function trainingDaysOf(t){
  var a = parseISO(t.from), b = parseISO(t.to || t.from);
  if(!a || !b || b < a) return 1;
  return Math.round((b - a) / 86400000) + 1;
}
function trainingKey(t){
  return [t.leader, t.from, t.to || t.from, t.title].join('|');
}
// 覆盖某一天的培训
function trainingsOn(dateISO){
  return (state.trainings || []).filter(function(t){
    var to = t.to || t.from;
    return dateISO >= t.from && dateISO <= to;
  });
}
function trainingsInMonth(monthKey){
  return (state.trainings || []).filter(function(t){
    var to = t.to || t.from;
    return (t.from.slice(0, 7) === monthKey) || (to.slice(0, 7) === monthKey) || (t.from.slice(0, 7) < monthKey && to.slice(0, 7) > monthKey);
  });
}
// 与指定区间有交集的培训记录
function trainingsInRange(fromISO, toISO_){
  return (state.trainings || []).filter(function(t){
    var b = t.to || t.from;
    return !(b < fromISO || t.from > toISO_);
  }).sort(function(a, b){ return a.from < b.from ? -1 : (a.from > b.from ? 1 : 0); });
}
// 与「本周/本月」区间有交集的培训天数
function trainDaysInRange(fromISO, toISO){
  var out = {};
  (state.trainings || []).forEach(function(t){
    var a = t.from, b = t.to || t.from;
    if(b < fromISO || a > toISO) return;
    var s = a > fromISO ? a : fromISO, e = b < toISO ? b : toISO;
    var nd = trainingDaysOf({ from: s, to: e });
    out[t.leader] = (out[t.leader] || 0) + nd;
  });
  return out;
}
function addTraining(t){
  state.trainings = state.trainings || [];
  var rec = {
    id: t.id || uid('tn_'),
    leader: String(t.leader || '').trim(),
    from: String(t.from || '').slice(0, 10),
    to: String(t.to || t.from || '').slice(0, 10),
    title: String(t.title || '外出培训').trim() || '外出培训',
    place: String(t.place || '').trim(),
    note: String(t.note || '').trim(),
    source: t.source || 'manual',
    auto: !!t.auto,                 // true = 从云文档标记自动收的（用户改过就清掉）
    createdAt: t.createdAt || new Date().toISOString()
  };
  if(!rec.leader || !rec.from) return null;
  if(rec.to < rec.from) rec.to = rec.from;
  var dup = state.trainings.some(function(x){ return trainingKey(x) === trainingKey(rec); });
  if(dup) return null;
  state.trainings.push(rec);
  return rec;
}
// 这条培训是「从云文档标记自动收的」还是「用户自己定的」？
// 老版本收进来的记录只有 source==='doc'、没有 auto 字段，一并按自动处理，
// 否则用户机器上那两条孤立单日记录会被当成人手填的，永远并不到一起。
function isAutoTraining(t){
  if(!t) return false;
  if(t.auto) return true;
  return t.source === 'doc' && !t.editedAt;
}
// 两天相差几天（同天=0）
function daysBetweenISO(aISO, bISO){
  var a = parseISO(aISO), b = parseISO(bISO);
  if(!a || !b) return 1e9;
  return Math.round((b - a) / 86400000);
}
function spanOf(t){ return { from: t.from, to: t.to || t.from }; }
function overlaps(a, b){
  var x = spanOf(a), y = spanOf(b);
  return !(x.to < y.from || x.from > y.to);
}
// 云文档里「外出培训」这类占位常常只标在首末两天，甚至零星几天。
// 同一领导、同一培训名称的标记，间隔不超过 45 天的算同一段连续培训，
// 否则「9月14日到10月16日」会被读成孤立的两天（正是用户报的那个错）。
function mergeTrainingMarks(marks){
  var groups = {};
  (marks || []).forEach(function(m){
    if(!m || !m.leader || !m.from) return;
    var gk = m.leader + '|' + normCellText(m.title || '外出培训');
    (groups[gk] = groups[gk] || []).push(m);
  });
  var out = [];
  Object.keys(groups).forEach(function(gk){
    var arr = groups[gk].slice().sort(function(a, b){ return a.from < b.from ? -1 : (a.from > b.from ? 1 : 0); });
    var cluster = [arr[0]];
    function flush(){
      var first = cluster[0], last = cluster[cluster.length - 1];
      var from = first.from;
      var to = last.to && last.to > last.from ? last.to : last.from;
      if(cluster.length === 1 && first.to && first.to > first.from) to = first.to;
      out.push({
        leader: first.leader, from: from, to: to,
        title: first.title || '外出培训', place: first.place || '', note: '',
        source: 'doc', auto: true
      });
      cluster = [];
    }
    for(var i = 1; i < arr.length; i++){
      var prev = cluster[cluster.length - 1];
      var prevEnd = prev.to && prev.to > prev.from ? prev.to : prev.from;
      if(daysBetweenISO(prevEnd, arr[i].from) <= 45) cluster.push(arr[i]);
      else { flush(); cluster = [arr[i]]; }
    }
    if(cluster.length) flush();
  });
  return out;
}
// 从云文档快照里自动收录培训格（如「外出培训」），避免当成会议
function cellsToTrainings(snap){
  var out = [];
  Object.keys((snap && snap.cells) || {}).forEach(function(k){
    var i = k.indexOf('|');
    if(i < 0) return;
    var date = k.slice(0, i), leader = k.slice(i + 1);
    if(isInactiveOn(leader, date)) return;
    cellSegments(snap.cells[k]).forEach(function(line){
      var s = String(line).replace(/^[\s·•\-–—\d.、]+/, '').trim();
      if(!s) return;
      var mk = trainingMarkerOf(s);
      if(!mk) return;
      var rg = mk.range ? parseRangeText(mk.range, date) : null;
      out.push({
        leader: leader, from: rg ? rg[0] : date, to: rg ? rg[1] : date,
        title: mk.label.replace(/[（(][^）)]*[）)]/g, '') || '外出培训',
        place: '', note: '', source: 'doc'
      });
    });
  });
  return out;
}
// 把云文档里的培训标记并进本地培训表：
//   · 用户自己登记/改过的记录不被覆盖（包括「改窄了区间」这种手工修正）
//   · 以前自动收进来的零散单日记录，收成一段连续培训
//   · 用户删掉的培训不再自动长回来（墓碑 state.trainGone）
function importTrainingsFromSnapshot(){
  var snap = state.docSnapshot;
  if(!snap || !snap.cells) return 0;
  var want = mergeTrainingMarks(cellsToTrainings(snap));
  if(!want.length) return 0;
  state.trainGone = state.trainGone || {};
  var changed = 0;
  want.forEach(function(w){
    if(state.trainGone[trainingKey(w)] || trainingGoneHit(w)) return;
    var same = (state.trainings || []).filter(function(t){
      return t.leader === w.leader && normCellText(t.title || '外出培训') === normCellText(w.title || '外出培训');
    });
    // ① 用户自己登记或改过的与这段有交集 → 以用户的为准，一步都不动
    if(same.some(function(t){ return !isAutoTraining(t) && overlaps(t, w); })) return;
    // ② 以前自动收的零散记录 → 收成一段（顺带清掉多余的单日记录）
    var autos = same.filter(function(t){ return isAutoTraining(t) && overlaps(t, w); });
    if(autos.length){
      autos.sort(function(a, b){ return a.from < b.from ? -1 : (a.from > b.from ? 1 : 0); });
      var keep = autos[0];
      if(keep.from !== w.from || (keep.to || keep.from) !== w.to){
        keep.from = w.from; keep.to = w.to;
        if(!keep.title) keep.title = w.title;
        changed++;
      }
      autos.slice(1).forEach(function(t){
        state.trainings = state.trainings.filter(function(x){ return x.id !== t.id; });
        changed++;
      });
      return;
    }
    if(addTraining(w)) changed++;
  });
  if(changed) saveState();
  return changed;
}
// 记一条「这条培训已被用户删掉/改掉」的墓碑：云文档里那几处「外出培训」标记还在，
// 不记的话下次读回又把它长回来（用户改窄了区间也会被重新撑回去）。
function markTrainingGone(t){
  if(!t || !t.leader || !t.from) return;
  state.trainGone = state.trainGone || {};
  state.trainGone[trainingKey(t)] = new Date().toISOString();
  var keys = Object.keys(state.trainGone);
  if(keys.length > 400){
    keys.sort(function(a, b){ return state.trainGone[a] < state.trainGone[b] ? -1 : 1; });
    keys.slice(0, keys.length - 400).forEach(function(x){ delete state.trainGone[x]; });
  }
}
// 这段培训是否落在某个墓碑上（有交集就算：用户改窄过区间，按原来的首末去比也对不上）
function trainingGoneHit(w){
  var gone = state.trainGone || {};
  var keys = Object.keys(gone);
  for(var i = 0; i < keys.length; i++){
    var p = keys[i].split('|');
    if(p.length < 4) continue;
    if(p[0] !== w.leader) continue;
    var from = p[1], to = p[2], title = p.slice(3).join('|');
    if(normCellText(title || '') !== normCellText(w.title || '外出培训')) continue;
    var wTo = w.to || w.from;
    if(!(to < w.from || from > wTo)) return true;
  }
  return false;
}
// 兜底清理：以前把「调出」当会议导进来的记录清掉；把「外出培训」转成培训占位（幂等）
function cleanupStatusEvents(){
  var gone = [], moved = 0;
  state.events = state.events.filter(function(e){
    if(personnelStatusOf(e.title)){ gone.push(e); return false; }
    if(trainingMarkerOf(e.title)){
      (e.leaders || []).forEach(function(l){
        if(addTraining({ leader: l.name || l, from: e.date, to: e.date, title: e.title, place: e.place, source: 'doc' })) moved++;
      });
      gone.push(e);
      return false;
    }
    return true;
  });
  if(gone.length){
    console.warn('已清理被误当成会议的「人事状态 / 外出培训」记录 ' + gone.length + ' 条：',
      gone.map(function(e){ return e.date + ' ' + e.title; }).join('、'));
    if(moved) console.log('其中 ' + moved + ' 条已转为「外出培训」占位');
    saveState();
  }
  return gone.length;
}

// 老数据补词：默认分工词表更新后，给已存在的领导补上新增关键词（用户自己加的词不会被删除）
var KW_PATCH_KEY = 'ytzj_kw_patch_v2';
var KW_PATCH = { '崔三': ['维稳','安保维稳'] };
function patchLeaderKeywords(){
  var done = null;
  try{ done = localStorage.getItem(KW_PATCH_KEY); }catch(e){ return; }
  if(done) return;
  Object.keys(KW_PATCH).forEach(function(name){
    var L = state.leaders.find(function(x){ return x.name === name; });
    if(!L) return;
    L.keywords = L.keywords || [];
    KW_PATCH[name].forEach(function(k){ if(L.keywords.indexOf(k) < 0) L.keywords.push(k); });
  });
  try{ localStorage.setItem(KW_PATCH_KEY, '1'); }catch(e){}
}
// 老数据补齐：已调出的人也要留在名册里（否则统计里没有职务，还认不出「姜局」这种叫法）
function ensureRoster(){
  state.inactive = state.inactive || [];
  state.inactive.forEach(function(x){
    if(!x || !x.name) return;
    var L = state.leaders.find(function(l){ return l.name === x.name; });
    var base = DEFAULT_LEADERS.find(function(l){ return l.name === x.name; });
    if(!L){
      if(base){
        var copy = JSON.parse(JSON.stringify(base));
        copy.left = true;
        state.leaders.push(copy);
      }
      return;
    }
    if(!L.title && base && base.title) L.title = base.title;
    if(!x.title && L.title) x.title = L.title;   // 调出记录里也存一份，删名册也不会丢
  });
}
function saveState(noPush){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      events: state.events, trash: state.trash, leaders: state.leaders,
      keywords: state.keywords, theme: state.theme,

      statsOpen: state.statsOpen !== false,

      statsWeek: state.statsWeek,
