    }));
  }catch(e){ toast('本地保存失败：' + e.message); }
  // 数据一有改动就排队自动写入云文档（实时同步；未连服务时为空操作）
  if(!noPush && typeof rtSchedulePush === 'function'){ rtSchedulePush(); rtScheduleState(); }
}

/* ================= 日期工具 ================= */
function parseISO(s){
  if(!s) return null;
  var m = String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(!m) return null;
  var d = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d.getTime()) ? null : d;
}
function toISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDays(d,n){ var t = new Date(d); t.setDate(t.getDate()+n); return t; }
function startOfWeek(d){
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var wd = (t.getDay()+6)%7;
  t.setDate(t.getDate()-wd);
  return t;
}
function todayISO(){ return toISO(new Date()); }
function startOfDay(d){
  if(!d) return null;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
// 姓 + 称谓：本局规则——任何局领导一律称呼为「X局」，贺八主任除外
// 「谷六/党组成员、副局长」→「谷局」；「贺八/市住房保障中心主任」→「贺主任」
function honorificOf(name, title){
  name = String(name||'').trim();
  title = String(title||'');
  var surname = name.charAt(0);
  if(!surname) return name;
  if(name === '贺八') return surname + '主任';
  return surname + '局';
}
function minutesOf(hhmm){
  if(!hhmm) return null;
  var p = hhmm.split(':').map(Number);
  return p[0]*60 + (p[1]||0);
}
var WD_CN = ['周一','周二','周三','周四','樊五','周六','周日'];
var WD_FULL = ['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];

/* ================= DOM ================= */
var $ = function(id){ return document.getElementById(id); };

/* ---------- 渲染周视图 ---------- */
function renderWeek(){
  if(!viewWeekStart || isNaN(viewWeekStart.getTime())) viewWeekStart = startOfWeek(new Date());
  var ws = viewWeekStart;
  var days = [];
  for(var i=0;i<7;i++) days.push(addDays(ws,i));

  $('rangeLabel').textContent =
    ws.getFullYear()+'年'+(ws.getMonth()+1)+'月'+ws.getDate()+'日 — '+
    (days[6].getMonth()+1)+'月'+days[6].getDate()+'日';

  var byDate = {};
  state.events.forEach(function(e){
    (byDate[e.date] = byDate[e.date] || []).push(e);
  });

  var conflicts = computeConflicts();
  var html = '';
  days.forEach(function(d, i){
    var iso = toISO(d);
    var list = (byDate[iso]||[]).slice().sort(function(a,b){
      return (minutesOf(a.start)===null?1e9:minutesOf(a.start)) - (minutesOf(b.start)===null?1e9:minutesOf(b.start));
    });
    var isToday = iso === todayISO();
    var cls = 'daycol' + (isToday?' today':'') + ((i>=5)?' weekend':'');
    html += '<div class="'+cls+'">';
    html += '<div class="dayhead"><span class="wd">'+WD_CN[i]+'</span><span class="dt">'+(d.getMonth()+1)+'/'+d.getDate()+'</span>';
    html += '<span class="n">'+(list.length?list.length+' 场':'')+'</span></div>';
    html += trainingBannerHTML(iso, list);

    var am = [], pm = [];
    list.forEach(function(e){ (slotOf(e)==='am'?am:pm).push(e); });
    html += slotHTML('上午', am, conflicts);
    html += slotHTML('下午', pm, conflicts);
    html += '</div>';
  });
  $('week').innerHTML = html;

  // 绑定点击
  Array.prototype.forEach.call(document.querySelectorAll('.ev'), function(el){
    el.addEventListener('click', function(){ openEventModal(el.getAttribute('data-id')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.trn'), function(el){
    el.addEventListener('click', function(){ openTrainings(el.getAttribute('data-tid')); });
  });

  renderAlert(conflicts);
  renderSummary(byDate, days);
  renderNextWeek();
  renderStats();
  updateSyncBadge();
}

function slotOf(e){
  var m = minutesOf(e.start);
  return (m===null || m < 12*60) ? 'am' : 'pm';
}

/* 日历里的「外出培训」占位条：这几天该领导不在岗，避免再安排会议 */
function trainingBannerHTML(iso, dayEvents){
  var ts = trainingsOn(iso);
  if(!ts.length) return '';
  return ts.map(function(t){
    var multi = !!(t.to && t.to !== t.from);
    var total = multi ? trainingDaysOf(t) : 0;
    var idx = multi ? trainingDaysOf({ from: t.from, to: iso }) : 0;
    var when = multi ? '第 ' + idx + '/' + total + ' 天' : '全天';
    var clash = (dayEvents || []).filter(function(e){
      return (e.leaders || []).some(function(l){ return (l.name || l) === t.leader; });
    });
    var typeTxt = /培训|学习|进修/.test(t.title || '') ? '' : '<span style="opacity:.75;font-weight:400">外出培训</span>';
    return '<div class="trn" data-tid="'+esc(t.id)+'" title="点击编辑这条培训记录">'+
      '<div class="trn-top"><span>🎓</span><span class="who">'+esc(t.leader)+'</span>'+
        typeTxt+
        '<span class="when">'+when+'</span></div>'+
      '<div class="trn-ttl">'+esc(t.title || '外出培训')+(t.place ? ' · '+esc(t.place) : '')+'</div>'+
      (clash.length ? '<div class="trn-conf">⚠ 这天还安排了 '+clash.length+' 场会给他</div>' : '')+
    '</div>';
  }).join('');
}

function slotHTML(label, arr, conflicts){
  var inner = arr.length
    ? arr.map(function(e){ return cardHTML(e, conflicts); }).join('')
    : '<div class="slot-empty">—</div>';
  return '<div class="slot"><div class="slot-label">'+label+'</div><div class="slot-body">'+inner+'</div></div>';
}

/* ---------- 右侧：领导分工速查 + 报送名单 ---------- */
function leaderCardHTML(L){
  var kw = (L.keywords||[]).slice(0,4).join('、');
  var more = (L.keywords||[]).length > 4 ? ' 等' : '';

}

function getWeekEvents(){
  var days = [];
  for(var i=0;i<7;i++) days.push(toISO(addDays(viewWeekStart,i)));
  return state.events.filter(function(e){ return days.indexOf(e.date) >= 0; })
    .sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?-1:1;
      return (minutesOf(a.start)===null?1e9:minutesOf(a.start)) - (minutesOf(b.start)===null?1e9:minutesOf(b.start));
    });
}

/* ---------- 下周会议预告 ---------- */
function nextWeekRange(){
  return addDays(viewWeekStart || startOfWeek(new Date()), 7);
}
function nextWeekEvents(){
  var ws = nextWeekRange(), days = [];
  for(var i=0;i<7;i++) days.push(toISO(addDays(ws,i)));
  return state.events.filter(function(e){ return days.indexOf(e.date) >= 0; })
    .sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?-1:1;
      var am = minutesOf(a.start)===null?1e9:minutesOf(a.start);
      var bm = minutesOf(b.start)===null?1e9:minutesOf(b.start);
      return am-bm;
    });
}
function renderNextWeek(){

/* ---------- 统计口径：本周 / 本月（两边都能左右翻，互不影响日历） ---------- */
function statsMonthKey(){
  if(state.statsMonth) return state.statsMonth;
  var d = viewWeekStart || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}
// 「基准周」= 日历当前所在周；没手动翻周时统计就跟着它
function statsBaseWeekStart(){
  return startOfWeek(viewWeekStart || new Date());
}
function statsWeekStart(){
  var s = state.statsWeek;
  if(s){
    var d = parseISO(s);
    if(d && !isNaN(d.getTime())) return startOfWeek(d);
  }
  return statsBaseWeekStart();
}
// 导航条上的短标签：10.19—10.25（跨年才写年份）
function statsWeekShort(ws){
  var a = ws, b = addDays(ws, 6);
  function f(d, withY){ return (withY ? d.getFullYear() + '.' : '') + (d.getMonth() + 1) + '.' + d.getDate(); }
  var crossYear = a.getFullYear() !== b.getFullYear();
  return f(a, crossYear) + '—' + f(b, crossYear);
}
// 副标题里的完整区间：10月19日—10月25日
function statsWeekFull(ws){
  var a = ws, b = addDays(ws, 6);
  function f(d){ return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  var head = (a.getFullYear() !== b.getFullYear()) ? (a.getFullYear() + '年') : '';
  return head + f(a) + '—' + f(b);
}
function statsRange(){
  if(state.statsScope === 'month'){
    var mk = statsMonthKey();
    var y = +mk.slice(0, 4), m = +mk.slice(5, 7);
    var last = new Date(y, m, 0).getDate();
    var bd = viewWeekStart || new Date();
    return { from: mk + '-01', to: mk + '-' + pad2(last), monthKey: mk, month: m,
             label: y + '年' + m + '月', short: y + '年' + m + '月',
             base: mk === (bd.getFullYear() + '-' + pad2(bd.getMonth() + 1)) };
  }
  var ws = statsWeekStart();
  return { from: toISO(ws), to: toISO(addDays(ws, 6)), ws: ws,
           label: statsWeekFull(ws), short: statsWeekShort(ws),
           base: ws.getTime() === statsBaseWeekStart().getTime() };
}
function eventsInRange(from, to){
  return state.events.filter(function(e){ return e.date >= from && e.date <= to; })
    .sort(function(a, b){
      if(a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (minutesOf(a.start) === null ? 1e9 : minutesOf(a.start)) - (minutesOf(b.start) === null ? 1e9 : minutesOf(b.start));
    });
}
function attendeeStats(){
  var r = statsRange();
  var evs = eventsInRange(r.from, r.to);
  var count = {}, names = [], byName = {}, afterOut = {};
  evs.forEach(function(e){
    (e.leaders||[]).forEach(function(l){
      var nm = (typeof l === 'string') ? l : l.name;
      if(!nm) return;
      // 已调出的领导：调出生效「之前」的会议照常计入（他当时还在本单位），
      // 生效日（含）之后才不计入——历史记录不能因为这个标记被一笔抹掉。
      if(isInactiveOn(nm, e.date)){ afterOut[nm] = (afterOut[nm] || 0) + 1; return; }
      if(count[nm] === undefined){ count[nm] = 0; names.push(nm); }
      count[nm]++;
      (byName[nm] = byName[nm] || []).push(e);
    });
  });
  names.sort(function(a,b){ return count[b]-count[a]; });
  return { events: evs, count: count, names: names, byName: byName, afterOut: afterOut,
           trainDays: trainDaysInRange(r.from, r.to), range: r };
}
// 领导职务：名册里有就用名册，已调出的人在名册里没有时回落到调出记录上的职务
function leaderTitleOf(name){
  var L = (state.leaders || []).find(function(x){ return x.name === name; });
  if(L && L.title) return L.title;
  var x = inactiveOf(name);
  if(x && x.title) return x.title;
  return L ? '' : '（未登记职务）';
}

function renderStats(){
  var body = $('fpBody');
  if(!body) return;
  var s = attendeeStats();
  var r = s.range, isMonth = (state.statsScope === 'month');
  var tdays = s.trainDays || {};
  var total = s.names.reduce(function(a,n){ return a + s.count[n]; }, 0);

  var cur = !!r.base;                                  // 是不是「当前这一周 / 月」
  var scopeCn = isMonth ? (cur ? '本月' : '该月') : (cur ? '本周' : '该周');
  $('fpTitle').textContent = scopeCn + '领导参会统计';
  // 周视图的区间交给上面那行导航显示，副标题只留场次人数，免得挤成两行
  $('fpSub').textContent = (isMonth ? r.label + ' · ' : '') + s.events.length + ' 场会议 · ' + s.names.length + ' 人';
  Array.prototype.forEach.call(document.querySelectorAll('#fpScope button'), function(b){
    b.classList.toggle('on', b.getAttribute('data-scope') === (isMonth ? 'month' : 'week'));
  });
  var nav = $('fpMonthNav');
  if(nav) nav.hidden = false;                          // 周和月都要能左右翻
  var lbl = $('fpMonthLabel');
  if(lbl){
    lbl.textContent = r.short;

  }
  var pv = $('fpMonthPrev'), nx = $('fpMonthNext');
  if(pv) pv.title = isMonth ? '上个月' : '上一周';
  if(nx) nx.title = isMonth ? '下个月' : '下一周';

  var h = '';
  if(!s.names.length){
    h = '<div class="fp-empty">' + scopeCn + '还没有登记参会领导。'+
        (s.events.length ? '<br>给会议补上参会领导后，这里会自动统计。' : '<br>先粘贴会议文本并导入。')+'</div>';
  }else{
    var max = Math.max.apply(null, s.names.map(function(n){ return s.count[n]; }))
              || Math.max.apply(null, s.names.map(function(n){ return tdays[n] || 0; })) || 1;
    s.names.forEach(function(n, i){
      var pct = Math.round(s.count[n]/max*100);
      var off = inactiveOf(n);
      h += '<div class="rank" data-name="'+esc(n)+'" title="点击查看具体会议">'+
        '<span class="idx">'+(i+1)+'</span>'+
        '<b>'+esc(n)+'</b>'+
        '<span class="role">'+esc(leaderTitleOf(n))+'</span>'+
        (off ? '<span class="off-tag" title="已调出，统计的是调出前的会议">调出</span>' : '')+
        '<span class="cnt">'+s.count[n]+' 场'+(tdays[n] ? ' <span class="tag-trn">训 '+tdays[n]+' 天</span>' : '')+'</span>'+
        '<span class="more">›</span>'+
      '</div>';
      h += '<div class="rank-bar" data-bar="'+esc(n)+'"><div style="width:'+pct+'%"></div></div>';
    });
    h += '<div class="fp-total">合计 '+total+' 人次参会</div>';
  }

  // 只在培训、没有会议的领导也点出来，免得以为漏了人
  // （已调出的不再单列：人已不在本单位，调出后的周期列他的培训没有意义）
  var tOnly = Object.keys(tdays).filter(function(n){
    if(s.names.indexOf(n) >= 0) return false;
    return !inactiveOf(n);
  });
  if(tOnly.length){
    h += '<div class="fp-out">培训中：' + tOnly.map(function(n){
      return esc(n) + ' ' + tdays[n] + ' 天';
    }).join('、') + '</div>';
  }
  // 已调出的领导：只在「这个周期里确实有他调出前的会议」时才点一句，
  // 让历史周期能解释「这个人为什么还在名单里」。
  // 调出之后的周期（本周期一场都没有）不再出现——留一行「无记录」只是噪音。
  var offNames = (state.inactive || []).map(function(x){ return x.name; });
  Object.keys(s.afterOut || {}).forEach(function(n){ if(offNames.indexOf(n) < 0) offNames.push(n); });
  offNames = offNames.filter(function(n){ return (s.count[n] || 0) > 0; });
  if(offNames.length){
    h += '<div class="fp-out">' + offNames.map(function(n){
      var x = inactiveOf(n) || {}, c = s.count[n] || 0, a = s.afterOut[n] || 0;
      var since = x.since ? '（' + esc(x.since) + ' 起调出）' : '（已调出）';
      var seg = esc(n) + since + '，调出前 ' + c + ' 场已计入';
      if(a) seg += '；调出后 ' + a + ' 场不再计入';
      return seg;
    }).join('<br>') + '</div>';
  }
  body.innerHTML = h;

  Array.prototype.forEach.call(body.querySelectorAll('.rank'), function(el){
    el.addEventListener('click', function(){
      toggleFpPop(el, el.getAttribute('data-name'), s);
    });
  });

  var copyWeek = $('btnCopyWeek'), copyAtt = $('btnCopyAttendees');
  if(copyWeek){
    copyWeek.textContent = '复制' + scopeCn + '参会名单';
    copyWeek.onclick = function(){
      copyText(isMonth ? rangeListText(s.events, r.from, r.to, scopeCn)
                       : weekListText(s.events, r.ws, { label: scopeCn }));
    };
  }
  if(copyAtt) copyAtt.onclick = function(){
    if(!s.names.length){ toast(scopeCn + '还没有参会领导'); return; }
    copyText(s.names.map(function(n){
      var L = state.leaders.find(function(x){ return x.name===n; });
      return n + '（' + (L?L.title:'') + '）';
    }).join('、'));
  };
}

/* ---------- 参会明细悬浮层 ---------- */
var fpPopFor = null, fpPopBound = false;
function closeFpPop(){
  var p = $('fpPop');
  if(!p) return;
  p.hidden = true;
  fpPopFor = null;
  Array.prototype.forEach.call(document.querySelectorAll('#fpBody .rank.on'), function(x){ x.classList.remove('on'); });
}
function positionFpPop(pop, el){
  var r = el.getBoundingClientRect();
  var w = pop.offsetWidth, h = pop.offsetHeight, W = window.innerWidth, H = window.innerHeight;
  var left = r.left - w - 10;                       // 默认浮在统计卡左侧（统计卡本身贴右边）
  if(left < 8) left = Math.min(r.right + 10, W - w - 8);
  var top = r.top - 4;
  if(top + h > H - 8) top = Math.max(8, H - h - 8);
  pop.style.left = Math.round(left) + 'px';
  pop.style.top = Math.round(top) + 'px';
}
function toggleFpPop(el, name, s){
  var pop = $('fpPop');
  if(!pop) return;
  if(fpPopFor === name && !pop.hidden){ closeFpPop(); return; }
  Array.prototype.forEach.call(document.querySelectorAll('#fpBody .rank.on'), function(x){ x.classList.remove('on'); });
  el.classList.add('on');
  fpPopFor = name;

  var evs = ((s && s.byName && s.byName[name]) || []).slice().sort(byDateStart);
  var h = '<div class="fpop-head">' + esc(name) + '<em>' + esc(leaderTitleOf(name)) + '</em>' +
          '<button id="fpPopCopy">复制</button></div>';
  if(!evs.length){
    h += '<div class="fpop-empty">这段时间没有他参会的记录<br>（调出之后的会议不再计入）</div>';
  }else{
    evs.forEach(function(e){
      var d = parseISO(e.date);
      h += '<div class="fpop-item">' +
        '<div class="d">' + esc(dateLabelCN(e.date)) + (d ? ' ' + WD_CN[(d.getDay()+6)%7] : '') +
          (e.start ? ' · ' + esc(slotWord(e)) + esc(hhmmText(e.start)) : '') + '</div>' +
        '<div class="t">' + esc(e.title) + '</div>' +
        (e.place ? '<div class="p">' + esc(e.place) + '</div>' : '') +
      '</div>';
    });
    h += '<div class="fp-total" style="padding:7px 11px">共 ' + evs.length + ' 场</div>';
  }
  pop.innerHTML = h;
  pop.hidden = false;
  positionFpPop(pop, el);

  var cp = $('fpPopCopy');
  if(cp) cp.onclick = function(ev){
    ev.stopPropagation();
    if(!evs.length){ toast('没有可复制的记录'); return; }
    copyText(evs.map(function(e){
      return dateLabelCN(e.date) + ' ' + (e.start || '') + ' ' + e.title + (e.place ? '（' + e.place + '）' : '');
    }).join('\n'));
  };

  if(!fpPopBound){
    fpPopBound = true;
    document.addEventListener('mousedown', function(ev){
      var p = $('fpPop');
      if(!p || p.hidden) return;
      if(p.contains(ev.target)) return;
      if(ev.target.closest && ev.target.closest('#fpBody .rank')) return;   // 点另一行由它自己接管
      closeFpPop();
    }, true);
    document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape') closeFpPop(); });
    window.addEventListener('resize', closeFpPop);
    window.addEventListener('resize', function(){ try{ syncWatchLayout(); }catch(e){} });
    var body = $('fpBody');
    if(body) body.addEventListener('scroll', function(){ if(fpPopFor) closeFpPop(); });
  }
}

function weekListText(weekEvents, ws, opts){
  return rangeListText(weekEvents, toISO(ws), toISO(addDays(ws, 6)), (opts && opts.label) || '本周');
}
function rangeListText(events, fromISO, toISO_, label){
  label = label || '本期间';
  var lines = [];
  var a = parseISO(fromISO), b = parseISO(toISO_);
  lines.push('【参会名单】'+a.getFullYear()+'年'+(a.getMonth()+1)+'月'+a.getDate()+'日—'+(b.getMonth()+1)+'月'+b.getDate()+'日');
  if(!events.length){
    lines.push(label+'暂无会议安排。');
  }
  var cur = '';
  events.forEach(function(e){
    if(e.date !== cur){
      cur = e.date;
      var d = parseISO(e.date);
      var wd = WD_CN[(d.getDay()+6)%7];
      lines.push('');
      lines.push((d.getMonth()+1)+'月'+d.getDate()+'日（'+wd+'）');
    }
    var head = '　' + (e.start || '时间待定') + (e.place ? '　' + e.place : '') + '　' + e.title;
    lines.push(head);
    var ls = (e.leaders||[]).map(function(l){ return l.name + (l.role ? '（'+l.role+'）' : ''); }).join('、');
    if(!ls){
      var sug = recommendLeaders((e.title||'')+' '+(e.note||''), {leaders: state.leaders});
      ls = sug ? ('待定（建议：'+sug.name+'）') : '待定';
    }
    lines.push('　　参会领导：' + ls);
  });
  // 外出培训单独一段，报送给领导时一眼能看到谁不在岗
  var trs = trainingsInRange(fromISO, toISO_);
  if(trs.length){
    lines.push('');
    lines.push('【外出培训】');
    trs.forEach(function(t){
      var x = parseISO(t.from), y = parseISO(t.to || t.from);
      var span = (x.getMonth()+1)+'月'+x.getDate()+'日' +
                 ((t.to && t.to !== t.from) ? '—'+(y.getMonth()+1)+'月'+y.getDate()+'日' : '');
      lines.push('　' + span + '　' + t.leader + '　' + (t.title || '外出培训') + (t.place ? '　' + t.place : ''));
    });
  }
  lines.push('');
  lines.push('填报单位：某市住房和城乡建设局');
  return lines.join('\n');
}

function copyText(t){
  var done = function(){ toast('已复制到剪贴板'); };
  var fallback = function(){
    var ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    ok ? done() : toast('复制失败，请手动选择文本');
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(done).catch(fallback);
  }else{
    fallback();
  }
}

  if(e.place) h += '<span class="ev-place" title="'+esc(e.place)+'">'+esc(e.place)+'</span>';
  var sc = syncStatusOf(e);
  if(sc){
    var sCls = 'pushed', sIco = '☁', sTip = '已生成同步包，尚未在云文档现状中确认';
    if(sc === 'doc'){
      sCls = 'doc'; sIco = '✓';
      sTip = '云文档中已登记该会议（'+snapTimeLabel(state.docSnapshot && state.docSnapshot.at)+' 比对）';
    }else if(sc === 'partial'){
      sIco = '◑'; sTip = '云文档里只登记了部分参会领导';
    }else if(sc === 'stale'){
      sCls = 'stale'; sIco = '⟳';
      sTip = '云文档里还是这场会的旧版本（时间或地点改过了），正在/等待写回';
    }else if(sc === 'gone'){
      sCls = 'gone'; sIco = '!';
      sTip = '云文档里已经删掉这场会，下次检查后会自动从日历移除（想保留请到「同步云文档」里恢复）';
    }
    h += '<span class="ev-sync '+sCls+'" title="'+esc(sTip)+'">'+sIco+'</span>';
  }
  h += '</div>';
  h += '<div class="ev-title">'+esc(e.title)+'</div>';
  if(leaders){
    h += '<div class="ev-leaders">'+esc(leaders)+'</div>';

  }
  if(e.note) h += '<div class="ev-note">'+esc(e.note)+'</div>';
  h += '</article>';
  return h;
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

/* ---------- 冲突检测 ---------- */
// 规则：
// ① 硬冲突——同一领导、同一天、同一开始时刻出现 ≥2 场会议，直接判冲突；
// ② 软冲突——同一领导、同一天、同一「上午/下午」内有 ≥2 场（时刻不同），
//    需交互判断：是否连开 + 前后场能否衔接。两者都是 → 不算冲突；否则 → 冲突。
// 软冲突的裁决结果保存在 state.conflictDecisions 里，避免每次刷新重复询问。
function slotKeyOf(start){
  // 与渲染口径一致：上午(<12:00) / 下午(≥12:00)；时刻未知返回 ''
  var m = minutesOf(start);
  if(m === null) return '';
  return m < 12*60 ? 'am' : 'pm';
}
function decisionKey(a, b, name){
  // 裁决 key 必须「跨设备一致」：事件 id 是每台设备各自生成的（手机上读回来的是另一批 id），
  // 用 id 拼 key，手机上永远找不到本机做过的裁决，于是照样弹同样的冲突提示。
  // 改用「领导 + 日期 + 两个开始时刻」，同一天同一上午/下午的两场会，在哪台设备上 key 都一样。
  var s1 = String(a.start || ''), s2 = String(b.start || '');
  if(s1 > s2){ var t = s1; s1 = s2; s2 = t; }
  return [name || '', a.date || b.date || '', s1, s2].join('|');
}
// 老版本按事件 id 拼的 key（只在本机有效），留着认旧数据
function legacyDecisionKey(a, b){
  return [a.id, b.id].sort().join('|');
}
// 取一条裁决（顺带把老的 id 型 key 迁成跨设备 key，迁完才能同步给手机）
function decisionOf(a, b, name){
  state.conflictDecisions = state.conflictDecisions || {};
  state.conflictDecidedAt = state.conflictDecidedAt || {};
  var dk = decisionKey(a, b, name);
  var v = state.conflictDecisions[dk];
  var at = state.conflictDecidedAt[dk];
  if(!v){
    var lk = legacyDecisionKey(a, b);
    if(state.conflictDecisions[lk]){
      v = state.conflictDecisions[lk];
      at = state.conflictDecidedAt[lk] || state.loadedAt || new Date(0).toISOString();
      state.conflictDecisions[dk] = v;
      state.conflictDecidedAt[dk] = at;
    }
  }
  if(!v) return null;
  return { key: dk, v: v, at: at || new Date(0).toISOString() };
}
// 记一条裁决（同时记时间戳，云同步靠它判断谁新）
function setDecision(key, dec){
  state.conflictDecisions = state.conflictDecisions || {};
  state.conflictDecidedAt = state.conflictDecidedAt || {};
  state.conflictDecisions[key] = dec;
  state.conflictDecidedAt[key] = new Date().toISOString();
}
// 某场会议的绝对时间戳(ms)；date 无效或 start 为空返回 null
function eventTimeMs(e){
  if(!e || !e.start) return null;
  var d = parseISO(e.date);
  if(!d) return null;
  var m = minutesOf(e.start);
  if(m === null) return null;
  return d.getTime() + m * 60000;
}
// 一组冲突(涉及多场会议)的最晚绝对时间：用于判断「时间是否已过」
function latestTimeMs(list){
  var t = null;
  list.forEach(function(e){
    var x = eventTimeMs(e);
    if(x !== null && (t === null || x > t)) t = x;
  });
  return t;
}
// 判断一条被忽视的冲突当前是否仍应保持「忽视」
// 返回 true=继续忽视(不提醒)，false=恢复提醒
function ignoreStillHolds(rec){
  if(!rec) return false;
  if(rec.shared) return true;      // 从云文档同步来的「别人已经点过忽视」，本机不用再问
  var latest = rec.latest;         // 该组冲突最晚会议时间(ms)
  if(latest === undefined || latest === null){
    // 没有时间信息（会议无 start），按「未过去」处理：仅当前会话忽视
    return rec.session === APP_SESSION;
  }
  var now = Date.now();
  if(latest < now) return true;    // 时间已过 → 永久忽视
  return rec.session === APP_SESSION; // 时间未到 → 仅本次会话忽视，下次进入再提醒
}
function computeConflicts(){
  var hardIds = {}, softIds = {};        // 最终标记冲突的事件 id
  var hardLines = [], softPairs = [];    // 硬冲突明细 + 软冲突待裁决配对
  var perLeader = {}, daySet = {};
  state.conflictDecisions = state.conflictDecisions || {};
  state.ignoredConflicts = state.ignoredConflicts || {};
  var ig = state.ignoredConflicts;

  var groups = {};
  state.events.forEach(function(e){
    if(!e.start) return;
    (e.leaders||[]).forEach(function(l){
      var key = l.name + '|' + e.date;
      (groups[key] = groups[key] || []).push(e);
    });
  });

  Object.keys(groups).forEach(function(k){
    var arr = groups[k];
    if(arr.length < 2) return;
    var name = k.split('|')[0];
    for(var i=0;i<arr.length;i++){
      for(var j=i+1;j<arr.length;j++){
        var a = arr[i], b = arr[j];
        var ma = minutesOf(a.start), mb = minutesOf(b.start);
        if(ma === null || mb === null) continue;

        // ① 同一时刻 → 硬冲突
        if(ma === mb){
          // 硬冲突 key：以「领导|日期|时刻」聚合，同一时刻多场只算一组，忽视一次全部消失
          var hkey = name + '|' + a.date + '|' + a.start;
          // 若该组已被忽视，跳过（不提醒、不标冲突）
          if(ig[hkey] && ignoreStillHolds(ig[hkey])) continue;
          hardIds[a.id] = 1; hardIds[b.id] = 1;
          (perLeader[name] = perLeader[name] || {})[a.id] = 1;
          perLeader[name][b.id] = 1;
          var line = name+' · '+a.date+' · '+a.start+'「'+a.title+'」与「'+b.title+'」同一时刻';
          if(!hardLines.some(function(x){ return x.key === hkey; })){
            hardLines.push({ key: hkey, text: line, idA: a.id, idB: b.id, hard: true, name: name, date: a.date, start: a.start });
          }
          continue;
        }

        // ② 同一上午/下午（时刻不同）→ 软冲突，需交互裁决
        var skA = slotKeyOf(a.start), skB = slotKeyOf(b.start);
        if(!skA || skA !== skB) continue;
        var dk = decisionKey(a, b, name);
        // 若该配对已被忽视，跳过（也认老版本按事件 id 拼的 key）
        var igHit = ig[dk] || ig[legacyDecisionKey(a, b)];
        if(igHit && ignoreStillHolds(igHit)) continue;
        var dec = decisionOf(a, b, name);   // {v,at} | null；跨设备 key，顺带迁移旧数据
        var decision = dec ? dec.v : null;  // 'ok' | 'conflict' | null
        // 按时刻排序，保证「前一场 / 后一场」顺序稳定
        var first = ma < mb ? a : b, second = ma < mb ? b : a;
        var pair = {
          key: dk,
          name: name, date: a.date,
          idA: first.id, idB: second.id,
          firstTitle: first.title, firstStart: first.start,
          secondTitle: second.title, secondStart: second.start,
          slot: skA,
          decision: decision || null,
          decidedAt: dec ? dec.at : null
        };
        // 去重
        if(!softPairs.some(function(x){ return x.key === dk; })) softPairs.push(pair);

        if(decision === 'conflict'){
          softIds[a.id] = 1; softIds[b.id] = 1;
          (perLeader[name] = perLeader[name] || {})[a.id] = 1;
          perLeader[name][b.id] = 1;
        }
        // decision === 'ok' 或未裁决 → 不记为冲突；未裁决的进入待确认列表
      }
    }
  });

  // 合并硬 + 软冲突的 id
  var ids = {};
  Object.keys(hardIds).forEach(function(id){ ids[id] = 1; });
  Object.keys(softIds).forEach(function(id){ ids[id] = 1; });
  Object.keys(ids).forEach(function(id){
    var e = state.events.find(function(x){ return x.id === id; });
    if(e) daySet[e.date] = 1;
  });

  var byLeader = Object.keys(perLeader).map(function(name){
    return { name: name, count: Object.keys(perLeader[name]).length };
  }).sort(function(a, b){ return b.count - a.count; });

  // 待确认的软冲突（未裁决）
  var pending = softPairs.filter(function(p){ return !p.decision; });

  return {
    ids: ids,
    hard: hardLines,          // 硬冲突明细（直接冲突）
    soft: softPairs,          // 所有软冲突配对（含已裁决）
    pending: pending,         // 待确认的软冲突
    byLeader: byLeader,
    eventCount: Object.keys(ids).length,
    leaderCount: byLeader.length,
    dayCount: Object.keys(daySet).length,
    pendingCount: pending.length
  };
}

// 忽视一组冲突：记录 key + 最晚会议时间 + 当前会话
// 会议时间未到 → 仅本次会话不提醒，下次进入再提醒；已过去 → 永久不再提醒
function ignoreConflict(key, eventIds){
  var events = (eventIds || []).map(function(id){
    return state.events.find(function(x){ return x.id === id; });
  }).filter(Boolean);
  var latest = latestTimeMs(events);
  state.ignoredConflicts = state.ignoredConflicts || {};
  state.ignoredConflicts[key] = { at: Date.now(), latest: latest, session: APP_SESSION };
  saveState();
}

function renderAlert(conflicts){
  var bar = $('alertBar');
  var hasHard = conflicts.hard.length > 0;
  var hasPending = conflicts.pending.length > 0;
  if(!hasHard && !hasPending){ bar.className = 'alertbar'; bar.innerHTML = ''; return; }
  bar.className = 'alertbar on';

  var chips = conflicts.byLeader.map(function(x){
    return '<span class="cf-chip">'+esc(x.name)+'<i>'+x.count+' 场</i></span>';
  }).join('');

  // 主标题：硬冲突优先，其次待确认软冲突
  var mainTxt, subTxt;
  if(hasHard){
    mainTxt = '⚠ '+conflicts.hard.length+' 组会议时间重叠';
    subTxt = '同一时刻撞会，需调整 · 涉及 '+conflicts.leaderCount+' 位领导';
  }else{
    mainTxt = '◐ '+conflicts.pendingCount+' 组会议需确认：连开/衔接 还是 冲突';
    subTxt = '同一上午/下午多场，请逐组判断';
  }

  var hardBlock = hasHard
    ? '<div class="cf-sec cf-sec-hard">时间重叠（直接冲突）</div>'+
      conflicts.hard.map(function(t){
        return '<div class="cf-item cf-hard">'+
          '<span class="cf-hard-text" data-a="'+esc(t.idA)+'" data-b="'+esc(t.idB)+'" title="点击跳转到日程">· '+esc(t.text)+'</span>'+
          '<button class="cf-ignore" data-key="'+esc(t.key)+'" data-ids="'+esc(t.idA+','+t.idB)+'">忽视</button>'+
        '</div>';
      }).join('')
    : '';

  var pendingBlock = hasPending
    ? '<div class="cf-sec">同一上午/下午多场，请判断：连开/衔接？还是冲突？</div>'+
      conflicts.pending.map(function(p){
        return '<div class="cf-item cf-pending" data-key="'+esc(p.key)+'">'+
          '<div class="cf-pair">'+
            '<span class="cf-who">'+esc(p.name)+'</span>'+
            '<span class="cf-date">'+esc(p.date)+' '+(p.slot==='am'?'上午':'下午')+'</span>'+
          '</div>'+
          '<div class="cf-pair-line">'+
            '<a class="cf-jump" data-a="'+esc(p.idA)+'">'+esc(p.firstStart)+'「'+esc(p.firstTitle)+'」</a>'+
            '<span class="cf-arrow">→</span>'+
            '<a class="cf-jump" data-a="'+esc(p.idB)+'">'+esc(p.secondStart)+'「'+esc(p.secondTitle)+'」</a>'+
          '</div>'+
          '<div class="cf-pair-actions">'+
            '<button class="cf-ok" data-key="'+esc(p.key)+'" data-dec="ok">连开/衔接</button>'+
            '<button class="cf-bad" data-key="'+esc(p.key)+'" data-dec="conflict">冲突</button>'+
            '<button class="cf-ignore" data-key="'+esc(p.key)+'" data-ids="'+esc(p.idA+','+p.idB)+'">忽视</button>'+
          '</div>'+
        '</div>';
      }).join('')
    : '';

  bar.innerHTML =
    '<div class="cf-main"><b>'+mainTxt+'</b>'+
      '<span class="cf-sub">'+subTxt+'</span></div>'+
    '<div class="cf-actions">'+
      '<button class="cf-toggle" id="cfToggle">明细 ▾</button>'+
      '<button class="cf-x" id="cfClose" title="收起提示">✕</button>'+
    '</div>'+
    '<div class="cf-pop" id="cfPop" hidden>'+
      '<div class="cf-chips">'+chips+'</div>'+
      '<div class="cf-sec">点击会议名或重叠条目，可跳转到对应日程卡片</div>'+
      hardBlock + pendingBlock +
    '</div>';

  var pop = $('cfPop');
  function setOpen(open){
    pop.hidden = !open;
    $('cfToggle').textContent = open ? '收起 ▴' : '明细 ▾';
  }
  $('cfToggle').onclick = function(){ setOpen(pop.hidden); };
  $('cfClose').onclick = function(){ bar.className = 'alertbar'; bar.innerHTML = ''; };

  // 点硬冲突明细文字 → 跳到该场会议所在周并高亮
  Array.prototype.forEach.call(pop.querySelectorAll('.cf-hard-text'), function(item){
    item.addEventListener('click', function(){
      jumpToEvent(item.getAttribute('data-a'));
    });
  });
  // 点会议名链接 → 跳转
  Array.prototype.forEach.call(pop.querySelectorAll('.cf-jump'), function(link){
    link.addEventListener('click', function(ev){
      ev.stopPropagation();
      jumpToEvent(link.getAttribute('data-a'));
    });
  });
  // 软冲突裁决按钮
  Array.prototype.forEach.call(pop.querySelectorAll('.cf-ok, .cf-bad'), function(btn){
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      var key = btn.getAttribute('data-key');
      var dec = btn.getAttribute('data-dec');
      setDecision(key, dec);
      saveState();
      renderWeek(); // 重新计算并重绘，卡片「冲突」标记随之更新
      if(window.__cfSetOpen) window.__cfSetOpen(true); // 保持浮层展开，便于连续裁决
      var tipTxt = dec === 'conflict' ? '已标记为冲突' : '已确认连开，不计冲突';
      if(BRIDGE.online && BRIDGE.authed && bridgeSupports('state')) tipTxt += '，已同步到云文档（手机端不再提示）';
      else if(BRIDGE.online && BRIDGE.features && !bridgeSupports('state')) tipTxt += '；同步服务是旧版本，重启后才会同步到手机';
      toast(tipTxt, 5000);
    });
  });
  // 忽视按钮（硬冲突 + 软冲突通用）
  Array.prototype.forEach.call(pop.querySelectorAll('.cf-ignore'), function(btn){
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      var key = btn.getAttribute('data-key');
      var ids = (btn.getAttribute('data-ids') || '').split(',').filter(Boolean);
      ignoreConflict(key, ids);
      renderWeek();
      if(window.__cfSetOpen) window.__cfSetOpen(true);
      toast((BRIDGE.online && BRIDGE.authed && bridgeSupports('state')) ? '已忽视该冲突，并同步到云文档' : '已忽视该冲突');
    });
  });

  // 点浮层外部自动收起（文档级监听只绑一次）
  window.__cfSetOpen = setOpen;
  if(!window.__cfDocBound){
    window.__cfDocBound = true;
    document.addEventListener('mousedown', function(ev){
      var p = document.getElementById('cfPop');
      if(!p || p.hidden) return;
      if(p.contains(ev.target)) return;
      var tg = document.getElementById('cfToggle');
      if(tg && (tg === ev.target || tg.contains(ev.target))) return;
      if(window.__cfSetOpen) window.__cfSetOpen(false);
    });
  }
}

// 跳转到某场会议所在周，滚动定位并高亮该卡片
function jumpToEvent(id){
  var e = state.events.find(function(x){ return x.id === id; });
  if(!e) return;
  var d = parseISO(e.date);
  if(d){
    var ws = startOfWeek(d);
    if(ws.getTime() !== (viewWeekStart && viewWeekStart.getTime())){
      viewWeekStart = ws;
      saveState();
    }
  }
  renderWeek();
  // 收起冲突浮层
  if(window.__cfSetOpen) window.__cfSetOpen(false);
  // 定位 + 高亮目标卡片
  var el = document.querySelector('.ev[data-id="'+id+'"]');
  if(!el) return;
  if(typeof el.scrollIntoView === 'function'){
    try{ el.scrollIntoView({ block:'center', behavior:'smooth' }); }
    catch(_){ el.scrollIntoView(); }
  }
  el.classList.add('flash');
  setTimeout(function(){ el.classList.remove('flash'); }, 2200);
}

/* ================= 搜索（模糊查找） ================= */
// 模糊匹配：去掉空白与常见标点后做「子串包含」判断，同时支持逐字顺序匹配（可跳字）
function fuzzyNorm(s){
  return String(s==null?'':s).toLowerCase().replace(/[\s\u3000，。、；：！？,.!?;:()（）【】\[\]「」『』"“”'‘’\-—_/\\·]/g, '');
}
function fuzzyMatch(haystack, needle){
  var h = fuzzyNorm(haystack), n = fuzzyNorm(needle);
  if(!n) return false;
  if(h.indexOf(n) >= 0) return true;               // 直接子串命中
  // 逐字顺序匹配（允许中间跳过字符，属于「模糊」）
  var i = 0;
  for(var j=0; j<h.length && i<n.length; j++){ if(h[j] === n[i]) i++; }
  return i === n.length;
}
// 会议可被搜索的字段：标题、地点、领导名、日期、时间、备注、原文
function eventSearchText(e){
  var leaders = (e.leaders||[]).map(function(l){ return l.name || l; }).join(' ');
  return [e.title, e.place, leaders, e.date, e.start, e.note, e.raw].filter(Boolean).join(' ');
}
function doSearch(){
  var q = $('searchInput').value;
  var pop = $('searchPop');
  var clearBtn = $('searchClear');
  clearBtn.classList.toggle('on', !!q.trim());
  if(!q.trim()){ pop.classList.remove('on'); pop.innerHTML = ''; return; }

  var results = [];
  state.events.forEach(function(e){
    if(fuzzyMatch(eventSearchText(e), q)){
      // 计算命中字段，用于展示
      results.push(e);
    }
  });
  // 按时间最新在前排序（日期 + 时间均降序；无时间的排到末尾）
  results.sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    var am = minutesOf(a.start)===null?-1:minutesOf(a.start);
    var bm = minutesOf(b.start)===null?-1:minutesOf(b.start);
    return bm - am;
  });

  var html = '';
  if(!results.length){
    html = '<div class="s-empty">没有匹配「'+esc(q)+'」的会议</div>';
  }else{
    html = '<div class="s-count">找到 '+results.length+' 场会议</div>';
    html += results.map(function(e){
      var leaders = (e.leaders||[]).map(function(l){ return l.name||l; }).join('、');
      var t = hl(e.title||'未命名会议', q);
      var place = e.place ? ' · '+hl(e.place, q) : '';
      var meta = esc(e.date) + (e.start ? ' '+esc(e.start) : '');
      return '<div class="s-item" data-id="'+esc(e.id)+'">'+
        '<div class="s-t">'+t+place+'</div>'+
        '<div class="s-meta">'+meta+'</div>'+
        (leaders ? '<div class="s-lead">'+hl(leaders, q)+'</div>' : '')+
      '</div>';
    }).join('');
  }
  pop.innerHTML = html;
  pop.classList.add('on');

  // 绑定点击跳转
  Array.prototype.forEach.call(pop.querySelectorAll('.s-item'), function(item){
    item.addEventListener('click', function(){
      var id = item.getAttribute('data-id');
      pop.classList.remove('on');
      $('searchInput').blur();
      jumpToEvent(id);
    });
  });
}
// 命中关键词高亮（不区分大小写；中文直接包含高亮）
function hl(text, q){
  var s = String(text==null?'':text);
  var key = q.trim();
  if(!key) return esc(s);
  var lower = s.toLowerCase(), kl = key.toLowerCase();
  var idx = lower.indexOf(kl);
  if(idx < 0){
    // 逐字匹配高亮较复杂，退化为不显式高亮，仅整串返回
    return esc(s);
  }
  return esc(s.slice(0, idx)) + '<mark>'+esc(s.slice(idx, idx+key.length))+'</mark>' + esc(s.slice(idx+key.length));
}

function renderSummary(byDate, days){
  var total = 0, city=0, internal=0, dept=0;
  days.forEach(function(d){
    var l = byDate[toISO(d)]||[];
    total += l.length;
    l.forEach(function(e){ if(e.type==='city') city++; else if(e.type==='internal') internal++; else dept++; });
  });
  var txt = '本周共 <b>'+total+'</b> 场会议';
  if(total) txt += '：市政府层面 '+city+' 场，局内部 '+internal+' 场，市直部门 '+dept+' 场。';

/* ================= 本地文件解析（Word / PDF / 图片，全程本机） ================= */
// 把本地文件发给同步服务做文本提取（docx→文字，pdf→文字，图片→OCR），拿到文字后回填解析框。
// 红线：提取全部在本机 Python 完成，不联网、不上传任何内容到公网。
// 批量入口：支持单个文件或文件数组；每个文件独立处理并给出成功/失败提示
function extractFiles(files){
  if(!files || !files.length){ toast('没有可处理的文件'); return; }
  var list = Array.prototype.slice.call(files);
  list.forEach(function(file){ extractLocalFile(file); });
}

function extractLocalFile(file, done){
  done = done || function(){};
  if(typeof file === 'undefined' || !file){
    toast('没有可处理的文件'); return;
  }
  var ext = (file.name || '').split('.').pop().toLowerCase();
  var isImg = /^(png|jpe?g|bmp|webp)$/.test(ext);
  var isPdf = ext === 'pdf';
  var isDoc = /^(docx|doc)$/.test(ext);
  if(!isImg && !isPdf && !isDoc){
    toast('「'+file.name+'」格式不支持，仅支持 Word(.docx)、PDF、图片(png/jpg/bmp/webp)'); return;
  }

  // 确保同步服务已探测
  function ensureBase(){
    BRIDGE.base = BRIDGE.base || bridgeBase();
    return Promise.resolve();
  }

  function post(buf){
    var url = (BRIDGE.base || '') + '/api/extract?name=' + encodeURIComponent(file.name || ('upload.' + ext));
    return fetch(url, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: buf
    }).then(function(r){
      return r.text().then(function(txt){
        var data = null;
        try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
        if(!r.ok || !data || !data.ok){
          var msg = (data && (data.message || data.error)) || ('HTTP ' + r.status);
          throw new Error(msg);
        }
        return data.text;
      });
    });
  }

  var fname = file.name || '文件';
  toast((isImg ? '正在本地识别「'+fname+'」…' : '正在本地解析「'+fname+'」…'), 8000);
  ensureBase().then(function(){
    if(file.arrayBuffer){
      return file.arrayBuffer().then(function(ab){ return post(ab); });
    }
    // 兜底：FileReader
    return new Promise(function(res, rej){
      var r = new FileReader();
      r.onload = function(){ post(r.result).then(res).catch(rej); };
      r.onerror = rej;
      r.readAsArrayBuffer(file);
    });
  }).then(function(text){
    if(!text || !text.trim()){
      toast('「'+fname+'」未提取到文字（扫描件/纯图片 PDF 请转成图片后粘贴）', 6000);
      done(null);
      return;
    }
    $('input').value = text;
    toast('✓ 「'+fname+'」解析成功，文字已填入，可点「解析并预览」', 5000);
    done(text);
  }).catch(function(e){
    // 口令未通过/服务未启动等
    toast('✗ 「'+fname+'」解析失败：' + e.message, 6000);
    done(null);
  });
}

// 处理粘贴的图片：base64 转成 Blob 后走 OCR
function handlePasteImage(imgSrc, filename){
  var name = filename || ('粘贴图片_' + Date.now() + '.png');
  try{
    var m = imgSrc.match(/^data:(image\/[a-zA-Z+]+);base64,(.*)$/);
    var mime = m ? m[1] : 'image/png';
    var b64 = m ? m[2] : imgSrc;
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    var blob = new Blob([bytes], { type: mime });
    // 塞进 File 对象
    var ext = (mime.split('/')[1] || 'png').replace('jpeg','jpg');
    var file = new File([blob], name.replace(/\.\w+$/, '') + '.' + ext, { type: mime });
    extractLocalFile(file);
  }catch(e){
    toast('图片处理失败：' + e.message, 5000);
  }
}

function doParse(){
  var text = $('input').value;
  if(!text.trim()){ toast('请先粘贴会议文本'); return; }
  var items = parseText(text, cfgForParse());
  // 「调出」「借调」「休假」这类人事状态不是会议，别导进日历
  items = items.filter(function(it){ return !personnelStatusOf(it.title) && !personnelStatusOf(it.raw); });
  // 「外出培训」也不是会议：单独拎出来，导入时转成日历上的培训占位
  previewTrainings = [];
  var meet = [];
  items.forEach(function(it){
    if(trainingMarkerOf(it.title)){ previewTrainings.push(it); return; }
    meet.push(it);
  });
  items = meet;
  if(!items.length){
    if(previewTrainings.length){
      var added = 0;
      previewTrainings.forEach(function(it){
        (it.leaders || []).forEach(function(l){
          if(addTraining({ leader: l.name || l, from: it.date, to: it.date, title: it.title, place: it.place })) added++;
        });
      });
      saveState(); renderWeek();
      toast(added ? ('识别为外出培训，已登记 '+added+' 条占位') : ('识别为外出培训，但这个名字没对应到领导，请到「🎓 外出培训」里手动登记'), 6000);
      return;
    }
    toast('没解析出带日期的会议，请检查文本里是否有「10月26日」这样的日期');
    return;
  }
  previewItems = items.map(function(it){
    return {
      date: it.date, start: it.start, place: it.place,
      title: it.title, type: it.type,
      leaders: it.leaders, note: it.note, raw: it.raw
    };
  });
  renderPreview();
  $('btnImport').textContent = '导入到日历（'+previewItems.length+'）';
  setPreviewVisible(true);
  try{ $('previewWrap').scrollIntoView({block:'start'}); }catch(e){}
  toast('解析出 '+previewItems.length+' 场会议，确认后点底部「导入到日历」');
}

function importPreview(){
  var items = previewItems.filter(function(x){return !x._skip && x.date;});
  if(!items.length){ toast('没有可导入的条目'); return; }
  var added = 0, dup = 0;
  items.forEach(function(it){
    var same = state.events.some(function(e){
      return e.date===it.date && e.title===it.title && (e.start||'')===(it.start||'');
    });
    if(same){ dup++; return; }
    state.events.push({
      id: 'ev_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      date: it.date, start: it.start||'', place: it.place||'',
      title: it.title||'未命名会议', type: it.type||'dept',
      leaders: it.leaders||[], note: it.note||'',
      createdAt: new Date().toISOString(),
      syncedAt: null
    });

  });
  saveState();
  renderWeek();
  setPreviewVisible(false);
  var tAdded = 0;
  (previewTrainings || []).forEach(function(it){
    (it.leaders || []).forEach(function(l){
      if(addTraining({ leader: l.name || l, from: it.date, to: it.date, title: it.title, place: it.place })) tAdded++;
    });

        (tAdded?'，登记外出培训 '+tAdded+' 条':'')+
        (added?'，待同步云文档 '+pendingEvents().length+' 条':''), 3800);
  // 跳转到本次导入最早一场所在周
  var dates = items.map(function(x){ return x.date; }).sort();
  var first = dates.length ? parseISO(dates[0]) : null;
  if(first) viewWeekStart = startOfWeek(first);
  else if(state.events.length){
    var all = state.events.map(function(e){ return e.date; }).sort();

  saveState();

    var a = $('aside'), m = $('asideMask');
    if(a) a.classList.remove('open');
    if(m) m.classList.remove('on');
  }
}

function isInWeek(iso, ws){
  var a = toISO(ws), b = toISO(addDays(ws,6));
  return iso>=a && iso<=b;
}

var trainEditId = null;
function trainingStatsAll(){
  var count = {}, days = {}, names = [];
  (state.trainings || []).forEach(function(t){
    if(count[t.leader] === undefined){ count[t.leader] = 0; days[t.leader] = 0; names.push(t.leader); }
    count[t.leader]++;
    days[t.leader] += trainingDaysOf(t);
  });
  names.sort(function(a, b){ return (days[b] - days[a]) || (count[b] - count[a]); });
  return { names: names, count: count, days: days };
}
function fmtSpan(t){
  var a = parseISO(t.from), b = parseISO(t.to || t.from);
  if(!a) return t.from;
  var s = (a.getMonth()+1)+'.'+a.getDate();
  if(!b || t.to === t.from) return s;
  return s + '—' + (b.getMonth()+1)+'.'+b.getDate();
}
