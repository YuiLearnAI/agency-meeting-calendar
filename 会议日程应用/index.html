    h += '<div class="live-card" style="margin-top:10px"><h4>待处理 ' + WATCH.items.length + ' 条</h4>';
    WATCH.items.forEach(function(it){
      h += '<p style="margin:4px 0">• ' + esc(it.name) + (it.ok ? '' : '（解析失败）') + '</p>';
    });
    h += '<div class="row" style="margin-top:8px"><button id="wShowAll">在右下角显示</button>' +
         '<button class="ghost" id="wClear">清空待办</button></div></div>';
  }

  h += '<p class="hint" style="margin-top:10px">只在本机解析，不联网、不上传。首次开启时，文件夹里已有的文件当作「已存在」，不会提醒；之后新放进去的通知才会提醒。</p>';

  $('modalBody').innerHTML = h;
  $('modalFoot').innerHTML = '<button class="ghost" id="wClose">关闭</button>' +
                             '<button class="primary" id="wSave">保存设置</button>';
  $('backdrop').hidden = false;

  var en = $('wEnabled'), fo = $('wFolder'), iv = $('wInterval');
  en.checked = cfg.enabled; fo.value = cfg.folder; iv.value = String(cfg.interval);
  if(!BRIDGE.online || !bridgeSupports('watch')){ en.disabled = true; fo.disabled = true; iv.disabled = true; $('wCheck').disabled = true; }

  // 常用位置
  function loadRoots(){
    var box = $('wRoots'); if(!box) return;
    bridgeFetch('/api/watch/roots').then(function(d){
      if(!d || !d.ok) return;
      box.innerHTML = '<div class="watch-tip">常用位置：</div>' + (d.roots || []).map(function(r, i){
        return '<button class="watch-chip" data-p="' + esc(r.path) + '">' + esc(r.label) + '</button>';
      }).join('');
    }).catch(function(){});
  }
  // 列出子目录，供逐级点选
  function loadDirs(p){
    var box = $('wDirs'); if(!box) return;
    box.innerHTML = '<div class="watch-tip">读取中…</div>';
    bridgeFetch('/api/watch/dirs', { method:'POST', body:{ dir:p } }).then(function(d){
      if(!d || !d.ok){ box.innerHTML = '<div class="watch-tip" style="color:var(--danger)">' + esc((d && d.message) || '无法读取该目录') + '</div>'; return; }
      var up = '';
      var parent = String(d.path || '').replace(/[\\\/]+$/, '');
      var pi = Math.max(parent.lastIndexOf('\\'), parent.lastIndexOf('/'));
      if(pi > 0){
        var upPath = parent.slice(0, pi);
        if(!/[\\\/]$/.test(upPath) && /^[A-Za-z]:$/.test(upPath)) upPath += '\\';
        up = '<button class="watch-chip up" data-p="' + esc(upPath) + '">↑ 上一级</button>';
      }
      box.innerHTML = '<div class="watch-tip">' + esc(d.path) + '</div>' + up +
        (d.dirs || []).map(function(nm){ return '<button class="watch-chip" data-p="' + esc(parent + '\\' + nm) + '">' + esc(nm) + '</button>'; }).join('') +
        (!(d.dirs || []).length ? '<div class="watch-tip">（该目录下没有子文件夹）</div>' : '');
    }).catch(function(){ box.innerHTML = '<div class="watch-tip" style="color:var(--danger)">无法读取</div>'; });
  }
  $('wRoots').addEventListener('click', function(e){
    var b = e.target.closest('button[data-p]'); if(!b) return;
    fo.value = b.getAttribute('data-p'); loadDirs(fo.value); doCheck();
  });
  $('wDirs').addEventListener('click', function(e){
    var b = e.target.closest('button[data-p]'); if(!b) return;
    fo.value = b.getAttribute('data-p'); loadDirs(fo.value);
  });
  function doCheck(){
    var msg = $('wCheckMsg');
    msg.textContent = '检查中…';
    bridgeFetch('/api/watch/check', { method:'POST', body:{ folder: fo.value.trim() } }).then(function(d){
      if(d && d.ok){
        msg.innerHTML = '✅ 可以监听，当前有 <b>' + d.count + '</b> 个可解析文件' +
          ((d.files || []).length ? '：' + d.files.map(function(f){ return esc(f); }).join('、') : '');
      }else{
        msg.innerHTML = '<span style="color:var(--danger)">✕ ' + esc((d && d.message) || '路径不可用') + '</span>';
      }
    }).catch(function(e){ msg.innerHTML = '<span style="color:var(--danger)">✕ ' + esc(e.message || '检查失败') + '</span>'; });
  }
  $('wCheck').addEventListener('click', doCheck);

  if(BRIDGE.online && bridgeSupports('watch')){
    loadRoots();
    loadDirs(fo.value || '');
  }

  if($('wShowAll')) $('wShowAll').addEventListener('click', function(){ WATCH.hidden = {}; renderWatchCards(); $('backdrop').hidden = true; });
  if($('wClear')) $('wClear').addEventListener('click', function(){
    if(!confirm('清空待处理列表？之后不会重复提醒这些文件。')) return;
    bridgeFetch('/api/watch/clear', { method:'POST' }).then(function(d){
      if(d && d.ok){ WATCH.rev = d.rev || (WATCH.rev + 1); WATCH.items = []; WATCH.parsed = {}; renderWatchCards(); updateWatchBadge(); }
      $('backdrop').hidden = true;
    }).catch(function(){ $('backdrop').hidden = true; });
  });

  $('wClose').addEventListener('click', function(){ $('backdrop').hidden = true; });
  $('wSave').addEventListener('click', function(){
    var wantEnabled = !!en.checked;
    var folder = fo.value.trim();
    if(wantEnabled && !folder){ toast('请先填写要监听的文件夹路径'); return; }
    var body = { enabled: wantEnabled, folder: folder, interval: parseInt(iv.value, 10) || 3000 };
    $('wSave').disabled = true;
    bridgeFetch('/api/watch/config', { method:'POST', body: body }).then(function(d){
      $('wSave').disabled = false;
      if(!d || !d.ok){ toast('保存失败，请重试'); return; }
      WATCH.enabled = !!d.enabled; WATCH.folder = d.folder || ''; WATCH.interval = d.interval || 3000;
      WATCH.rev = d.rev || 0;
      WATCH.items = d.pending || []; WATCH.parsed = {}; WATCH.hidden = {};
      renderWatchCards(); updateWatchBadge();
      $('backdrop').hidden = true;
      toast(wantEnabled ? ('已开始监听：' + folder + '，放入新通知就会提醒') : '文件夹监听已关闭', 4000);
      if(wantEnabled) watchStart();
    }).catch(function(e){ $('wSave').disabled = false; toast('保存失败：' + (e.message || '')); });
  });
}

/* ================= 初始化 ================= */
function init(){
  loadState();
  document.documentElement.setAttribute('data-theme', state.theme || 'light');
  viewWeekStart = parseISO(state.weekStart) || startOfWeek(new Date());
  viewWeekStart = startOfWeek(viewWeekStart);

  $('prevWeek').addEventListener('click', function(){ viewWeekStart = addDays(viewWeekStart,-7); saveState(); renderWeek(); });
  $('nextWeek').addEventListener('click', function(){ viewWeekStart = addDays(viewWeekStart,7); saveState(); renderWeek(); });
  $('todayBtn').addEventListener('click', function(){ viewWeekStart = startOfWeek(new Date()); saveState(); renderWeek(); });
  $('btnTheme').addEventListener('click', function(){
    state.theme = (state.theme==='dark') ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', state.theme);
    saveState();
  });
  $('btnParse').addEventListener('click', doParse);
  $('btnClearInput').addEventListener('click', function(){ $('input').value=''; setPreviewVisible(false); });

  /* ---- 文件上传（Word / PDF / 图片）---- */
  var fileInput = $('fileInput');
  function pickFile(accept){
    if(fileInput){
      fileInput.accept = accept;
      fileInput.value = '';
      fileInput.click();
    }
  }
  if($('btnFileWord')) $('btnFileWord').addEventListener('click', function(){ pickFile('.docx,.doc'); });
  if($('btnFilePdf')) $('btnFilePdf').addEventListener('click', function(){ pickFile('.pdf'); });
  if(fileInput){
    fileInput.addEventListener('change', function(){
      if(fileInput.files && fileInput.files.length) extractFiles(fileInput.files);
    });
  }

  /* ---- 粘贴图片 → 本地 OCR ---- */
  var inputEl = $('input');
  if(inputEl){
    inputEl.addEventListener('paste', function(e){
      var items = (e.clipboardData && e.clipboardData.items) || [];
      var imgItem = null;
      for(var i=0;i<items.length;i++){
        if(items[i] && items[i].type && items[i].type.indexOf('image/') === 0){ imgItem = items[i]; break; }
      }
      if(!imgItem) return; // 没有图片，正常粘贴文本
      var f = imgItem.getAsFile ? imgItem.getAsFile() : null;
      if(f){
        e.preventDefault();
        // 预览缩略图
        var pp = $('pastePreview');
        if(pp){
          pp.innerHTML = '<div class="paste-img-preview"><img src="'+URL.createObjectURL(f)+'" alt="粘贴图片"><span>已粘贴图片，正在本地识别文字…</span></div>';
        }
        extractLocalFile(f);
      }
    });
    // 拖拽文件到录入栏（整个左栏都是投放区），支持多文件
    // 关键：textarea 对 drop 有默认行为会「吃掉」文件，必须在 textarea 上直接 preventDefault；
    //       同时 document 层面阻止浏览器默认「拖文件打开新页面」。
    var asideEl = $('aside');
    var dropZone = asideEl || inputEl;
    function dragoverHandler(e){
      e.preventDefault();
      e.stopPropagation();
      if(e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
      dropZone.classList.add('dragover');
    }
    function dragleaveHandler(e){
      // 仅在真正离开投放区时移除高亮（子元素间移动会触发 leave，需判断 relatedTarget）
      if(!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('dragover');
    }
    function dropHandler(e){
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('dragover');
      var fs = e.dataTransfer && e.dataTransfer.files;
      if(fs && fs.length) extractFiles(fs);
      else toast('未识别到文件');
    }
    dropZone.addEventListener('dragover', dragoverHandler);
    dropZone.addEventListener('dragleave', dragleaveHandler);
    dropZone.addEventListener('drop', dropHandler);
    // textarea 自身也拦截，防止其默认行为吞掉文件
    inputEl.addEventListener('dragover', dragoverHandler);
    inputEl.addEventListener('drop', dropHandler);
    // 全局阻止：拖到日历等其他区域时，也不让浏览器默认打开文件
    window.addEventListener('dragover', function(e){ e.preventDefault(); });
    window.addEventListener('drop', function(e){ e.preventDefault(); });
  }

  /* ---- 搜索 ---- */
  var sInput = $('searchInput'), sPop = $('searchPop'), sClear = $('searchClear');
  if(sInput){
    sInput.addEventListener('input', doSearch);
    sInput.addEventListener('focus', function(){ if(sInput.value.trim()) doSearch(); });
    sInput.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ sPop.classList.remove('on'); sInput.blur(); }
      else if(e.key === 'Enter' && sPop.classList.contains('on')){
        var first = sPop.querySelector('.s-item');
        if(first) first.click();
      }
    });
    if(sClear) sClear.addEventListener('click', function(){
      sInput.value = ''; doSearch(); sInput.focus();
    });
    // 点搜索框外部收起结果
    document.addEventListener('click', function(e){
      if(sPop.classList.contains('on') && !sPop.contains(e.target) && e.target !== sInput){
        sPop.classList.remove('on');
      }
    });
  }
  $('btnCancelPv').addEventListener('click', function(){ setPreviewVisible(false); });
  $('btnImport').addEventListener('click', importPreview);
  $('btnSample').addEventListener('click', function(){
    $('input').value =
      '1. 10月26日（星期一）上午9:00，在B027会议室召开局党组会议，传达学习上级文件精神，请局党组成员参加。\n' +
      '2. 2026-10-27 14:30 市政府三楼会议室 全市住建领域安全生产工作视频会议 韩七\n' +
      '3. 10月28日下午3点 我局五楼会议室 物业管理工作例会，研究老旧小区改造推进情况 杜四 备注：需提前报送材料\n' +
      '4. 10月29日 9:30 B027 市政府督导组来鹰督查城市更新工作汇报会 杜四、谷六';
  });
  $('btnSettings').addEventListener('click', openSettings);
  /* ---- 文件夹监听：设置面板 + 右下角提醒卡片 ---- */
  if($('btnWatch')) $('btnWatch').addEventListener('click', openWatchPanel);
  if($('watchStack')){
    $('watchStack').addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('button[data-act]') : null;
      if(!btn) return;
      var card = btn.closest('.wcard');
      if(!card) return;
      var id = card.getAttribute('data-id');
      var act = btn.getAttribute('data-act');
      if(act === 'hide'){ WATCH.hidden[id] = true; renderWatchCards(); return; }
      if(act === 'import'){ watchImport(id); return; }
      if(act === 'view'){ watchView(id, false); return; }
      if(act === 'viewonly'){ watchView(id, true); return; }
      if(act === 'retry'){ watchRetry(id, btn); return; }
      if(act === 'ignore'){
        var nm = (watchItemOf(id) || {}).name || '';
        watchSettle(id, 'ignored');
        toast('已忽略「' + nm + '」，不再提醒');
        return;
      }
    });
  }
  $('btnData').addEventListener('click', openData);
  if($('btnRestart')) $('btnRestart').addEventListener('click', function(){ restartBridge(); });
  $('btnSync').addEventListener('click', function(){ openSync(false); });
  // 顶部的同步状态按钮：点开实时同步设置
  $('bridgeChip').addEventListener('click', function(){ openLivePanel(); });
  $('btnPull').addEventListener('click', function(){
    var btn = this;
    if(BRIDGE.online && BRIDGE.authed) return pullFromDoc(btn);
    if(BRIDGE.online) return openSync(false);
    probeBridge().then(function(on){
      if(on && BRIDGE.authed) pullFromDoc(btn);
      else openSync(false);
    });
  });
  updateSyncBadge();
  $('btnStats').addEventListener('click', function(){ setStatsOpen($('fp').hidden); });
  $('fpClose').addEventListener('click', function(){ setStatsOpen(false); });
  $('btnTrain').addEventListener('click', function(){ openTrainings(); });
  // 周 / 月 口径切换（两侧各自记住翻到的位置）
  Array.prototype.forEach.call(document.querySelectorAll('#fpScope button'), function(b){
    b.addEventListener('click', function(){
      state.statsScope = b.getAttribute('data-scope');
      if(state.statsScope === 'month' && !state.statsMonth){
        var d = viewWeekStart || new Date();
        state.statsMonth = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
      }
      saveState(); renderStats();
    });
  });
  // 上一段 / 下一段：月口径翻月，周口径翻周（互不带累对方）
  function shiftPeriod(n){
    if(state.statsScope === 'month'){
      var mk = statsMonthKey();
      var y = +mk.slice(0, 4), m = +mk.slice(5, 7);
      var d = new Date(y, m - 1 + n, 1);
      state.statsMonth = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    }else{
      state.statsWeek = toISO(addDays(statsWeekStart(), 7 * n));
    }
    saveState(); renderStats();
  }
  if($('fpMonthPrev')) $('fpMonthPrev').addEventListener('click', function(){ shiftPeriod(-1); });
  if($('fpMonthNext')) $('fpMonthNext').addEventListener('click', function(){ shiftPeriod(1); });
  // 点中间那段文字：回到当前这一周 / 月（恢复跟随日历）
  if($('fpMonthLabel')) $('fpMonthLabel').addEventListener('click', function(){
    if(state.statsScope === 'month') state.statsMonth = null;
    else state.statsWeek = null;
    saveState(); renderStats();
  });
  $('btnAllLeaders').addEventListener('click', openLeadersModal);
  if(state.statsOpen !== false) $('fp').hidden = false;
  $('modalClose').addEventListener('click', closeModal);
  $('backdrop').addEventListener('click', function(e){ if(e.target === $('backdrop')) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  // 首次打开：把云文档里已登记的历史会议一次性导进日历（依据随包快照，离线也能跑）
  importHistoryFromSnapshot();
  cleanupStatusEvents();   // 清掉以前误当会议导进来的「调出」「外出培训」等记录
  importTrainingsFromSnapshot();   // 把云文档里的「外出培训」格收成培训占位
  renderWeek();
  // 启动实时同步：连上同步服务且已登录时，自动读回一次最新内容，之后按间隔持续跟随
  rtBoot();

  /* ---- 响应式抽屉：窄屏下左侧录入栏收进抽屉 ---- */
  var aside = $('aside'), mask = $('asideMask');
  function openAside(){ aside.classList.add('open'); mask.classList.add('on'); }
  function closeAside(){ aside.classList.remove('open'); mask.classList.remove('on'); }
  if($('btnEntry')) $('btnEntry').addEventListener('click', openAside);
  if($('btnAsideClose')) $('btnAsideClose').addEventListener('click', closeAside);
  if(mask) mask.addEventListener('click', closeAside);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeAside(); });

  /* ---- 「更多」下拉菜单 ---- */
  var moreMenu = $('moreMenu'), moreBtn = $('btnMore');
  if(moreBtn && moreMenu){
    moreBtn.addEventListener('click', function(e){ e.stopPropagation(); moreMenu.hidden = !moreMenu.hidden; });
    document.addEventListener('click', function(e){
      if(moreMenu.hidden) return;
      if(!moreMenu.contains(e.target) && e.target !== moreBtn) moreMenu.hidden = true;
    });
    Array.prototype.forEach.call(moreMenu.querySelectorAll('button'), function(b){
      b.addEventListener('click', function(){ moreMenu.hidden = true; });
    });
  }
}

init();
</script>
</body>
